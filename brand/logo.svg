  <!-- staves -->
  <g stroke="#8a5420" stroke-width="10" stroke-linecap="round" opacity=".55">
    <line x1="182" y1="214" x2="182" y2="372"/>
    <line x1="236" y1="214" x2="236" y2="372"/>
    <line x1="290" y1="214" x2="290" y2="372"/>
  </g>
  <!-- hoops -->
  <rect x="120" y="226" width="232" height="20" rx="8" fill="#7a4a1c"/>
  <rect x="120" y="340" width="232" height="20" rx="8" fill="#7a4a1c"/>
  <!-- foam -->
  <path d="M116 190 a36 36 0 0 1 30 -56 a52 52 0 0 1 92 -22 a46 46 0 0 1 78 10 a36 36 0 0 1 40 54 a20 20 0 0 1 -14 30 H132 a20 20 0 0 1 -16 -16 z" fill="#f8efe0"/>
  <path d="M168 200 v26 a14 14 0 0 0 28 0 v-26 z M280 200 v40 a14 14 0 0 0 28 0 v-40 z" fill="#f8efe0"/>
</g>
</svg>
