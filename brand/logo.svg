<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Tavernworks</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#3a2416"/>
      <stop offset="1" stop-color="#15100c"/>
    </radialGradient>
    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c98a2e"/>
      <stop offset=".45" stop-color="#f5c873"/>
      <stop offset="1" stop-color="#b8782a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(-18 6)">
  <!-- handle -->
  <path d="M332 196 h34 a50 50 0 0 1 50 50 v62 a50 50 0 0 1 -50 50 h-34" fill="none" stroke="#e0a84a" stroke-width="30" stroke-linejoin="round"/>
