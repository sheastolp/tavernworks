<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>The Orrery · Tavernworks</title>
<meta name="description" content="The Orrery: explore the Grand Orrery. Pick a world, browse its maps, documents, character roster and enchanted items, and everything written about each one, or play Wake in Verrowen to make a character by role-playing in it.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
<link rel="manifest" href="/orrery/manifest.webmanifest">
<meta name="theme-color" content="#15100c">
<link rel="apple-touch-icon" href="/orrery/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15100c; --bg2:#1e1611; --card:#241a13; --line:#3a2a1d;
    --text:#f1e6d6; --muted:#b9a68f; --gold:#e0a84a; --gold2:#f5c873;
    --ember:#c9572b; --green:#7fb069; --mark:rgba(224,168,74,.32);
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:Inter,system-ui,sans-serif;color:var(--text);line-height:1.6;min-height:100vh;
    background:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(224,120,60,.14), transparent 70%),var(--bg)}
  a{color:var(--gold2)}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px}
  nav.top{padding:22px 0 0}
  .back{font-size:14px;color:var(--muted);text-decoration:none}
  header{padding:26px 0 18px}
  h1{font-family:Cinzel,serif;font-weight:800;font-size:clamp(28px,6vw,46px);line-height:1.1;
    background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#a8722a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sign{display:inline-block;font-family:Cinzel,serif;font-size:12px;letter-spacing:.3em;color:var(--gold);border:1px solid var(--line);padding:5px 14px;border-radius:999px;background:rgba(0,0,0,.25);margin-bottom:12px}
  .tag{color:var(--muted);margin-top:6px;max-width:680px}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px;align-items:center}
  .tabs a{font-family:Cinzel,serif;font-size:13px;letter-spacing:.12em;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 16px;background:rgba(0,0,0,.2)}
  .tabs a.on{color:var(--bg);background:var(--gold);border-color:var(--gold)}
  .worldpick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;font-family:Cinzel,serif;font-size:13px;letter-spacing:.12em;color:var(--gold)}
  .worldpick select{font:14px Inter,system-ui,sans-serif;letter-spacing:0;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
  .worldpick select:focus{outline:2px solid var(--gold);outline-offset:1px}
  .worldpick small{font:12.5px Inter,system-ui,sans-serif;letter-spacing:0;color:var(--muted)}
  form.find{margin-left:auto;display:flex;gap:6px;flex:1 1 240px;max-width:360px;min-width:0}
  form.find input{flex:1;min-width:0;width:0;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px}
  form.find button,.btn{background:transparent;border:1px solid var(--line);color:var(--gold2);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
  .status{color:var(--muted);font-size:14px;margin:8px 0}
  .clonebar{position:sticky;top:0;z-index:50;background:#3a2410;border-bottom:1px solid var(--gold);color:var(--text);font-size:14px;padding:9px 16px;text-align:center}
  .clonebar b{color:var(--gold2)}
  .clonebar a.jump{color:var(--gold2)}
  .status.err{color:var(--ember)}
  .status.hall{font-size:13px;margin-top:2px}
  .status.hall .warn{color:var(--ember)}
  .card .live{display:inline-block;font-size:11px;font-weight:600;color:var(--green);margin-left:6px;font-family:Inter,sans-serif;letter-spacing:0;vertical-align:middle}
  .live.rest,.card .live.rest{color:var(--muted)}
  .live.busy,.card .live.busy{color:var(--gold2)}
  .card .doing{margin-top:6px;font-size:12.5px;color:var(--text);opacity:.85}
  .hallnow{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 14px}
  .hallnow .live{margin-left:8px;font-size:12px;font-weight:600;color:var(--green)}
  .hallnow b{font-family:Cinzel,serif;color:var(--gold2);letter-spacing:.04em}
  .hallnow ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px}
  .hallnow li{margin:2px 0}
  .dbsum{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 16px}
  .dbsum .dblede{color:var(--muted);margin-top:6px}
  .dbsum .dblede b{color:var(--text)}
  .dbgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
  .dbcard{display:flex;flex-direction:column;gap:2px;background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;transition:.15s}
  .dbcard:hover{border-color:var(--gold)}
  .dbcard .dbn{font-family:Cinzel,serif;font-size:24px;color:var(--gold2);line-height:1.1}
  .dbcard .dbt{font-weight:600;font-size:13.5px;letter-spacing:.03em}
  .dbcard .dbd{font-size:12.5px;color:var(--muted);line-height:1.45}
  .dbsum .dbfoot{font-size:12.5px;color:var(--muted);margin-top:14px}
  main{padding:10px 0 50px}
  h2.sec{font-family:Cinzel,serif;color:var(--gold);letter-spacing:.08em;font-size:18px;margin:26px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
  .card.create{border-style:dashed;border-color:var(--gold)}
  .card{display:block;text-decoration:none;color:var(--text);background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card:hover{border-color:var(--gold)}
  .card b{display:block;font-family:Cinzel,serif;color:var(--gold2);font-size:16px}
  .card span{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
  .card .count{margin-top:8px;font-size:12px;color:var(--muted)}
  .panel{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:12px 0}
  .crumb{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
  .crumb a{color:var(--muted)}
  details.doc{margin:16px 0}
  details.doc>summary{cursor:pointer;font-family:Cinzel,serif;color:var(--gold);font-size:17px;letter-spacing:.06em;padding:6px 0}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted);margin-left:6px;font-family:Inter,sans-serif;letter-spacing:0;vertical-align:middle}
  .who{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
  .who a.pill{text-decoration:none}
  .pill.on{background:var(--gold);color:var(--bg)}
  .pill.pitch{background:rgba(224,120,60,.18);color:var(--ember);margin-left:0}
  h2.sec .pill{font-size:11px}
  /* Rolled scrolls: every fold in the Explorer. Shut, it's a wooden rod with
     a parchment label; open, the parchment unrolls down to a second rod. */
  .wood{background:linear-gradient(180deg,#2d190a,#7a4a20 22%,#c48a4c 42%,#9a6430 58%,#5a3414 80%,#2d190a)}
  details.cat{margin:16px 6px}
  details.cat>summary{position:relative;list-style:none;cursor:pointer;display:flex;justify-content:center;align-items:center;min-height:34px;padding:2px 14px}
  details.cat>summary::-webkit-details-marker{display:none}
  details.cat>summary::before,.rodend::before{content:"";position:absolute;left:0;right:0;top:50%;height:18px;transform:translateY(-50%);border-radius:9px;background:linear-gradient(180deg,#2d190a,#7a4a20 22%,#c48a4c 42%,#9a6430 58%,#5a3414 80%,#2d190a);box-shadow:0 5px 10px rgba(0,0,0,.5)}
  .knob{position:absolute;top:50%;width:16px;height:28px;transform:translateY(-50%);border-radius:45%;background:radial-gradient(circle at 38% 32%,#f5c873,#b07a2e 50%,#4a2a10 92%);box-shadow:0 2px 6px rgba(0,0,0,.5);z-index:1}
  .knob.l{left:-9px}.knob.r{right:-9px}
  .band{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;max-width:calc(100% - 30px);padding:5px 16px;border-radius:4px;background:#e9d6ae;color:#2b1d10;font-family:Cinzel,serif;font-weight:700;font-size:15px;letter-spacing:.06em;box-shadow:inset 0 0 8px rgba(110,68,26,.45),0 3px 8px rgba(0,0,0,.4);text-align:center}
  .band .pill{background:rgba(94,60,28,.16);color:#5e4429}
  .band::after{content:"⌄";font-family:Inter,sans-serif;font-weight:400;color:#8a2b12;margin-left:2px;transition:transform .3s}
  details.cat[open]>summary .band::after{transform:rotate(180deg)}
  details.cat>summary:hover .band{background:#f3e5c4}
  details.cat>summary:focus-visible .band{outline:2px solid var(--gold2);outline-offset:2px}
  .sheetwrap{display:grid;grid-template-rows:1fr;margin:-9px 8px -9px}
  details.cat[open]>.sheetwrap{animation:unroll .55s cubic-bezier(.3,.7,.3,1)}
  details.cat.rolling>.sheetwrap{animation:rollup .38s ease-in forwards}
  @keyframes unroll{from{grid-template-rows:0fr}to{grid-template-rows:1fr}}
  @keyframes rollup{from{grid-template-rows:1fr}to{grid-template-rows:0fr}}
  .sheet{min-height:0;overflow:hidden}
  /* The parchment: the page's colors turn to ink inside it, so cards, panels
     and pills on it follow along. */
  .sheet>.inner,.parchvars{--text:#2b1d10;--muted:#5e4429;--gold:#8a2b12;--gold2:#8a2b12;--card:#f4e8cb;--bg2:#e6d2a6;--line:rgba(94,60,28,.32);--green:#3f5a24}
  .sheet>.inner{color:var(--text);padding:24px clamp(12px,3vw,24px) 22px;background:radial-gradient(ellipse 60% 40% at 18% 12%,rgba(255,250,235,.55),transparent 70%),radial-gradient(ellipse 50% 45% at 85% 88%,rgba(128,78,26,.2),transparent 70%),linear-gradient(90deg,rgba(110,68,26,.3),transparent 4%,transparent 96%,rgba(110,68,26,.3)),#e9d6ae;box-shadow:inset 0 14px 16px -10px rgba(60,30,8,.6),inset 0 -14px 16px -10px rgba(60,30,8,.6)}
  .sheet>.inner a{color:var(--gold2)}
  .sheet>.inner .card{box-shadow:0 1px 3px rgba(60,30,8,.2)}
  .sheet>.inner .tag{color:var(--muted)}
  .sheet>.inner .pill{background:rgba(94,60,28,.12)}
  .sheet>.inner mark{background:#f5c873;color:#2b1d10}
  .sheet>.inner>.grid:last-child,.sheet>.inner>.panel:last-child{margin-bottom:0}
  .rodend{position:relative;height:34px}
  details.cat details.cat{margin:12px 4px}
  details.cat.doc .band{font-size:14px}
  @media (prefers-reduced-motion:reduce){details.cat[open]>.sheetwrap,details.cat.rolling>.sheetwrap,.bigscroll[open]>.sheetwrap{animation:none}}
  /* The Scroll tab: one big scroll that starts rolled up. */
  details.bigscroll>summary{list-style:none;cursor:pointer;display:flex;justify-content:center;align-items:center}
  details.bigscroll>summary::-webkit-details-marker{display:none}
  details.bigscroll>summary .band{font-size:clamp(14px,3.6vw,18px);padding:8px 22px;margin-top:-6px}
  details.bigscroll:not([open])>summary .band{margin:0}
  details.bigscroll>summary .band::after{content:"⌄"}
  details.bigscroll[open]>summary .band::after{transform:rotate(180deg)}
  .bigscroll>summary.rod{height:auto!important;min-height:28px;padding:0}
  .bigscroll>summary.rod .band{position:relative;top:0}
  .bigscroll[open]>.sheetwrap{animation:unroll .8s cubic-bezier(.3,.7,.3,1)}
  .bigscroll.rolling>.sheetwrap{animation:rollup .5s ease-in forwards}
  .bigscroll>.sheetwrap{margin:0}
  .bigscroll:not([open])+.rolledhint{display:block}
  .rolledhint{display:none;text-align:center;color:var(--muted);font-size:13.5px;margin-top:12px}
  .panel.rift{border-color:rgba(160,120,255,.45);background:linear-gradient(180deg,rgba(120,80,220,.14),var(--bg2))}
  .riftname{font-family:Cinzel,serif;color:var(--gold2);font-size:18px;letter-spacing:.06em}
  .riftlinks{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
  .riftlinks.inchat{margin:-4px 0 14px}
  .riftlinks .tag{margin:0}
  a.riftlink{display:inline-block;padding:6px 12px;border-radius:999px;border:1px solid rgba(160,120,255,.55);color:var(--text);text-decoration:none;font:600 13px Inter,sans-serif;background:rgba(120,80,220,.18)}
  a.riftlink:hover{background:rgba(120,80,220,.32)}
  details.doc>summary{list-style:none}
  details.doc>summary::-webkit-details-marker{display:none}
  details.doc>summary::before{content:"▸";display:inline-block;width:1em;transition:transform .15s}
  details.doc[open]>summary::before{transform:rotate(90deg)}
  /* Rendered Markdown */
  .md{font-family:Spectral,Georgia,serif;font-size:17px;line-height:1.6;overflow-wrap:anywhere}
  .md h1,.md h2,.md h3,.md h4{font-family:Cinzel,serif;color:var(--gold2);line-height:1.25;margin:1.1em 0 .4em}
  .md h1{font-size:26px;background:none;-webkit-background-clip:initial;color:var(--gold2)}
  .md h2{font-size:21px}.md h3{font-size:18px}.md h4{font-size:16px}
  .md>:first-child{margin-top:0}
  .md p,.md ul,.md ol,.md table,.md blockquote,.md pre{margin:.55em 0}
  .md ul,.md ol{padding-left:1.4em}
  .md li{margin:.2em 0}
  .md blockquote{border-left:3px solid var(--line);padding-left:12px;color:var(--muted)}
  .md code{font-family:ui-monospace,Menlo,monospace;font-size:.85em;background:rgba(0,0,0,.3);padding:1px 5px;border-radius:4px}
  .md pre{background:rgba(0,0,0,.3);padding:10px;border-radius:8px;overflow-x:auto}
  .md .tablewrap{overflow-x:auto}
  .md table{border-collapse:collapse;font-family:Inter,sans-serif;font-size:14.5px;min-width:100%}
  .md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
  .md th{color:var(--gold);background:rgba(0,0,0,.2)}
  .md img{max-width:100%;border-radius:10px;border:1px solid var(--line)}
  .md hr{border:0;border-top:1px solid var(--line);margin:1em 0}
  mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
  /* The passage a review summary entry links to. */
  .md h1,.md h2,.md h3,.md h4,.md h5,.md h6,.jumped{scroll-margin-top:72px}
  .jumped{background:var(--mark);border-radius:4px;outline:3px solid var(--mark);animation:jumped 3.5s ease-out forwards}
  @keyframes jumped{0%,55%{background:var(--mark);outline-color:var(--mark)}100%{background:transparent;outline-color:transparent}}
  .toc{columns:2 220px;font-size:14px;margin:8px 0 0;padding-left:1.2em}
  .toc a{color:var(--muted);text-decoration:none}.toc a:hover{color:var(--gold2)}
  .missing{border:1px dashed var(--line);border-radius:10px;padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
  .maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
  .maps figure img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
  .maps figcaption{font-size:14px;color:var(--muted);margin-top:6px}
  /* An item's facts: what it does, how it's made, its limits. */
  .facts{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px}
  .facts dt{font-family:Cinzel,serif;color:var(--gold);font-size:13px;letter-spacing:.06em;padding-top:3px}
  .facts dd{font-family:Spectral,Georgia,serif;font-size:17px;line-height:1.5}
  @media (max-width:560px){.facts{grid-template-columns:1fr;gap:2px}.facts dd{margin-bottom:8px}}
  .card .icon{font-size:22px;line-height:1;margin-bottom:6px}
  /* A beast's stat line, as GuildScribe fights with it. */
  .stats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .stats div{border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-align:center;min-width:64px;background:rgba(0,0,0,.18)}
  .stats small{display:block;font-family:Cinzel,serif;color:var(--gold);font-size:11px;letter-spacing:.08em}
  .stats b{font-size:16px;color:var(--text)}
  .lines{font-family:Spectral,Georgia,serif;font-style:italic;color:var(--muted);font-size:16px;line-height:1.5;padding-left:1.2em;margin:0}
  .maps.one{grid-template-columns:minmax(0,640px)}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 0 40px}
  /* The chat: the local AI helps create and review characters, like Wake in Verrowen's narrator. */
  .ai{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.05);color:var(--muted)}
  .ai.live{background:rgba(127,176,105,.15);color:var(--green)}
  .ai.down{background:rgba(201,87,43,.15);color:var(--ember)}
  .chatbox{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;height:min(76vh,740px);min-height:440px;overflow:hidden;margin-top:6px}
  .chathead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-family:Cinzel,serif;color:var(--gold);letter-spacing:.12em;font-size:13px}
  .chathead .about{font-family:Inter,sans-serif;letter-spacing:0;color:var(--muted);font-size:13px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chatlog{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:16px}
  .say{max-width:68ch;white-space:pre-wrap;font-family:Spectral,Georgia,serif;font-size:17.5px;line-height:1.6}
  .say::before{display:block;font-family:Cinzel,serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:2px;white-space:normal}
  .say.keeper::before{content:"The Lore-keeper";color:var(--muted)}
  .say.me{align-self:flex-end;background:rgba(0,0,0,.25);border:1px solid var(--line);border-left:3px solid var(--gold);padding:10px 14px;border-radius:10px;font-size:16.5px}
  .say.me::before{content:"You";color:var(--gold)}
  .say.writing{color:var(--muted);font-style:italic}
  .say{position:relative}
  .say.keeper{padding-right:34px}
  .say.me{padding-right:40px}
  .chatbox button.copymsg{position:absolute;top:-4px;right:0;padding:4px 6px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);opacity:.55;line-height:0;font-size:0}
  .say.me button.copymsg{top:6px;right:6px}
  .say:hover button.copymsg,.chatbox button.copymsg:focus-visible{opacity:1;border-color:var(--line)}
  .chatbox button.copymsg:hover{color:var(--gold2)}
  .chatbox button.copymsg.done{opacity:1;color:var(--green)}
  .copymsg svg{width:16px;height:16px;display:block}
  .ownerrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ownerrow input{flex:1;min-width:180px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;font:inherit;font-size:15px;padding:8px 10px}
  .chatstart{display:flex;flex-direction:column;gap:12px;max-width:640px}
  .chatstart h3{font-family:Cinzel,serif;font-size:18px;color:var(--gold2)}
  .chatstart .note,.chatnote{font-size:13.5px;color:var(--muted)}
  .chatstart .opt{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.22)}
  .chatstart .opt b{font-weight:600;font-size:15px}
  .chatstart .opt small{color:var(--muted);font-size:13px}
  .chatbox textarea,.chatbox select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;font:inherit}
  .chatbox textarea{width:100%;min-height:60px;max-height:200px;resize:vertical;padding:9px 12px;font-size:16px;display:block}
  .chatbox select{padding:8px 10px;font-size:15px;max-width:100%}
  .chatbox textarea:focus,.chatbox select:focus,.chatbox button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .chatbox .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chatbox button{font-family:Cinzel,serif;font-size:13px;letter-spacing:.08em;border-radius:8px;padding:9px 15px;cursor:pointer;border:1px solid var(--gold);background:transparent;color:var(--gold2)}
  .chatbox button.primary{background:var(--gold);color:var(--bg);font-weight:800}

    .say{font-size:17px;line-height:1.55}

    .chatstart .chips button{padding:8px 10px;font-size:13.5px}

  /* The chat fills the visible screen on every device, so the message bar is
     always on screen. The bar is one row: ← Back on the left, the message

     in a row above it; on phones they fold away behind ⋯ in the header. */
  .chatbox{position:relative}

  .chatlog{position:relative;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:var(--line) transparent}

    .composer{gap:6px}
    .composer .extras{display:none;flex-wrap:wrap}
    .composer .extras.open{display:flex}
    .composer .extras button{flex:1 1 auto;min-height:44px}
    .saybar{gap:6px}
    .saybar button{min-width:44px;padding:8px 10px}
    .saybar #sendSay{font-family:Inter,sans-serif;letter-spacing:0;font-size:18px;padding:8px 14px}
    .saybar #sendSay .ico{display:inline}
    .saybar #sendSay .txt,.saybar #stopSay .txt{display:none}
  }
  /* Back to the newest message after scrolling up through the chat. */
  .chatbox button.tolatest{position:absolute;left:50%;transform:translateX(-50%);z-index:3;font-family:Inter,sans-serif;letter-spacing:0;font-size:13.5px;padding:8px 16px;border-radius:999px;background:var(--card);border-color:var(--gold);box-shadow:0 4px 16px rgba(0,0,0,.45)}

  /* The live-link pill in the chat header: tap it to check the laptop now. */
  .chatbox button.ai{font:600 11px Inter,system-ui,sans-serif;letter-spacing:0;padding:4px 10px;border:0;border-radius:999px;background:rgba(255,255,255,.05);color:var(--muted);white-space:nowrap;flex:0 0 auto}

  .chatbox button.ai.down{background:rgba(201,87,43,.15);color:var(--ember)}

  @media (prefers-reduced-motion:reduce){.chatbox button.ai{animation:none!important}}

  .chatextras .writeup{margin-top:0}
  .chatbox button.linkbtn{background:none;border:0;padding:0;color:var(--gold2);font:inherit;letter-spacing:0;text-decoration:underline}
  /* Phones: an open chat takes the whole screen, sized to what's visible above
     the keyboard, so there's one thing to scroll (the messages) and the

  @media (max-width:600px){
    html:has(body.chatfull),body.chatfull{overflow:hidden;overscroll-behavior:none}

  [data-install] button{font-size:13px;padding:4px 12px;margin-left:8px}
  /* The Scroll: the whole Orrery as one parchment ledger, rolled on two rods. */
  .scroll{--ink:#2b1d10;--ink2:#5e4429;--rule:rgba(94,60,28,.32);--red:#8a2b12;--leaf:#3f5a24;max-width:920px;margin:6px auto 0;padding:0 14px}

  .scroll .rod::before,.scroll .rod::after{content:"";position:absolute;top:-6px;width:24px;height:40px;border-radius:45%;background:radial-gradient(circle at 38% 32%,#f5c873,#b07a2e 50%,#4a2a10 92%);box-shadow:0 3px 8px rgba(0,0,0,.5)}
  .scroll .rod::before{left:-16px}.scroll .rod::after{right:-16px}
  .parch{position:relative;margin:-10px 0;padding:46px clamp(16px,6vw,68px) 50px;color:var(--ink);font-family:Spectral,Georgia,serif;font-size:17px;line-height:1.55;
    background:radial-gradient(ellipse 60% 40% at 18% 12%,rgba(255,250,235,.55),transparent 70%),radial-gradient(ellipse 50% 45% at 85% 88%,rgba(128,78,26,.2),transparent 70%),radial-gradient(ellipse 40% 30% at 70% 30%,rgba(150,100,40,.08),transparent 70%),linear-gradient(90deg,rgba(110,68,26,.3),transparent 5%,transparent 95%,rgba(110,68,26,.3)),#e9d6ae;
    box-shadow:inset 0 18px 20px -12px rgba(60,30,8,.6),inset 0 -18px 20px -12px rgba(60,30,8,.6)}
  .parch a{color:var(--red)}

  .parch h2.title{font-family:Cinzel,serif;font-weight:800;text-align:center;font-size:clamp(24px,5vw,38px);line-height:1.15;color:var(--ink);margin:6px 0 4px}
  .parch .orn{text-align:center;color:var(--red);font-size:20px;letter-spacing:.6em;margin:2px 0 10px}
  .parch .lede{text-align:center;font-style:italic;color:var(--ink2);max-width:600px;margin:0 auto}

  .ledgerbar{margin:22px 0 6px;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}

  .ledgerbar .kinds{display:flex;flex-wrap:wrap;gap:6px}

  .ledgerbar button.on{background:var(--ink);color:#f3e4c2;border-color:var(--ink)}
  .ledgerbar .opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:12.5px Inter,sans-serif;color:var(--ink2)}

  .ledgerbar select{border-radius:6px;background:rgba(255,250,235,.5)}

  .chap>h3 small{display:block;font:italic 14px Spectral,serif;color:var(--ink2);letter-spacing:0;margin-top:2px}
  .chap>h4{display:flex;align-items:center;gap:12px;font-family:Cinzel,serif;font-size:14px;letter-spacing:.1em;color:var(--ink2);margin:20px 0 4px}
  .chap>h4::before,.chap>h4::after{content:"";flex:1;border-top:1px solid var(--rule)}
  /* The Scroll's groups are folds of their own: each starts rolled up, so
     the chapters read as headings and counts until a group is unrolled. */
  details.grp>summary{display:flex;align-items:center;gap:12px;font-family:Cinzel,serif;font-size:14px;letter-spacing:.1em;color:var(--ink2);margin:20px 0 4px;cursor:pointer;list-style:none}

  details.grp>summary::before,details.grp>summary::after{content:"";flex:1;border-top:1px solid var(--rule)}

  details.grp>summary .chev{color:var(--red);font-family:Inter,sans-serif;letter-spacing:0;transition:transform .3s}

  .entries{list-style:none;padding:0;margin:0}
  .entry{border-bottom:1px solid rgba(94,60,28,.12)}

  .entry .ic{font-size:16px;line-height:1}

  .entry .st.pend{color:var(--red)}
  .entry details[open] summary .nm{color:var(--red)}
  .rec{margin:2px 0 12px calc(1.7em + 8px);padding:10px 14px;border-left:2px solid var(--red);background:rgba(255,250,235,.35);border-radius:0 8px 8px 0}
  .rec dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px}
  .rec dt{font-family:Cinzel,serif;font-size:12px;letter-spacing:.06em;color:var(--ink2);padding-top:3px}
  .rec dd{font-size:16px;line-height:1.45;overflow-wrap:anywhere}
  .rec .acts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font:13px Inter,sans-serif}
  .rec img{display:block;max-width:100%;border-radius:6px;border:1px solid var(--rule);margin:8px 0 2px}

  .rec .refs a{text-decoration:none}
  .parch .colophon{text-align:center;font-style:italic;color:var(--ink2);font-size:14px;margin-top:36px}
  .parch .none{text-align:center;font-style:italic;color:var(--ink2);margin:30px 0}
  @media (max-width:560px){
    .scroll{padding:0 8px}
    .scroll .rod{margin:0 -8px;height:22px}

    .ledgerbar input,.ledgerbar select{font-size:16px}
  }
  @media print{nav.top,header,footer,.ledgerbar,.scroll .rod{display:none!important}.parch{box-shadow:none;background:#fff}details.grp:not([open])>ol{display:block}}
</style>

// /tree/ (see the server README), so the Explorer reads the canon from
// there and GitHub's limits stop mattering. RAW is the branch's folder on
// the laptop; load() checks the branch head (also from the laptop) so a

const GATE = "https://sheamus-tuf-gaming-fx705dt-fx705dt.tail2c8da4.ts.net:8443";
const RAW_BASE = GATE + "/files/";
let RAW = RAW_BASE + BRANCH + "/";
if (CLONE) {
  document.title = "Review Clone · " + document.title;
  const m = document.createElement("meta"); m.name = "robots"; m.content = "noindex, nofollow"; document.head.appendChild(m);

// The worlds of the Grand Orrery. The picker in the header chooses one: the

// the Orrery's database (every decided world), and nothing about a world is
// written here. Only its game is, since the game lives on this site.
const WORLDS = [{ id: "", name: "the Orrery", note: "" }];
let world = WORLDS.find((w) => w.id === localStorage.getItem("orrery-world")) || WORLDS[0];
function showWorld() {

  $("worldNote").textContent = world.note;

// ── The catalog: which documents, maps and worlds there are ──
// The Orrery's database lists every document (each *.md in grand-orrery),
// every map (each maps/*.png, captioned from maps/README.md) and every world,
// so the Explorer shows what the Orrery has: a new document, map or world
// shows up here on its own, with no change to this page. Nothing about the
// universe is written into this page: the Orrery is the only copy (the
// browser keeps its last good read, see /orrery-db.js).
// The Explorer's own short ids for the documents it links to by name.
const DOC_ID = { "universe.md": "universe", "working-notes.md": "notes", "lore.md": "lore", "roster.md": "roster", "resources.md": "resources", "bestiary.md": "bestiary", "midkemia.md": "midkemia", "rifts.md": "rifts", "README.md": "readme", "maps/README.md": "maps" };
// The games that live on this site, by world.
const WORLD_GAME = { verrowen: { play: "/verrowen/", game: "Wake in Verrowen" } };
let catalogKey = "";
// The places the Orrery names in this world (its decided places and every
// label on its maps), for the lore-keeper's prompts, topics and examples.
function worldPlaces(){
  const out = new Set();
  for (const e of orrery ? orrery.list("place") : []) if (e.status === "decided" && e.name) out.add(e.name);
  for (const l of MAPLABELS) out.add(l.label);
  return [...out];
}
function worldBrief(){
  const ps = worldPlaces();
  return `${world.name} is a whole world, and no one place in it is its center. Unless asked about one place, set new things across the whole world${ps.length ? `: ${ps.slice(0, 30).join(", ")}, and beyond` : ""}. Don't put something in a place just because it's the best-described one.`;
}
// An example of a change in plain words, about someone in the roster.
function changeExample(){
  const p = PEOPLE.find((x) => !/^The /.test(x.name) && x.group !== "Roles still to fill");
  return p ? `“rename ${p.name} to …”` : "“rename someone”";
}
// The topics' words that are names come from the Orrery: its places, and
// the groups its people belong to.
const topicWords = {};
function orreryWords(kind){
  const names = kind === "place" ? worldPlaces() : [...new Set(PEOPLE.flatMap((p) => [p.group, ...String((orrery && p.dbId && (orrery.get(p.dbId) || {}).section) || "").split(":")]).map((x) => String(x || "").trim()).filter((x) => x.length > 3))];
  const key = kind + names.length;
  if (!topicWords[key]) topicWords[key] = names.length ? new RegExp(`\\b(${names.map((n) => reEsc(n).replace(/^The /i, "(?:the )?")).join("|")})\\b`, "gi") : null;
  return topicWords[key];
}

// Rebuilds DOCS, MAPS and WORLDS from the database. True if anything changed.
function syncCatalog(){
  if (!orrery) return false;
  const byOrder = (a, b) => (a.order || 0) - (b.order || 0);
  const docs = orrery.list("document").sort(byOrder), maps = orrery.list("map").sort(byOrder);
  const worlds = orrery.list("world").filter((w) => w.status === "decided");
  const key = JSON.stringify([docs.map((d) => [d.file, d.name, d.sub]), maps.map((m) => [m.file, m.name, m.caption]), worlds.map((w) => [w.id, w.name])]);
  if (key === catalogKey) return false;
  catalogKey = key;
  if (docs.length) {
    const used = new Set();
    DOCS.splice(0, DOCS.length, ...docs.filter((d) => /^(maps\/)?[^/]+\.md$/i.test(d.file)).map((d) => {
      let id = DOC_ID[d.file] || idOf(d.file.replace(/\.md$/i, "")) || "doc";
      while (used.has(id)) id += "-2";
      used.add(id);
      return { id, file: d.file, title: d.name, sub: d.sub || d.file };
    }));
  }
  if (maps.length) MAPS.splice(0, MAPS.length, ...maps.filter((m) => /^maps\/[^/]+\.png$/i.test(m.file)).map((m) => ({ file: m.file, title: m.name, caption: m.caption || "" })));
  if (worlds.length) {
    WORLDS.splice(0, WORLDS.length, ...worlds.map((w) => {
      const people = orrery.list("person").filter((p) => p.world === w.id).length;
      return { id: w.id, name: w.name, note: people ? people + " people in the roster" : "", ...(WORLD_GAME[w.id] || {}) };
    }));
    world = WORLDS.find((w) => w.id === world.id) || WORLDS.find((w) => w.id === localStorage.getItem("orrery-world")) || WORLDS[0];
    showWorld();
  }
  return true;
}
const DOCS = [];   // from the database (syncCatalog), and any other .md in the repo (findDocs)
const MAPS = [];   // from the database (syncCatalog)
// orrery.json (in grand-orrery) lists documents and maps the owner added on
// the admin page, so they show up here without a code change.
function addExtras(j){
  if (!j || typeof j !== "object") return;
  for (const d of Array.isArray(j.documents) ? j.documents : []) {
    if (!d || !/^[a-z0-9][a-z0-9-]{0,60}\.md$/.test(d.file) || DOCS.some((x) => x.file === d.file)) continue;
    let id = String(d.id || d.file.slice(0, -3)).replace(/[^a-z0-9-]/g, "") || "doc";
    while (DOCS.some((x) => x.id === id)) id += "-2";
    DOCS.splice(Math.max(0, DOCS.findIndex((x) => x.id === "readme")), 0, { id, file: d.file, title: String(d.title || d.file).slice(0, 100), sub: String(d.sub || "").slice(0, 160) });
  }
  for (const m of Array.isArray(j.maps) ? j.maps : []) {
    if (!m || !/^maps\/[a-z0-9][a-z0-9-]{0,40}\.png$/.test(m.file) || MAPS.some((x) => x.file === m.file)) continue;
    MAPS.push({ file: m.file, title: String(m.title || m.file).slice(0, 80), caption: String(m.caption || "").slice(0, 300) });
  }
}
// Every Markdown document in grand-orrery (at the top and in maps/), so
// each one can be read here, not only the ones listed above. The tree
// comes from the laptop's mirror (GitHub's API is the fallback); without
// either, the list above and orrery.json still show.
async function findDocs(sha){
  try{
    const r = await fetch(GATE + "/tree/" + BRANCH, { cache: "no-store" }).catch(() => null);
    const j = r && r.ok ? await r.json() : await fetch("https://api.github.com/repos/sheastolp/grand-orrery/git/trees/" + (sha || BRANCH) + "?recursive=1", { cache: "no-store" }).then((x) => (x.ok ? x.json() : null)).catch(() => null);
    if (!j) return;
    for (const t of j.tree || []) {
      if (t.type !== "blob" || !/^(maps\/)?[^/]+\.md$/i.test(t.path) || DOCS.some((d) => d.file === t.path)) continue;
      let id = idOf(t.path.replace(/\.md$/i, "")) || "doc";
      while (DOCS.some((d) => d.id === id)) id += "-2";
      DOCS.splice(Math.max(0, DOCS.findIndex((d) => d.id === "readme")), 0, { id, file: t.path, title: t.path, sub: t.path, found: true });
    }
  }catch(e){}
}
// Where things are: every label on every map, read from the maps' SVGs (the
// marks placed on the admin page included). An item is placed where a map
// names it, or where its text names a place a map shows.
let MAPLABELS = [];
const GENERIC_LABEL = /^(n|e|s|w|the|a|an|and|map|key|legend|grain|river|lumber|mills|landing|footpath|troll|rough sketch.*|.*not to scale.*|north gate|south gate|east gate|west gate|.*\bgate)$/i;
async function readMapLabels(bust){
  const got = await Promise.all(MAPS.map((m) => fetch(RAW + m.file.replace(/\.png$/, ".svg") + (bust || ""), { cache: "no-store" }).then((r) => (r.ok ? r.text() : "")).catch(() => "")));
  MAPLABELS = [];
  MAPS.forEach((m, k) => {
    if (!got[k]) return;
    let svg;
    try{ svg = new DOMParser().parseFromString(got[k], "image/svg+xml"); }catch(e){ return; }
    const seen = new Set();
    const add = (raw, placed) => {
      const label = String(raw || "").replace(/\s+/g, " ").replace(/[:;,.]+$/, "").trim();
      const key = label.toLowerCase().replace(/^the /, "");
      // The map's own title isn't a place on it.
      if (key === m.title.toLowerCase().replace(/^the /, "")) return;
      if (key.length < 4 || label.length > 40 || /\d/.test(label) || GENERIC_LABEL.test(label) || seen.has(key)) return;
      // Labels are names: starting with a capital, or placed from the admin page.
      if (!placed && (!/^(the |The )?[A-Z]/.test(label) || /'s$/.test(label))) return;
      seen.add(key);
      MAPLABELS.push({ map: m, label, placed, re: new RegExp(`(?<![\\w-])(?:the\\s+)?${reEsc(key).replace(/ /g, "\\s+")}(?![\\w])`, "i") });
    };
    svg.querySelectorAll("#orrery-added > g[data-label]").forEach((g) => add(g.getAttribute("data-label"), true));
    // A label that only points somewhere else ("Stoutwell (off the map, north)") isn't a place on this map.
    svg.querySelectorAll("text").forEach((t) => { const next = t.nextElementSibling; if (!t.closest("#orrery-added") && !(next && /^\(?off the map/i.test(next.textContent || ""))) add(t.textContent, false); });
  });
}
// The labels an item is placed at: a map label that is its name (or one of
// its names), or a place its own text names. Specific places beat broad ones.
function placesOf(it){
  if (it._places) return it._places;
  const test = (l, t) => { l.re.lastIndex = 0; return l.re.test(t); };
  // 📍 A map that names it, or the places its **Where:** line names.
  let own = MAPLABELS.filter((l) => it.names.some((n) => new RegExp(`^(?:the\\s+)?(?:${n})$`, "i").test(l.label)) || (it.where && test(l, it.where)));
  if (own.some((l) => !broadLabel(l))) own = own.filter((l) => !broadLabel(l));
  // Then the places its own text names, leaving out the broad ones (a whole
  // village or kingdom) that most entries name; failing that, its category's.
  let named = MAPLABELS.filter((l) => !own.includes(l) && !broadLabel(l) && test(l, itemText(it)));
  // With a 📍 place known, only other places on those same maps add anything.
  if (own.length) named = named.filter((l) => own.some((o) => o.map === l.map));
  if (!own.length && !named.length) { const c = CATS.find((x) => x.name === it.cat); if (c && c.intro) named = MAPLABELS.filter((l) => !broadLabel(l) && test(l, c.intro)); }
  return (it._places = { own, named });
}
// A label most entries mention (Stoutwell, the Kingdom) says little about where a thing is.
function broadLabel(l){
  if (l._broad == null) { const n = ITEMS.filter((it) => { l.re.lastIndex = 0; return l.re.test(itemText(it)); }).length; l._broad = n > Math.max(4, ITEMS.length * 0.08); }
  return l._broad;
}
// ── The Orrery database ──
// People, items, beasts and places come from the Grand Orrery's database
// (grand-orrery's tools/build.mjs compiles every document into one record
// per thing, published to its data branch), read with the same client every
// Tavernworks app uses (/orrery-db.js). The documents are still read for the Documents tab,
// the maps and the "every section that mentions them" pages.
let orrery = null, orreryReview = null;
async function readDb() {
  try {
    orrery = await OrreryDB.fresh(BRANCH);
    // The live Orrery also shows Wake in Verrowen characters waiting on review.
    if (!CLONE && !orreryReview) orreryReview = await OrreryDB.get("review");
  } catch (e) { console.error("orrery database", e); }
  return !!(orrery && orrery.list().length);
}
// A record's status, as the documents' tags say it.
const STATUS_LABEL = { decided: "Your idea", pitch: "Pitch", open: "Not decided yet", "dm-lore": "DM lore", draft: "Rough draft" };
const statusLabel = (s) => STATUS_LABEL[s] || "";
// A field key from the database ("in_guildscribe") as a label ("In GuildScribe").
const FIELD_LABEL = { in_guildscribe: "In GuildScribe" };
const fieldLabel = (k) => FIELD_LABEL[k] || (k.charAt(0).toUpperCase() + k.slice(1)).replace(/_/g, " ");
const fieldText = (v) => (Array.isArray(v) ? v.join("; ") : String(v ?? ""));
// What isn't a "- **Field:** value" bullet (or a list under one) is the body.
const bodyOf = (e) => String(e.body || "").split("\n").filter((l) => !/^\s*[-*]\s+\*\*[^*:]+:\*\*/.test(l) && !/^\s{2,}[-*]\s/.test(l) && !/^_(From |Made up by ).*_\s*$/.test(l)).join("\n").trim();

// The roster: every person in the database, grouped the way the roster reads.
// `names` are case-sensitive patterns matched as whole words, used to find
// what each document says about them.
let PEOPLE = [];
// The roster's groups come in the Orrery's own order (the order its people
// are listed in); these groups the Explorer makes itself go last.
const GROUP_LAST = ["GuildScribe's adventurers", "From Wake in Verrowen", "New at GuildScribe (not in the canon yet)", "Other worlds", "Roles still to fill"];
const NAME_SKIP = new Set(["The", "Old", "Widow", "King", "Queen", "Reformed", "Cutpurse", "Unlucky", "Threadbare", "Wandering", "Family"]);
function groupOf(p) {
  if (p.kind === "adventurer") return "GuildScribe's adventurers";
  if (p.group) return p.group;
  // Someone from another world is grouped under that world's name.
  if (p.world && world.id && p.world !== world.id) return (orrery && orrery.get(p.world) || {}).name || "Other worlds";
  // "Place: part" sections group by the place.
  const [where] = String(p.section || "").split(":").map((s) => s.trim());
  return where || "Others";
}
function roleOf(p) {
  if (p.kind === "adventurer") return [[p.race, String(p.class || "").toLowerCase()].filter(Boolean).join(" "), [p.level != null && "level " + p.level, p.rank].filter(Boolean).join(", "), (p.companies || []).join(", ")].filter(Boolean).join(" · ");
  const who = [p.race && p.race !== "Unknown" ? p.race : "", p.age != null ? String(p.age) : ""].filter(Boolean).join(", ");
  return [who, p.role || p.line || ""].filter(Boolean).join(" · ");
}
function buildPeople() {
  const all = orrery ? orrery.list("person").filter((p) => p.kind !== "wake-character") : [];
  // A word of a name finds them on its own ("Larkspur") when no one else's name has it.
  const words = (n) => n.split(/\s+/).filter((w) => /^[A-ZÀ-Ý]/.test(w) && w.length > 3 && !NAME_SKIP.has(w));
  const count = new Map();
  for (const p of all) for (const w of new Set(words(p.name))) count.set(w, (count.get(w) || 0) + 1);
  const full = (n) => (/^The /.test(n) ? "[Tt]he " + reEsc(n.slice(4)) : reEsc(n));
  const people = all.map((p) => ({
    group: groupOf(p), id: p.kind === "adventurer" && p.played_by ? "adv-" + String(p.played_by).toLowerCase() : p.id, dbId: p.id,
    name: p.name, role: roleOf(p), line: p.line || "", status: statusLabel(p.status),
    names: p.kind === "adventurer" && p.played_by ? [reEsc(p.played_by)] : [...new Set([full(p.name), ...words(p.name).filter((w) => count.get(w) === 1).map(reEsc)])],
  }));
  // The roles nobody fills yet, so what's written about them can still be found.
  for (const r of orrery ? orrery.list("role") : []) {
    const short = r.name.replace(/\s*\([^)]*\)/g, "").replace(/^(The |A )/, "").replace(/^[A-Z][\w-]*'s /, "").trim();
    people.push({ group: "Roles still to fill", id: r.id, dbId: r.id, name: r.name, role: "Nobody named yet", status: statusLabel(r.status), names: [reEsc(short)] });
  }
  const firstSeen = [...new Set(people.map((p) => p.group))].filter((g) => !GROUP_LAST.includes(g));
  const order = [...firstSeen, ...GROUP_LAST];
  const rank = (g) => order.indexOf(g);
  PEOPLE = people.map((p, i) => [p, i]).sort((a, b) => rank(a[0].group) - rank(b[0].group) || a[1] - b[1]).map(([p]) => p);
}

// The items come from the database and nowhere else.
let ITEMS = [], CATS = [], fromFile = false;

// ── Items and resources: the database's items ──
// Each item comes from resources.md (## category, ### type, #### entry) by
// way of the database, with its "- **Field:** value" bullets as fields.
const FIELD = { "where": "where", "does": "does", "made": "made", "limits": "limits", "rules": "rules", "story": "story", "note": "sub", "made_by": "by", "also_called": "also", "icon": "icon" };
const idOf = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
// "Rift compass" -> "[Rr]ift compass(?:e?s)?": either case first letter, plural ok.
const nameRe = (n) => { const e = reEsc(n.trim()); return (/^[a-z]/i.test(e) ? `[${e[0].toUpperCase()}${e[0].toLowerCase()}]` + e.slice(1) : e) + "(?:e?s)?"; };
function personIds(list) {
  return list.split(",").map((x) => x.trim()).filter(Boolean).map((n) => {
    const p = PEOPLE.find((q) => q.name.toLowerCase() === n.toLowerCase() || q.id === n.toLowerCase() || q.names.some((pat) => new RegExp(`^(?:${pat})$`).test(n)));
    return p ? p.id : null;
  }).filter(Boolean);
}
function itemFromDb(e) {
  const it = { id: e.id, icon: e.icon || "📦", name: e.name, cat: e.category || "Other", type: e.kind || "Other", status: statusLabel(e.status), by: [], also: "", extra: [], body: bodyOf(e) };
  for (const [k, v] of Object.entries(e.fields || {})) {
    const key = FIELD[k], val = fieldText(v);
    if (key === "by") it.by = personIds(val);
    else if (key) it[key] = val;
    else it.extra.push([fieldLabel(k), val]);
  }
  it.names = [it.name, ...it.also.split(",")].map((n) => n.trim()).filter(Boolean).map(nameRe);
  it.does = it.does || "";
  return it;
}
function buildItems() {
  const got = orrery ? orrery.list("item").map(itemFromDb) : [];
  fromFile = got.length > 0;
  ITEMS = fromFile ? got : [];
  CATS = [];
  for (const it of ITEMS) {
    let c = CATS.find((x) => x.name === it.cat);
    if (!c) CATS.push(c = { name: it.cat, id: idOf(it.cat), intro: "", types: [] });
    let t = c.types.find((x) => x.name === it.type);
    if (!t) c.types.push(t = { name: it.type, id: idOf(it.type), items: [] });
    t.items.push(it);
  }
  // Each category's opening paragraph, shown on its page, from the document itself.
  for (const s of (text.resources || "").split(/^## /m).slice(1)) {
    const name = s.split("\n")[0].trim(), c = CATS.find((x) => x.name === name);
    if (c) c.intro = s.split("\n").slice(1).join("\n").split(/^###/m)[0].replace(/<!--[\s\S]*?-->/g, "").trim();
  }
}

  const used = world ? /^\W*(Name|Kind(?: \([^)]*\))?)\W*:/i : /^\W*(Name|Race|Sex|Age|Role|Lives in|Secret)\W*:/i;
  const body = t.split("\n").filter((l) => !used.test(l)).join("\n").replace(/\n{3,}/g, "\n\n").trim();
  const d = chatStore.get(CODEX_KEY) || { v: 1, notes: [] };
  if (!Array.isArray(d.notes)) d.notes = [];
  const had = d.notes.find((n) => n && n.source === "orrery-chat:" + c.id.slice(0, 20));
  const now = Date.now();
  if (had) Object.assign(had, { title, f: { ...had.f, ...f }, body, updated: now });
  else d.notes.push({ id: newId(), cat, title, body, status: "pitch", narrator: false, f, pic: "", source: "orrery-chat:" + c.id.slice(0, 20), created: now, updated: now });
  if (!chatStore.set(CODEX_KEY, { ...d, v: 1 })) return ($("writeNote").textContent = "This browser's storage is full, so it couldn't be added.");
  $("writeNote").innerHTML = `${had ? "Updated" : "Added"} ${esc(title)} in the <a href="/verrowen/codex/">Codex</a> as a pitch.`;
}

showWorld();
$("worldPick").addEventListener("change", (e) => {
  world = WORLDS.find((w) => w.id === e.target.value) || WORLDS[0];
  localStorage.setItem("orrery-world", world.id);
  showWorld();
});
addEventListener("hashchange", route);
load();
loadHall();
</script>
</body>
</html>
