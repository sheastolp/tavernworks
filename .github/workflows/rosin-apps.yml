# Builds Rosin's Android app (APK: Rosin floating over the home screen) and Windows app (installer + portable exe).
# The files are attached to each run under "Artifacts". Pushing a tag like rosin-v1.0.1 also publishes them
# as a GitHub release (so does running it by hand with "release" ticked), with fixed names so the "latest" links below always point at the newest build:
#   https://github.com/sheastolp/tavernworks/releases/latest/download/Rosin.apk
#   https://github.com/sheastolp/tavernworks/releases/latest/download/Rosin-Setup.exe
#   https://github.com/sheastolp/tavernworks/releases/latest/download/Rosin-Portable.exe
name: Rosin apps

on:
  push:
    branches: ["**"]
    tags: ["rosin-v*"]
    paths: ["apps/**", ".github/workflows/rosin-apps.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with direct download links"
        type: boolean
        default: false
      version:
        description: "Release version (the tag becomes rosin-v<version>)"
        default: "1.0.0"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      # Every build is signed with the same key, so a new APK installs over the old one. The key is made once
      # and kept in this repository's Actions cache (a ROSIN_KEYSTORE_B64 secret overrides it).
      - name: Load the signing key
        id: ks
        uses: actions/cache/restore@v4
        with:
          path: ~/.rosin-signing
          key: rosin-signing-v1
      - name: Make the signing key (first build only)
        env:
          KEYSTORE_B64: ${{ secrets.ROSIN_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ROSIN_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rosin.jks"
            echo "ROSIN_KEYSTORE=$RUNNER_TEMP/rosin.jks" >> "$GITHUB_ENV"
            echo "ROSIN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            exit 0
          fi
          D="$HOME/.rosin-signing"
          if [ ! -f "$D/rosin.jks" ]; then
            mkdir -p "$D"
            openssl rand -hex 16 > "$D/pass"
            P=$(cat "$D/pass")
            keytool -genkeypair -keystore "$D/rosin.jks" -storepass "$P" -keypass "$P" -alias rosin \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Rosin, O=Tavernworks"
            echo "made=true" >> "$GITHUB_OUTPUT"
          fi
          P=$(cat "$D/pass"); echo "::add-mask::$P"
          echo "ROSIN_KEYSTORE=$D/rosin.jks" >> "$GITHUB_ENV"
          echo "ROSIN_KEYSTORE_PASSWORD=$P" >> "$GITHUB_ENV"
        id: make
      - name: Keep the new signing key
        if: steps.make.outputs.made == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.rosin-signing
          key: rosin-signing-v1
      - name: Build APK
        working-directory: apps/rosin-android
        run: gradle --no-daemon assembleRelease
      - name: Name the APK
        run: cp apps/rosin-android/app/build/outputs/apk/release/app-release.apk "Rosin-android-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Rosin-android
          path: Rosin-android-*.apk

  # Tries the APK on an Android emulator: Rosin floating over the home screen, the speech bubble, tapping
  # Rosin. Screenshots are printed into this job's log. It doesn't hold up a release.
  emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Rosin-android
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash apps/rosin-android/emulator-test.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build installer
        working-directory: apps/rosin-desktop
        shell: bash
        run: |
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          npm install --no-audit --no-fund
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Rosin-windows
          path: apps/rosin-desktop/dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/rosin-v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Give the files fixed names
        run: |
          mkdir out
          cp built/Rosin-android/*.apk out/Rosin.apk
          cp built/Rosin-windows/Rosin-Setup-*.exe out/Rosin-Setup.exe
          cp built/Rosin-windows/Rosin-Portable-*.exe out/Rosin-Portable.exe
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('rosin-v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Rosin apps ${{ github.event_name == 'workflow_dispatch' && format('rosin-v{0}', inputs.version) || github.ref_name }}
          make_latest: true
          files: out/*
          body: |
            Rosin, Stoned Sheamus's AI co-host, as an app.

            - **Rosin.apk**: Android app. Rosin floats over your home screen and other apps with no box, speaks up on its own now and then, and talks in speech bubbles. Tap Rosin to open the app; drag to move. Allow "Display over other apps" when it asks. Uses the phone's own voice and speech-to-text.
            - **Rosin-Setup.exe**: Windows app. Just Rosin on the desktop, no box, talking in speech bubbles; clicks pass through everywhere except Rosin. Click Rosin to open the app, drag to move. Ctrl+Alt+R show/hide, Ctrl+Alt+T talk, Ctrl+Alt+Y type.
            - **Rosin-Portable.exe**: the same Windows app without installing.

            Enter your laptop key once under the ⋯ menu in each app.
