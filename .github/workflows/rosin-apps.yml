# Builds Rosin's Android app (APK with the home screen widget) and Windows app (installer + portable exe).
# The files are attached to each run under "Artifacts". Pushing a tag like rosin-v1.0.1 also publishes them
# as a GitHub release (so does running it by hand with "release" ticked), with fixed names so the "latest" links below always point at the newest build:
#   https://github.com/sheastolp/tavernworks/releases/latest/download/Rosin.apk
#   https://github.com/sheastolp/tavernworks/releases/latest/download/Rosin-Setup.exe
#   https://github.com/sheastolp/tavernworks/releases/latest/download/Rosin-Portable.exe
name: Rosin apps

on:
  push:
    branches: ["**"]
    tags: ["rosin-v*"]
    paths: ["apps/**", ".github/workflows/rosin-apps.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with direct download links"
        type: boolean
        default: false
      version:
        description: "Release version (the tag becomes rosin-v<version>)"
        default: "1.0.0"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ROSIN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rosin.jks"
            echo "ROSIN_KEYSTORE=$RUNNER_TEMP/rosin.jks" >> "$GITHUB_ENV"
          else
            echo "No ROSIN_KEYSTORE_B64 secret: signing with the debug key."
          fi
      - name: Build APK
        working-directory: apps/rosin-android
        env:
          ROSIN_KEYSTORE_PASSWORD: ${{ secrets.ROSIN_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Name the APK
        run: cp apps/rosin-android/app/build/outputs/apk/release/app-release.apk "Rosin-android-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Rosin-android
          path: Rosin-android-*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build installer
        working-directory: apps/rosin-desktop
        shell: bash
        run: |
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          npm install --no-audit --no-fund
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Rosin-windows
          path: apps/rosin-desktop/dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/rosin-v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Give the files fixed names
        run: |
          mkdir out
          cp built/Rosin-android/*.apk out/Rosin.apk
          cp built/Rosin-windows/Rosin-Setup-*.exe out/Rosin-Setup.exe
          cp built/Rosin-windows/Rosin-Portable-*.exe out/Rosin-Portable.exe
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('rosin-v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Rosin apps ${{ github.event_name == 'workflow_dispatch' && format('rosin-v{0}', inputs.version) || github.ref_name }}
          make_latest: true
          files: out/*
          body: |
            Rosin, Stoned Sheamus's AI co-host, as an app.

            - **Rosin.apk**: Android app with a home screen widget (Talk and Type buttons, Rosin's face and last reply). Uses the phone's own voice and speech-to-text.
            - **Rosin-Setup.exe**: Windows app, a floating see-through window that stays on top, with a tray icon. Ctrl+Alt+R show/hide, Ctrl+Alt+T talk, Ctrl+Alt+Y type.
            - **Rosin-Portable.exe**: the same Windows app without installing.

            Enter your laptop key once under the ⋯ menu in each app.
