# Builds the AI Pool worker apps: the Android APK and an unsigned iPhone/iPad IPA (sideload it with
# your own Apple ID, see apps/pool-worker-ios/README.md). The files are attached to each run under
# "Artifacts". Pushing a tag like pool-worker-v1.0.0 (or running this by hand with "release" ticked)
# also publishes them as a GitHub release. It never becomes the repo's "latest" release, so Rosin's
# latest links keep working.
name: Pool worker apps

on:
  push:
    branches: ["**"]
    tags: ["pool-worker-v*"]
    paths: ["apps/pool-worker-android/**", "apps/pool-worker-ios/**", ".github/workflows/pool-worker-apps.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with direct download links"
        type: boolean
        default: false
      version:
        description: "Release version (the tag becomes pool-worker-v<version>)"
        default: "1.0.0"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Put llama.cpp's Android rpc-server in the app
        run: apps/pool-worker-android/fetch-engine.sh
      # Every build is signed with the same key, so a new APK installs over the old one. The key is made once
      # and kept in this repository's Actions cache (a POOL_KEYSTORE_B64 secret overrides it).
      - name: Load the signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.pool-worker-signing
          key: pool-worker-signing-v1
      - name: Make the signing key (first build only)
        id: make
        env:
          KEYSTORE_B64: ${{ secrets.POOL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.POOL_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pool.jks"
            echo "POOL_KEYSTORE=$RUNNER_TEMP/pool.jks" >> "$GITHUB_ENV"
            echo "POOL_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            exit 0
          fi
          D="$HOME/.pool-worker-signing"
          if [ ! -f "$D/pool.jks" ]; then
            mkdir -p "$D"
            openssl rand -hex 16 > "$D/pass"
            P=$(cat "$D/pass")
            keytool -genkeypair -keystore "$D/pool.jks" -storepass "$P" -keypass "$P" -alias poolworker \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Pool Worker, O=Tavernworks"
            echo "made=true" >> "$GITHUB_OUTPUT"
          fi
          P=$(cat "$D/pass"); echo "::add-mask::$P"
          echo "POOL_KEYSTORE=$D/pool.jks" >> "$GITHUB_ENV"
          echo "POOL_KEYSTORE_PASSWORD=$P" >> "$GITHUB_ENV"
      - name: Keep the new signing key
        if: steps.make.outputs.made == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.pool-worker-signing
          key: pool-worker-signing-v1
      - name: Build APK
        working-directory: apps/pool-worker-android
        run: gradle --no-daemon assembleRelease
      - name: Check the engine is inside the APK
        run: |
          APK=apps/pool-worker-android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -E "lib/arm64-v8a/|assets/engine-gpu/" | tee contents.txt
          for f in lib/arm64-v8a/libpoolrpc_cpu.so lib/arm64-v8a/libpoolrpc_gpu.so lib/arm64-v8a/libggml-rpc.so \
                   assets/engine-gpu/libggml-opencl.so assets/engine-gpu/PIN; do
            grep -q " $f$" contents.txt || { echo "missing from the APK: $f"; exit 1; }
          done
          ls -la "$APK"
      - name: Name the APK
        run: cp apps/pool-worker-android/app/build/outputs/apk/release/app-release.apk "PoolWorker-android-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PoolWorker-android
          path: PoolWorker-android-*.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Build llama.cpp's ggml for iOS (Metal + RPC server)
        run: apps/pool-worker-ios/build-ggml.sh
      - name: Make the Xcode project
        working-directory: apps/pool-worker-ios
        run: |
          PIN="$(tr -d ' \n' < ../pool-worker-android/engine-pin.txt)"
          sed -i '' "s/PoolEnginePin: .*/PoolEnginePin: $PIN/" project.yml
          xcodegen generate
      - name: Build the app (unsigned)
        working-directory: apps/pool-worker-ios
        run: |
          xcodebuild -project PoolWorker.xcodeproj -target PoolWorker -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package the IPA
        working-directory: apps/pool-worker-ios
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Release-iphoneos/PoolWorker.app Payload/
          zip -qry "$GITHUB_WORKSPACE/PoolWorker-ios-unsigned-${{ github.run_number }}.ipa" Payload
          ls -la "$GITHUB_WORKSPACE"/*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: PoolWorker-ios
          path: PoolWorker-ios-unsigned-*.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/pool-worker-v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Give the files fixed names
        run: |
          mkdir out
          cp built/PoolWorker-android/*.apk out/PoolWorker.apk
          cp built/PoolWorker-ios/*.ipa out/PoolWorker-unsigned.ipa
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('pool-worker-v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: AI Pool worker ${{ github.event_name == 'workflow_dispatch' && format('pool-worker-v{0}', inputs.version) || github.ref_name }}
          make_latest: false
          files: out/*
          body: |
            Phones and tablets as AI Pool workers.

            - **PoolWorker.apk**: Android. One tap joins the pool; it runs in the background behind a notification. Adreno 7xx/8xx phones compute on the GPU when the pool's model is MXFP4, Q4_0 or Q8_0; every other phone lends CPU and RAM.
            - **PoolWorker-unsigned.ipa**: iPhone and iPad (Metal GPU). Unsigned: sign it with your own Apple ID in Sideloadly or AltStore. Works only while the app is open on screen.

            Approve each new device in the pool's Roster.
