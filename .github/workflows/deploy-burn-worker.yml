name: Deploy burn.tavernworks.dev Worker

on:
  push:
    branches: [main]
    paths:
      - cloudflare/burn-worker.js
      - cloudflare/burn-wrangler.toml
      - .github/workflows/deploy-burn-worker.yml
  workflow_dispatch: {} # lets you redeploy by hand from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BURN_WORKER_NAME: ${{ vars.BURN_WORKER_NAME }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN (secret)"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID (secret)"
          [ -n "$BURN_WORKER_NAME" ] || missing="$missing BURN_WORKER_NAME (variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo settings:$missing"
            exit 1
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config cloudflare/burn-wrangler.toml --name ${{ vars.BURN_WORKER_NAME }}
