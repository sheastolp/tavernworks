<title>Silksong Assistant · Tavernworks</title>
<meta name="description" content="Hollow Knight: Silksong Assistant: Pharloom region by region on a map, bosses across all three acts with prep checklists, how to reach Act 2 and Act 3, all five endings, crests, Ancestral Arts and Silk Skills, a tool tracker by colour, needle upgrades and Pale Oil, mask shards and spool fragments, a flea tracker, a wish log, a rosary shopping list, updates and Sea of Sorrow, progression and notes. Runs in your browser.">

<style>
:root{--bg:#120a0c;--panel:#1c1114;--panel2:#271619;--line:#40252a;--tx:#f3e6e6;--dim:#b0959a;--acc:#e0464f;--acc-ink:#fff5f5;--acc2:#e9b07a;--ok:#8fcf9a;--warn:#f2c14e;--err:#ff8a7a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
#app{display:flex;height:100vh}
#nav{width:215px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
#nav h1{font-size:15px;margin:4px 8px 12px;color:var(--acc);letter-spacing:.5px}
#nav a{display:block;padding:7px 10px;margin:2px 0;border-radius:6px;color:var(--tx);text-decoration:none;cursor:pointer}
#nav a:hover{background:var(--panel2)}
#nav a.home{color:var(--dim);font-size:13px}
#nav a.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
#nav .grp{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:12px 10px 2px}
#main{flex:1;overflow:auto;padding:20px 24px}
h2{margin:0 0 4px;font-size:22px}
h3{margin:18px 0 6px;color:var(--acc2);font-size:16px}
p.sub{color:var(--dim);margin:0 0 16px}
a{color:var(--acc2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.tile:hover{border-color:var(--acc)}
.tile b{color:var(--acc)}
@media(max-width:760px){#app{flex-direction:column;height:auto;min-height:100vh}#nav{width:auto;display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}#nav h1{width:100%}#nav .grp{display:none}#main{padding:16px}}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
input,select,textarea{background:#0b0607;border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
input[type=text],input[type=number],input[type=search]{width:130px}
input[type=checkbox]{width:auto}
table{border-collapse:collapse;width:100%}
td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--panel2);color:var(--dim);margin-left:6px}
.tag.red{background:#3a1418;color:#ff9b9b}.tag.blue{background:#14232c;color:#9cc9dc}.tag.yellow{background:#2c2614;color:#f0d583}.tag.white{background:#2a2a2e;color:#e8e8ee}
.note{border-left:3px solid var(--warn);background:#221d0f;padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;color:#eadca6}
.tip{border-left:3px solid var(--acc);background:var(--panel2);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.ok{color:var(--ok)}.bad{color:var(--err)}.dim{color:var(--dim)}
label.chk{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.conf{color:var(--ok)}.unv{color:var(--warn)}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--acc)}
a.mob{font-weight:600;color:var(--acc2);text-decoration:none;cursor:pointer}
a.mob:hover{text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat small{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stat .big{font:600 20px/1.2 Consolas,"Cascadia Mono",monospace}
.mech li{margin:4px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{border-radius:999px;padding:3px 11px;font-size:13px}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.big2{font:600 26px/1.2 Consolas,"Cascadia Mono",monospace;color:var(--acc2)}
.pips{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.pip{width:16px;height:16px;border-radius:50%;border:2px solid var(--acc);background:transparent}
.pip.f{background:var(--acc)}
.cnt{display:inline-flex;align-items:center;gap:6px}
.cnt b{min-width:52px;text-align:center;font:600 18px Consolas,monospace}
</style>

<script>
/* ================= DATA =================
   conf: true  = Team Cherry's patch notes and announcements, or several guides and the wiki agree.
   conf: false = guides disagree, a single source, or the exact spot is fuzzy; check in-game.
   Written against the 1.0 release (4 September 2025) and its patches up to spring 2026.
   Silksong is big and guides still disagree on boss order, crest routes and tool colours,
   so a lot here is marked ○. Sea of Sorrow, the free expansion, isn't out as of writing. */

/* Regions of Pharloom. act = when you first get in. x,y place them on the map (south is down). */
const REGIONS=[

 tips:["Learn to bind (heal) with a full silk spool: it restores three masks at once.","Break everything; shell shards refill your tools at benches."]},
{id:'marrow',n:'The Marrow',act:1,x:170,y:410,col:'#a8977a',conf:true,d:"Bone-strewn caverns east of Moss Grotto. The Bell Beast blocks the way and Bone Bottom, the first village, sits nearby.",boss:['bellbeast','skulltyrant'],
 tips:["Beating the Bell Beast opens the Bellways, Pharloom's fast travel.","Bone Bottom has a shop and a bench; buy a map from Shakra when you hear her humming."]},
{id:'bonebottom',n:'Bone Bottom',act:1,x:110,y:330,col:'#c9b48a',fg:'#1c1114',conf:true,d:"The first village: a bench, a shop and the way up to Mosshome, where the Silkspear waits.",items:['Silkspear (top of Mosshome)'],tips:["Come back here between trips; the shop stock grows."]},
{id:'docks',n:'Deep Docks',act:1,x:270,y:445,col:'#8a5a3a',conf:true,d:"Hot, lava-lit docks. Lace's first fight and Swift Step (the dash).",boss:['lace1'],items:['Swift Step'],
 tips:["Swift Step is in the east of the Docks, past a lever and a hot-coal jumping section.","The Forebrothers Signis and Gron are here too (optional, Act 2)."]},
{id:'farfields',n:'Far Fields',act:1,x:50,y:245,col:'#b8a050',fg:'#1c1114',conf:true,d:"Windy fields on Pharloom's west side. The Fourth Chorus wakes here.",boss:['fourthchorus'],
 tips:["The Fourth Chorus fight uses moving platforms; don't chase it."]},
{id:'greymoor',n:'Greymoor',act:1,x:300,y:250,col:'#6f7480',conf:true,d:"A grey, rainy marsh in the middle of Pharloom. Moorwing, the Reaper chapel and Halfway Home.",boss:['moorwing'],items:['Reaper Crest (chapel in the far west)'],
 tips:["The Reaper chapel needs some easy platforming to reach.","Team Cherry made Moorwing a little easier in an early patch."]},
{id:'shellwood',n:'Shellwood',act:1,x:170,y:180,col:'#5a9a7a',conf:true,d:"A forest of hollow shells. Sister Splinter guards it and Cling Grip lies past her.",boss:['splinter','seth'],items:['Cling Grip (wall jump)'],

{id:'hunters',n:'Hunter\'s March',act:1,x:370,y:330,col:'#7a5a3a',conf:true,d:"A hunting ground full of aggressive bugs. The Chapel of the Beast holds the Savage Beastfly and the Beast Crest.",boss:['beastfly','karmelita'],items:['Beast Crest'],

{id:'blasted',n:'Blasted Steps',act:1,x:470,y:250,col:'#c9a070',fg:'#1c1114',conf:true,d:"Sun-blasted steps on the east side that lead up to the Grand Gate. The Last Judge guards the way to the Citadel.",boss:['lastjudge'],

{id:'sinners',n:'Sinner\'s Road',act:1,x:400,y:400,col:'#5a4a6e',conf:false,d:"A grim road to the south-east, towards Bilewater.",tips:["Acid and traps; watch your step."]},
{id:'bilewater',n:'Bilewater',act:1,x:520,y:410,col:'#5a7a3a',conf:true,d:"A foul swamp. Groal the Great lurks here, and the Twisted Bud, which starts the Witch Crest route.",boss:['groal'],

{id:'citadel',n:'The Citadel',act:2,x:390,y:105,col:'#c9a0b8',fg:'#1c1114',conf:true,d:"The great city at the top of Pharloom, through the Grand Gate. It's made of districts: Choral Chambers, the Underworks, Songclave, Whiteward, High Halls, the Memorium, Whispering Vaults and the Cogwork Core.",boss:['dancers','trobbio','sentinel','unravelled'],items:['Architect Crest (Underworks)','Pale Oil (Whispering Vaults, Choral Chambers)','Clawline (○)'],

{id:'wisp',n:'Wisp Thicket',act:2,x:160,y:265,col:'#4a6a8a',conf:false,d:"A ghostly wood. The Father of the Flame burns here.",boss:['fatherflame'],tips:["Bring fire protection if you have it (Magma Bell ○)."]},
{id:'ducts',n:'Putrified Ducts',act:2,x:490,y:170,col:'#6a7a4a',conf:true,d:"Sewers under the Citadel. The Apostate's Key and, in Act 3, the Flea Caravan's last stop brings the third Pale Oil.",tips:["The third Pale Oil comes from the Flea Caravan here in Act 3."]},
{id:'cradle',n:'The Cradle',act:2,x:390,y:30,col:'#e0464f',conf:true,d:"The summit above the Citadel. Lace again, then Grand Mother Silk.",boss:['lace2','gms'],tips:["Do anything you need for Act 3 before you climb: Silk and Soul, and the Twisted Child curse if you want that ending."]},

}

function pgMasks(){return `<h2>Masks and spools</h2><p class="sub">Four Mask Shards make a mask. Spool Fragments lengthen your silk spool, two at a time.</p>
<div class="stats"><div class="stat"><small>Mask Shards</small>${cnt('shards',S.shards,20)}</div><div class="stat"><small>Masks</small><span class="big">${masks()}</span> <span class="dim">of 10</span></div><div class="stat"><small>Spool Fragments</small>${cnt('frags',S.frags,18)}</div><div class="stat"><small>Spool pieces</small><span class="big">${Math.floor(S.frags/2)}</span> <span class="dim">of 9</span></div></div>
<div class="pips">${Array.from({length:20},(_,i)=>`<span class="pip ${i<S.shards?'f':''}"></span>`).join('')}</div>
<div class="tip">Shards and fragments hide in shops, behind breakable walls, as wish rewards and at the end of platforming gauntlets. The spool fragments are all in Acts 1 and 2 ${mark(false)}.</div>`;}

function pgFleas(){return `<h2>Fleas</h2><p class="sub">30 lost fleas are hidden across Pharloom. Rescue them and the Flea Caravan moves, eventually to Fleatopia.</p>
<div class="stats"><div class="stat"><small>Fleas rescued</small>${cnt('fleas',S.fleas,30)}</div><div class="stat"><small>Act 3 route</small>${S.fleas>=25?'<span class="ok">Enough for Fleatopia</span>':`<span class="dim">${25-S.fleas} more to be safe</span>`}</div></div>
<div class="bar"><i style="width:${S.fleas/30*100}%"></i></div>
<div class="card"><ul class="mech"><li>${mark(false)} Guides say the Caravan needs 20 to 25 fleas to reach Fleatopia, which is one of the Act 3 conditions. Aim for 25.</li><li>${mark(true)} The Caravan's last stop brings the third Pale Oil in Act 3.</li><li>Listen: trapped fleas make a sound when you're close.</li></ul></div>`;}

function pgWishes(){return `<h2>Wish log</h2><p class="sub">Wishes are Silksong's side quests, taken from wishwalls in towns. Log yours here.</p>
<div class="card"><form class="row" id="wf"><input id="wn" type="text" style="width:220px" placeholder="Wish (e.g. Silk and Soul)"><select id="wr">${REGIONS.map(r=>`<option>${esc(r.n)}</option>`).join('')}</select><input id="wnote" type="text" style="width:220px" placeholder="What it needs"><button class="pri">Add</button></form></div>
<div class="card tbl"><table><tr><th></th><th>Wish</th><th>Region</th><th>Notes</th><th></th></tr>${S.wishes.map((w,i)=>`<tr><td><input type="checkbox" data-wd="${i}"${w.done?' checked':''}></td><td><b${w.done?' class="dim"':''}>${esc(w.n)}</b></td><td>${esc(w.r)}</td><td><input type="text" data-wnote="${i}" value="${esc(w.note||'')}" style="width:220px"></td><td><button data-wdel="${i}" title="Delete">✕</button></td></tr>`).join('')||'<tr><td colspan="5" class="dim">No wishes yet.</td></tr>'}</table></div>
<div class="tip">Not every wish is needed for 100%, but Silk and Soul and the wishes leading to it unlock Act 3.</div>`;}
function wishWire(){
  $('wf').onsubmit=e=>{e.preventDefault();const n=$('wn').value.trim();if(!n)return;S.wishes.push({n,r:$('wr').value,note:$('wnote').value.trim(),done:false});save();route(true);};
  document.querySelectorAll('[data-wd]').forEach(c=>c.onchange=()=>{S.wishes[+c.dataset.wd].done=c.checked;save();route(true);});
  document.querySelectorAll('[data-wnote]').forEach(i=>i.oninput=()=>{S.wishes[+i.dataset.wnote].note=i.value;save();});
  document.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{if(confirm('Remove '+S.wishes[+b.dataset.wdel].n+'?')){S.wishes.splice(+b.dataset.wdel,1);save();route(true);}});
}

function pgShop(){const tot=S.shop.filter(x=>!x.got).reduce((a,x)=>a+(+x.c||0),0),have=+S.rosaries||0;
  return `<h2>Rosary shopping list</h2><p class="sub">Note what you want to buy and what it costs, and see whether you can afford it.</p>
<div class="stats"><div class="stat"><small>Rosaries you have</small><input type="number" id="ros" min="0" value="${have}" style="width:110px"></div><div class="stat"><small>Still to buy</small><span class="big">${tot.toLocaleString()}</span></div><div class="stat"><small>${have>=tot?'Left over':'Short by'}</small><span class="big ${have>=tot?'ok':'bad'}">${Math.abs(have-tot).toLocaleString()}</span></div></div>
<div class="card"><form class="row" id="sf"><input id="sn" type="text" style="width:200px" placeholder="Item (e.g. a map)"><input id="sw" type="text" style="width:160px" placeholder="Shop (e.g. Bellhart)"><input id="sc" type="number" min="0" style="width:90px" placeholder="Cost"><button class="pri">Add</button></form></div>
<div class="card tbl"><table><tr><th></th><th>Item</th><th>Shop</th><th class="n">Cost</th><th></th></tr>${S.shop.map((x,i)=>`<tr><td><input type="checkbox" data-sg="${i}"${x.got?' checked':''}></td><td><b${x.got?' class="dim"':''}>${esc(x.n)}</b></td><td>${esc(x.w)}</td><td class="n">${(+x.c||0).toLocaleString()}</td><td><button data-sdel="${i}" title="Delete">✕</button></td></tr>`).join('')||'<tr><td colspan="5" class="dim">Nothing on the list.</td></tr>'}</table></div>
<div class="tip">String loose rosaries into Rosary Strings before a hard area. Strings don't drop when you die.</div>`;}
function shopWire(){
  $('ros').onchange=e=>{S.rosaries=Math.max(0,+e.target.value||0);save();route(true);};
  $('sf').onsubmit=e=>{e.preventDefault();const n=$('sn').value.trim();if(!n)return;S.shop.push({n,w:$('sw').value.trim(),c:Math.max(0,+$('sc').value||0),got:false});save();route(true);};
  document.querySelectorAll('[data-sg]').forEach(c=>c.onchange=()=>{S.shop[+c.dataset.sg].got=c.checked;save();route(true);});
  document.querySelectorAll('[data-sdel]').forEach(b=>b.onclick=()=>{S.shop.splice(+b.dataset.sdel,1);save();route(true);});
}

function pgCompletion(){
  const g=[['Mask Shards',S.shards,20],['Spool Fragments',S.frags,18],['Needle upgrades',S.needle,4],['Ancestral Arts',ARTS.filter(x=>S.have['ab:'+x[0]]).length,ARTS.length],['Silk Skills',SKILLS.filter(x=>S.have['sk:'+x[0]]).length,SKILLS.length],['Crests',CRESTS.filter(c=>S.have['cr:'+c.n]).length,CRESTS.length],['Tools',TOOLS.filter(t=>S.tools[t[0]]).length,TOOLS.length]];
  const avg=g.reduce((a,[,v,m])=>a+Math.min(1,v/m),0)/g.length;
  return `<h2>Completion</h2><p class="sub">What counts towards 100%, from community guides ${mark(false)}: stat items (Mask Shards and Spool Fragments), needle upgrades, abilities (Ancestral Arts and Silk Skills), crests and tools. You don't need every boss or every wish. Fleas themselves don't count, but you need them for Act 3.</p>
<div class="card"><b>Across what you've ticked: ${Math.round(avg*100)}%</b><div class="bar"><i style="width:${avg*100}%"></i></div><p class="dim" style="margin:0">A rough guide from your ticks, not the game's number.</p></div>
<div class="card tbl"><table><tr><th>Group</th><th class="n">You</th><th style="width:40%"></th></tr>${g.map(([n,v,m])=>`<tr><td>${esc(n)}</td><td class="n">${v} / ${m}</td><td><div class="bar" style="margin:6px 0"><i style="width:${Math.min(1,v/m)*100}%"></i></div></td></tr>`).join('')}</table></div>
<div class="tip">A missing tool is the usual reason for sitting at 99%.</div>`;}

const cntWire=()=>{document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{const k=b.dataset.inc;S[k]=Math.min(LIM[k],(+S[k]||0)+1);save();route(true);});document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const k=b.dataset.dec;S[k]=Math.max(0,(+S[k]||0)-1);save();route(true);});};

function pgProgress(){const done=PROG.filter((_,i)=>S.prog[i]).length,groups=[...new Set(PROG.map(p=>p[0]))];
  return `<h2>Progression</h2><p class="sub">From Moss Grotto to Lost Lace. Tick things off as you go.</p>
<div class="dim" id="pdone">${done} of ${PROG.length} done</div><div class="bar"><i id="pbar" style="width:${done/PROG.length*100}%"></i></div>
${groups.map(g=>`<h3>${g}</h3><div class="card">${PROG.map((p,i)=>p[0]===g?`<label class="chk"><input type="checkbox" data-p="${i}"${S.prog[i]?' checked':''}> ${esc(p[1])}</label>`:'').join('')}</div>`).join('')}
<button onclick="if(confirm('Clear all progression ticks?')){S.prog={};save();route()}">Reset</button>`;}

function pgUpdates(){return `<h2>Updates</h2><p class="sub">Patches since launch and the free expansion.</p>
<div class="card tbl"><table><tr><th>When</th><th>Update</th><th>What's in it</th></tr>${UPDATES.map(([d,n,t,c])=>`<tr><td style="white-space:nowrap">${esc(d)}</td><td>${mark(c)} <b>${esc(n)}</b></td><td>${esc(t)}</td></tr>`).join('')}</table></div>
<div class="note">Sea of Sorrow was announced on 15 December 2025 for 2026, free for all owners. Check Team Cherry's blog for a date.</div>`;}

function pgNotes(){return `<h2>My Notes</h2><p class="sub">Saved automatically on this device.</p><textarea id="nt" style="width:100%;height:60vh" placeholder="Where your cocoon is, which flea you heard but couldn't reach, which crest and tools beat which boss...">${esc(S.notes)}</textarea>`;}

/* ================= ROUTER ================= */
function route(keepScroll){
  const [pg,sub]=(location.hash.slice(1)||'home').split('/');
  const page=REAL.some(p=>p[0]===pg)?pg:'home';
  buildNav(page);
  const m=$('main'),top=m.scrollTop;
  m.innerHTML=({home:pgHome,guides:()=>pgGuides(sub),regions:()=>pgRegions(sub),bosses:()=>pgBosses(sub),endings:pgEndings,abilities:pgAbilities,crests:pgCrests,tools:pgTools,needle:pgNeedle,masks:pgMasks,fleas:pgFleas,wishes:pgWishes,shop:pgShop,completion:pgCompletion,progress:pgProgress,updates:pgUpdates,notes:pgNotes})[page]();
  m.scrollTop=keepScroll===true?top:0;
  m.querySelectorAll('input[type=checkbox][data-p]').forEach(cb=>{cb.onchange=()=>{S.prog[cb.dataset.p]=cb.checked;save();const d=PROG.filter((_,i)=>S.prog[i]).length;$('pdone').textContent=d+' of '+PROG.length+' done';$('pbar').style.width=d/PROG.length*100+'%';};});
  m.querySelectorAll('input[type=checkbox][data-hv]').forEach(cb=>{cb.onchange=()=>{S.have[cb.dataset.hv]=cb.checked;save();if(page!=='endings')route(true);};});
  m.querySelectorAll('input[type=checkbox][data-tool]').forEach(cb=>{cb.onchange=()=>{S.tools[cb.dataset.tool]=cb.checked;save();route(true);};});
  m.querySelectorAll('[data-tc]').forEach(b=>b.onclick=()=>{tCol=b.dataset.tc;route(true);});
  m.querySelectorAll('[data-ra]').forEach(b=>b.onclick=()=>{regAct=+b.dataset.ra;route(true);});
  cntWire();
  if(page==='bosses')bossWire(sub);
  if(page==='needle')needleWire();
  if(page==='wishes')wishWire();
  if(page==='shop')shopWire();
  if(page==='notes')$('nt').oninput=e=>{S.notes=e.target.value;save();};
}
window.addEventListener('hashchange',()=>route());
route();
</script>
</body>
</html>
