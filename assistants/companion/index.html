<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Companion · Tavernworks</title>
<meta name="description" content="A companion app for a game in your linked Steam, Epic Games or GOG library: launch it, track goals, keep notes and log play sessions. Runs in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<style>
:root{--bg:#120f14;--panel:#1b1720;--panel2:#25202b;--line:#352d3d;--tx:#ebe4f0;--dim:#a296ad;--acc:#e0a84a;--acc2:#9fc8ff;--ok:#7ad37f;--err:#ff7a6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
#app{display:flex;height:100vh}
#nav{width:210px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
#nav h1{font-size:15px;margin:4px 8px 12px;color:var(--acc);letter-spacing:.3px;line-height:1.3}
#nav a{display:block;padding:8px 10px;margin:2px 0;border-radius:6px;color:var(--tx);text-decoration:none;cursor:pointer}
#nav a:hover{background:var(--panel2)}
#nav a.home{color:var(--dim);font-size:13px}
#nav a.on{background:var(--acc);color:#241500;font-weight:600}
#main{flex:1;overflow:auto;padding:20px 24px}
h2{margin:0 0 4px;font-size:22px}
h3{margin:18px 0 6px;color:var(--acc2);font-size:16px}
p.sub{color:var(--dim);margin:0 0 16px}
a{color:var(--acc2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px}
.hero{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.hero .art{width:300px;max-width:100%;aspect-ratio:460/215;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--dim);position:relative;overflow:hidden;flex:none}
.hero .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .info{flex:1;min-width:220px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:20px;color:var(--acc)}
.stat span{color:var(--dim);font-size:12.5px}
@media(max-width:760px){#app{flex-direction:column;height:auto;min-height:100vh}#nav{width:auto;display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}#nav h1{width:100%}#main{padding:16px}}
button,input,textarea{font:inherit;color:var(--tx)}
button,.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer;text-decoration:none;display:inline-block;color:var(--tx)}
button:hover,.btn:hover{border-color:var(--acc)}
button.pri,.btn.pri{background:var(--acc);color:#241500;border-color:var(--acc);font-weight:600}
input,textarea{background:#0c0a0e;border:1px solid var(--line);border-radius:6px;padding:6px 9px}
textarea{width:100%;min-height:360px;resize:vertical;line-height:1.55}
code{background:#0c0a0e;padding:1px 5px;border-radius:4px;color:#ffd48a;font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px;word-break:break-all}
table{border-collapse:collapse;width:100%}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--dim);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.dim{color:var(--dim)}.ok{color:var(--ok)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--panel2);color:var(--dim)}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--acc)}
.goal{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal span{flex:1}
.goal.done span{color:var(--dim);text-decoration:line-through}
.goal button{padding:1px 8px;color:var(--dim)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.links a{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--tx)}
.links a:hover{border-color:var(--acc)}
.timer{font:600 34px/1 Consolas,"Cascadia Mono",monospace;color:var(--acc);margin:6px 0 10px}
</style>
<script src="/bot-sandbox/app/config.js"></script>
<script src="/google-signin.js"></script>
<script src="/assistants/sync.js?v=2"></script>
</head>
<body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<script src="/assistants/launchers.js?v=2"></script>
<script>
const T = window.TavernLaunchers;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key = new URLSearchParams(location.search).get('game') || '';
let data = T.companion(key);
// The library entry, or what the companion remembered if the game was unlinked.
const game = T.find(key) || (data.game ? Object.assign({ key }, data.game) : null);

const PAGES = [['overview', 'Overview'], ['goals', 'Goals'], ['notes', 'Notes'], ['sessions', 'Play sessions'], ['links', 'Guides & links']];
const nav = document.getElementById('nav'), main = document.getElementById('main');

function persist() {
  if (game) data.game = { l: game.l, id: game.id, n: game.n, p: game.p || '', ns: game.ns || '', c: game.c || '', sid: game.sid || '', pfn: game.pfn || '', t: game.t || '' };
  T.saveCompanion(key, data);
}

const fmtDur = ms => {
  const m = Math.round(ms / 60000);
  return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
};
const fmtWhen = iso => new Date(iso).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
const playedMs = () => data.sessions.reduce((t, s) => t + (new Date(s.e) - new Date(s.s)), 0);

function artHTML() {
  const a = T.art(game);
  return `<div class="art">${esc(game.n.trim()[0] || '🎮')}${a ? `<img src="${esc(a)}" alt="" onerror="this.remove()">` : ''}</div>`;
}

const VIEWS = {
  overview() {
    const L = T.LAUNCHERS[game.l];
    const done = data.goals.filter(g => g.done).length;
    const last = data.sessions[data.sessions.length - 1];
    const linked = !!T.find(key);
    return `<div class="hero">${artHTML()}<div class="info">
        <h2>${esc(game.n)}</h2>
        <p class="sub">${L.icon} ${esc(L.name)}${linked ? '' : ' · <span class="dim">no longer in your linked library</span>'}</p>
        ${game.p ? `<div class="row"><span class="dim">Installed at</span> <code>${esc(game.p)}</code> <button data-copy="${esc(game.p)}">Copy</button></div>` : ''}
        <div class="row">${T.launchURI(game) ? `<a class="btn pri" href="${esc(T.launchURI(game))}">▶ ${game.l === 'xbox' ? 'Open in the Microsoft Store' : 'Play in ' + esc(L.name)}</a>` : ''}
          <button data-act="session">${data.running ? '■ Stop session' : '⏱ Start a session'}</button></div>
      </div></div>
      <div class="stats">
        <div class="stat"><b>${fmtDur(playedMs())}</b><span>logged play time</span></div>
        <div class="stat"><b>${data.sessions.length}</b><span>sessions</span></div>
        <div class="stat"><b>${done}/${data.goals.length}</b><span>goals done</span></div>
        <div class="stat"><b>${last ? new Date(last.e).toLocaleDateString() : '—'}</b><span>last session</span></div>
      </div>
      ${data.goals.some(g => !g.done) ? `<div class="card"><h3 style="margin-top:0">Up next</h3>${data.goals.filter(g => !g.done).slice(0, 3).map(g => `<div>• ${esc(g.t)}</div>`).join('')}</div>` : ''}
      <div class="card"><h3 style="margin-top:0">Quick links</h3><div class="row">${T.links(game).slice(0, 4).map(([t, u]) => `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`).join('')}</div></div>
      <div class="card"><h3 style="margin-top:0">Your companion's data</h3>
        <p class="dim">Goals, notes and sessions are saved in this browser only. Export them to keep a copy or move them to another device.</p>
        <div class="row"><button data-act="export">Export</button><button data-act="import">Import</button></div></div>`;
  },
  goals() {
    const done = data.goals.filter(g => g.done).length, n = data.goals.length;
    return `<h2>Goals</h2><p class="sub">Achievements to chase, things to build, bosses to beat. Tick them off as you go.</p>
      <div class="card">
        <form class="row" id="goalForm"><input id="goalIn" placeholder="Add a goal" style="flex:1;min-width:200px" maxlength="200"><button class="pri">Add</button></form>
        ${n ? `<div class="dim">${done} of ${n} done</div><div class="bar"><i style="width:${Math.round(done / n * 100)}%"></i></div>` : ''}
        ${data.goals.map((g, i) => `<div class="goal ${g.done ? 'done' : ''}"><input type="checkbox" data-goal="${i}" ${g.done ? 'checked' : ''}><span>${esc(g.t)}</span><button data-del-goal="${i}" title="Delete">✕</button></div>`).join('') || '<p class="dim">No goals yet.</p>'}
        ${done ? '<div class="row"><button data-act="clear-done">Clear finished goals</button></div>' : ''}
      </div>`;
  },
  notes() {
    return `<h2>Notes</h2><p class="sub">Build orders, seeds, where you left off, codes, anything. Saves as you type.</p>
      <textarea id="notes" placeholder="Notes for ${esc(game.n)}">${esc(data.notes)}</textarea>
      <div class="dim" id="saved">${data.notesAt ? 'Saved ' + fmtWhen(data.notesAt) : ''}</div>`;
  },
  sessions() {
    const rows = data.sessions.map((s, i) => ({ s, i })).reverse();
    const week = Date.now() - 7 * 864e5;
    const weekMs = data.sessions.filter(s => new Date(s.e) > week).reduce((t, s) => t + (new Date(s.e) - new Date(s.s)), 0);
    return `<h2>Play sessions</h2><p class="sub">Start the timer when you sit down to play and stop it when you're done.</p>
      <div class="card">
        <div class="timer" id="timer">${data.running ? fmtClock(Date.now() - new Date(data.running)) : '0:00:00'}</div>
        <div class="row"><button class="pri" data-act="session">${data.running ? '■ Stop' : '▶ Start'}</button>
          ${data.running || !T.launchURI(game) ? '' : `<a class="btn" href="${esc(T.launchURI(game))}" data-act="play-start">Start and launch the game</a>`}</div>
      </div>
      <div class="stats">
        <div class="stat"><b>${fmtDur(playedMs())}</b><span>total</span></div>
        <div class="stat"><b>${fmtDur(weekMs)}</b><span>last 7 days</span></div>
      </div>
      <div class="card">${rows.length ? `<table><tr><th>Started</th><th>Length</th><th>Note</th><th></th></tr>${rows.map(({ s, i }) => `<tr><td>${fmtWhen(s.s)}</td><td>${fmtDur(new Date(s.e) - new Date(s.s))}</td><td><input data-sess-note="${i}" value="${esc(s.note || '')}" placeholder="What happened?" style="width:100%"></td><td><button data-del-sess="${i}" title="Delete">✕</button></td></tr>`).join('')}</table>` : '<p class="dim">No sessions logged yet.</p>'}</div>`;
  },
  links() {
    return `<h2>Guides & links</h2><p class="sub">Wikis, guides and community pages for ${esc(game.n)}.</p>
      <div class="links">${T.links(game).map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener"><b>${esc(t)}</b><br><span class="dim" style="font-size:12px">${esc(new URL(u).hostname.replace(/^www\./, ''))}</span></a>`).join('')}</div>`;
  },
};

function fmtClock(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 3600) + ':' + String(Math.floor(s / 60) % 60).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function current() { const h = location.hash.slice(1); return VIEWS[h] ? h : 'overview'; }

function render() {
  const page = current();
  nav.innerHTML = `<h1>🎮 ${esc(game.n)}</h1>
    ${PAGES.map(([k, t]) => `<a href="#${k}" class="${k === page ? 'on' : ''}">${t}</a>`).join('')}
    <a class="home" href="/assistants/library/">← Your games</a><a class="home" href="/assistants/">← Game Assistants</a>`;
  main.innerHTML = VIEWS[page]();
  document.title = game.n + ' Companion · Tavernworks';
}

function toggleSession() {
  if (data.running) {
    const s = data.running, e = new Date().toISOString();
    if (new Date(e) - new Date(s) >= 60000) data.sessions.push({ s, e, note: '' });
    data.running = null;
  } else data.running = new Date().toISOString();
  persist(); render();
}

if (!game) {
  nav.innerHTML = '<h1>🎮 Companion</h1><a class="home" href="/assistants/library/">← Your games</a>';
  main.innerHTML = `<h2>Game not found</h2><p class="sub">This companion's game isn't in your linked library in this browser.</p><a class="btn pri" href="/assistants/library/">Link your launchers</a>`;
} else {
  const ded = T.dedicated(game);
  if (ded) location.replace(ded.href);
  render();
  addEventListener('hashchange', render);

  setInterval(() => {
    const t = document.getElementById('timer');
    if (t && data.running) t.textContent = fmtClock(Date.now() - new Date(data.running));
  }, 1000);

  main.addEventListener('click', e => {
    const el = e.target.closest('[data-act],[data-copy],[data-del-goal],[data-del-sess]');
    if (!el) return;
    if (el.dataset.copy) { navigator.clipboard.writeText(el.dataset.copy).then(() => { el.textContent = 'Copied'; }, () => {}); return; }
    if (el.dataset.delGoal) { data.goals.splice(+el.dataset.delGoal, 1); persist(); render(); return; }
    if (el.dataset.delSess) { if (confirm('Delete this session?')) { data.sessions.splice(+el.dataset.delSess, 1); persist(); render(); } return; }
    const act = el.dataset.act;
    if (act === 'session') toggleSession();
    else if (act === 'play-start') { data.running = new Date().toISOString(); persist(); setTimeout(render, 0); }
    else if (act === 'clear-done') { data.goals = data.goals.filter(g => !g.done); persist(); render(); }
    else if (act === 'export') {
      const blob = new Blob([JSON.stringify(Object.assign({ tavernworksCompanion: 1, key }, data), null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = game.n.replace(/[^\w-]+/g, '-').replace(/^-|-$/g, '') + '-companion.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } else if (act === 'import') {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = async () => {
        try {
          const j = JSON.parse(await inp.files[0].text());
          if (!j.tavernworksCompanion) throw 0;
          if (!confirm('Replace this companion\'s goals, notes and sessions with the imported ones?')) return;
          data = { goals: j.goals || [], notes: j.notes || '', notesAt: j.notesAt, sessions: j.sessions || [], running: null };
          persist(); render();
        } catch { alert("That file isn't a Tavernworks companion export."); }
      };
      inp.click();
    }
  });

  main.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.goal) { data.goals[+t.dataset.goal].done = t.checked; persist(); render(); }
    else if (t.dataset.sessNote) { data.sessions[+t.dataset.sessNote].note = t.value; persist(); }
  });

  main.addEventListener('submit', e => {
    if (e.target.id !== 'goalForm') return;
    e.preventDefault();
    const v = document.getElementById('goalIn').value.trim();
    if (!v) return;
    data.goals.push({ t: v, done: false, at: new Date().toISOString() });
    persist(); render();
    document.getElementById('goalIn').focus();
  });

  let noteTimer;
  main.addEventListener('input', e => {
    if (e.target.id !== 'notes') return;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => {
      data.notes = e.target.value; data.notesAt = new Date().toISOString(); persist();
      const s = document.getElementById('saved'); if (s) s.textContent = 'Saved ' + fmtWhen(data.notesAt);
    }, 400);
  });
  addEventListener('beforeunload', () => {
    const n = document.getElementById('notes');
    if (n && n.value !== data.notes) { data.notes = n.value; data.notesAt = new Date().toISOString(); persist(); }
  });

  persist();
}
</script>
</body>
</html>
