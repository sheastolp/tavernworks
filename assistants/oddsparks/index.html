const GUIDES=[
{id:'words',title:'Words the game uses',blurb:'Sparks, Aether Shards, Ancient Bases and the rest, in plain terms.',body:`
<table>
<tr><td><b>Spark</b></td><td>The little creatures that do everything. Workers carry items along paths and staff buildings, Fighters follow you into fights, Specials are thrown once for an effect.</td></tr>
<tr><td><b>Path</b></td><td>Your conveyor belt. Sparks only move items along paths you lay. No path, no delivery.</td></tr>
<tr><td><b>Aether Shard</b></td><td>The magic ingredient in every new Spark. Early on you collect them from Spunnies; later an Aetheric Distiller makes them.</td></tr>
<tr><td><b>Ancient Base</b></td><td>A fixed stone platform. Spark Workbenches can only go on one.</td></tr>
<tr><td><b>Giant Tree / Giant Rock</b></td><td>Fixed resource spots. A Logger goes on a Giant Tree, a Drill on a Giant Rock. They never run out.</td></tr>
<tr><td><b>Spark Pen</b></td><td>Storage for Sparks you aren't using. Call them out when you need an army.</td></tr>
<tr><td><b>Splitter</b></td><td>A path piece that sends Sparks down each branch in turn.</td></tr>
<tr><td><b>Tier</b></td><td>Quest level. Finishing quests in a tier opens the next one and its buildings.</td></tr>
</table>`},
{id:'start',title:'Your first hours',blurb:'From the first Stumpy to a running line, step by step.',body:`
<p>Oddsparks is a factory game with no conveyor belts. You build workshops, lay paths between them, and Sparks walk the paths carrying items. New buildings come from villager quests.</p>
<h3>1. Your first Sparks</h3>
<label class="chk"><input type="checkbox" data-k="s1"> Hunt a few Spunnies (the small hopping creatures) and pick up the Aether Shards they drop.</label>
<label class="chk"><input type="checkbox" data-k="s2"> Build a Spark Workbench on the Ancient Base (20 Wooden Log, 5 Aether Shard). Make Stumpy Sparks: 5 logs and 1 shard each.</label>
<h3>2. Your first line</h3>
<label class="chk"><input type="checkbox" data-k="s3"> Place a Logger on a Giant Tree. It makes logs forever.</label>
<label class="chk"><input type="checkbox" data-k="s4"> Place a Sawbench and lay a path from the Logger to it and back. Sparks carry logs over and the bench cuts them into Sawn Timber.</label>
<label class="chk"><input type="checkbox" data-k="s5"> Finish "Your First Production Line" and "Path Logistics".</label>
<h3>3. Get ready for Tier 2</h3>
<label class="chk"><input type="checkbox" data-k="s6"> Build a Spark Pen to store the Sparks you aren't using.</label>
<label class="chk"><input type="checkbox" data-k="s7"> Start saving for "Crafting Crafties": 60 Stumpy Sparks and 40 Wooden Panels. The <a href="#layouts/panels">Panel block</a> and <a href="#layouts/stumpy">Stumpy workshop</a> layouts get you there fastest.</label>
<h3>Habits</h3>
<ul><li>Talk to every villager. Quests are how buildings unlock.</li><li>Stuck in the terrain? Pause menu &rarr; <b>Unstuck</b> teleports you back to the village.</li><li>Don't tear down a working line to rebuild it bigger. Build the bigger one next to it, then switch.</li><li>The developers put a full run at roughly 50 hours. There's no rush.</li></ul>`},
{id:'tiers',title:'What to aim for in each tier',blurb:'A short road map from Tier 1 to the Corrupted Ruins.',body:`
<table>
<tr><th>Tier</th><th>Main goal</th><th>Build</th></tr>
<tr><td>1</td><td>Stumpies and timber</td><td>Spark Workbench, Logger, Sawbench. <a href="#layouts/panels">Panel block</a>.</td></tr>
<tr><td>2</td><td>Crafty Sparks (60 Stumpies + 40 Panels)</td><td>A second Logger. <a href="#layouts/crafty">Crafty line</a>.</td></tr>
<tr><td>3</td><td>Woodland Sparks and the Wood Workshop</td><td>Wood Workshop for Wooden Blades, then a Cutter (20 Wooden Blades) for Fertiliser.</td></tr>
<tr><td>4</td><td>Stone and Rope</td><td>Stonecutter. Loom (needs 3 Pengus Tendons, so hunt Pengus). <a href="#layouts/plates">Stone plate block</a>.</td></tr>
<tr><td>5</td><td>Stone Workshop and the Spark Workstation</td><td>Drills on Giant Rocks. <a href="#layouts/wheels">Stone Wheel line</a>. Rocky Sparks.</td></tr>
<tr><td>6</td><td>Fabric and Alchemy</td><td>Fibrecraft wants 400 Rope and 200 Stone Wheels. <a href="#layouts/rope">Rope and Fabric</a>.</td></tr>
<tr><td>7</td><td>Metal</td><td>Ore Miner and Furnace (Metallurgy: 90 Copper Ore). <a href="#layouts/hauling">Hauling Sparks</a>.</td></tr>
<tr><td>8-9</td><td>Drilly Sparks, cold and heat</td><td>Drilly Sparks for Permafrost and Obsidian. Bring spare Sparks to the Glacial Plateau and Volcanic Cave.</td></tr>
<tr><td>10</td><td>The Corrupted Ruins</td><td>Defensive Walls, Enemy Sensors, Scrubby Sparks.</td></tr>
</table>
<p class="dim">Exact quest amounts change between patches. The <a href="#quests">Quest Tracker</a> lists the ones we could confirm.</p>`},
{id:'logistics',title:'Designing paths',blurb:'Traffic rules for factories without belts.',body:`
<p>The short version: <b>Sparks go right, Splitters alternate, loops beat dead ends.</b></p>
{{loop}}
<h3>Before you build a line</h3>
<label class="chk"><input type="checkbox" data-k="l1"> Each producer has a path out and each consumer a path in.</label>
<label class="chk"><input type="checkbox" data-k="l2"> Every fork is either a Splitter, or you mean Sparks to skip the left branch (they turn right by default).</label>
<label class="chk"><input type="checkbox" data-k="l3"> Sparks can get back to the start without walking against traffic (a loop).</label>
<label class="chk"><input type="checkbox" data-k="l4"> You've counted the Sparks the line needs with the <a href="#calc">Route calculator</a>.</label>
<label class="chk"><input type="checkbox" data-k="l5"> No merge carries more Sparks than its shared tiles can hold.</label>
<h3>Common jams and fixes</h3>
<ul><li><b>Sparks stand still at a merge:</b> too many Sparks on shared tiles. Split the line in two, or swap to Carry or Hauling Sparks so fewer Sparks move the same amount.</li>
<li><b>One consumer gets everything:</b> it's on the right-hand branch. Add a Splitter at the fork.</li>
<li><b>Two lines steal each other's Sparks:</b> where they cross, use a Crossing piece so each line keeps its own path.</li>
<li><b>Buildings packed too tight:</b> players report that 4 tiles between buildings clogs; 6 to 8 flows.</li></ul>
<p>The full list is on the <a href="#logistics">Logistics</a> page.</p>`},
{id:'aether',title:'Getting Aether Shards',blurb:'Every Spark needs them. How to stop running out.',body:`
<p>Every Stumpy Spark costs one Aether Shard, and Stumpies go into almost every other Spark. Shards are the thing that limits you early on.</p>
<h3>Early: by hand</h3>
<label class="chk"><input type="checkbox" data-k="a1"> Hunt Spunnies whenever you pass them. Pick up the shards from their bodies too.</label>
<label class="chk"><input type="checkbox" data-k="a2"> Forest Spunnies are tougher. Take Slashy Sparks once you have them.</label>
<label class="chk"><input type="checkbox" data-k="a3"> Keep a stack of shards in every Spark Workbench so it never stops.</label>
<h3>Later: automated</h3>
<label class="chk"><input type="checkbox" data-k="a4"> Build an Aetheric Distiller. One Aetheric Pellet makes 6 Shards.</label>
<label class="chk"><input type="checkbox" data-k="a5"> Set a Cutter to Aetheric Pellet. One Aetheric Clump makes 6 Pellets, so a Clump is worth 36 Shards. See the <a href="#layouts/shards">Aether Shard factory</a>.</label>
<label class="chk"><input type="checkbox" data-k="a6"> End game: Refined Aether in the Distiller gives 30 Shards at once.</label>`},
{id:'stone',title:'The stone age',blurb:'Stonecutters, Drills and the Stone Workshop (Tiers 4-6).',body:`
<p>Stone opens the mid game: Stone Plates build most new buildings, and Stone Wheels go into Hauling Sparks.</p>
<label class="chk"><input type="checkbox" data-k="t1"> Finish Stone Harvesting & Cutting (Tier 4) to unlock the Stonecutter.</label>
<label class="chk"><input type="checkbox" data-k="t2"> Stone Plates are slow (32 s each, from 2 Stone). Build plenty of Stonecutters. See the <a href="#layouts/plates">Stone plate block</a>.</label>
<label class="chk"><input type="checkbox" data-k="t3"> Save a Beelephant Carapace and build a Drill on a Giant Rock (20 Stone Plate, 10 Sawn Timber, 1 Carapace).</label>
<label class="chk"><input type="checkbox" data-k="t4"> Find rocks for Stone, Limestone and Quartz. Each Drill mines what its rock gives.</label>
<label class="chk"><input type="checkbox" data-k="t5"> Finish Stonecraft - 1 for the Stone Workshop (20 Stone Plate, 20 Pebble).</label>
<label class="chk"><input type="checkbox" data-k="t6"> Build a <a href="#layouts/wheels">Stone Wheel line</a>. Fibrecraft (Tier 6) wants 200 wheels.</label>`},
{id:'organics',title:'Leaves, bark and rope',blurb:'Cutter, Loom, Fertiliser and Fabric.',body:`
<p>A Logger can harvest Tree Bark or Leaves instead of logs. These feed a whole second set of products.</p>
<label class="chk"><input type="checkbox" data-k="o1"> Make 20 Wooden Blades in the Wood Workshop. They build the Cutter and finish Processing Organics.</label>
<label class="chk"><input type="checkbox" data-k="o2"> Set a Cutter to Fertiliser (4 Leaves make 2). Fertiliser goes into Loamy Sparks and Explosives.</label>
<label class="chk"><input type="checkbox" data-k="o3"> Hunt Pengus for their tendons. The Loom costs 3, and Rope Making asks for 6.</label>
<label class="chk"><input type="checkbox" data-k="o4"> Rope Making (Tier 4, Merchant) wants 80 Tree Bark, 160 Leaves and 6 Pengus Tendons.</label>
<label class="chk"><input type="checkbox" data-k="o5"> Rope: 1 Bark + 2 Leaves. Fabric: 4 Bark + 2 Rope. See <a href="#layouts/rope">Rope and Fabric</a>.</label>
<div class="tip">Pengus spew toxic gas. Throw an empty Puffy Spark to soak it up, if you have one.</div>`},

/* ---- production chains ----
   chain(item, rate, hand) walks the recipes (S.recipes, so your edits count) and adds up, per item,
   how much is needed per minute and how many buildings that takes. Items in `hand` are fed by hand. */
function chain(item,rate,hand){
  const nodes={},edges={},col={};
  (function walk(it,need,depth,seen){
    const r=hand.includes(it)||seen.has(it)?null:recipeFor(it);
    const n=nodes[it]||(nodes[it]={item:it,r,need:0});
    n.need+=need;col[it]=Math.max(col[it]||0,depth);
    if(!r)return;
    const crafts=need/r.q,next=new Set(seen).add(it);
    for(const [k,q] of Object.entries(r.in)){edges[k+'>'+it]=(edges[k+'>'+it]||0)+crafts*q;walk(k,crafts*q,depth+1,next);}
  })(item,rate,0,new Set());
  Object.values(nodes).forEach(n=>{n.count=n.r?n.need/(60/n.r.s*n.r.q):0;n.col=col[n.item];});
  return {nodes,edges};
}
const busy=n=>{const b=Math.ceil(n.count-1e-9);return {b,pct:Math.round(n.count/b*100)};};
function chainSVG(g){
  const ns=Object.values(g.nodes),maxC=Math.max(...ns.map(n=>n.col)),W=200,H=62,GX=44,GY=14,byCol={};
  ns.forEach(n=>(byCol[n.col]=byCol[n.col]||[]).push(n));
  const rows=Math.max(...Object.values(byCol).map(c=>c.length)),pos={};
  Object.entries(byCol).forEach(([c,list])=>list.forEach((n,i)=>{pos[n.item]=[(maxC-c)*(W+GX)+10,10+(i+(rows-list.length)/2)*(H+GY)];}));
  const w=(maxC+1)*(W+GX)-GX+20,h=rows*(H+GY)-GY+20;
  const arrows=Object.keys(g.edges).map(k=>{const [a,b]=k.split('>'),[x1,y1]=pos[a],[x2,y2]=pos[b],sx=x1+W,sy=y1+H/2,ex=x2,ey=y2+H/2,m=(sx+ex)/2;
    return `<path d="M${sx} ${sy}C${m} ${sy} ${m} ${ey} ${ex-6} ${ey}" fill="none" stroke="#93a08a" stroke-width="1.6" marker-end="url(#ah)"/>`;}).join('');
  const boxes=ns.map(n=>{const [x,y]=pos[n.item],raw=!n.r,b=raw?null:busy(n);
    return `<g><title>${esc(n.item)}: ${fmt(n.need)}/min${raw?'':' from '+fmt(n.count)+' '+esc(n.r.b)}</title><rect x="${x}" y="${y}" width="${W}" height="${H}" rx="8" fill="${raw?'#202a1e':'#2a2f1c'}" stroke="${n.col===0?'#ffb547':raw?'#2f3d2b':'#5b6b45'}" stroke-width="${n.col===0?2:1.2}"/>
<text x="${x+10}" y="${y+19}" font-size="12.5" font-weight="700" fill="#e4e9dc">${esc(n.item)}</text>
<text x="${x+10}" y="${y+36}" font-size="11.5" fill="#ffd48a">${raw?'by hand / brought in':esc(n.r.b)+' ×'+b.b}${!raw&&b.pct<100?' <tspan fill="#93a08a">('+b.pct+'% busy)</tspan>':''}</text>
<text x="${x+10}" y="${y+52}" font-size="11.5" fill="#93a08a">${fmt(n.need)} per minute</text></g>`;}).join('');
  return `<div class="tbl"><svg class="tw-map" viewBox="0 0 ${w} ${h}" style="min-width:${Math.min(w,640)}px;max-width:${w}px" role="img" aria-label="Production chain diagram">
<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#93a08a"/></marker></defs>
<rect width="${w}" height="${h}" fill="#141a12"/>${arrows}${boxes}</svg></div>`;
}
function chainTable(g){
  const ns=Object.values(g.nodes).sort((a,b)=>b.col-a.col);
  return `<div class="tbl"><table><tr><th>Item</th><th>Per minute</th><th>Build</th></tr>${ns.map(n=>`<tr><td>${itemLink(n.item)}</td><td>${fmt(n.need)}</td><td>${n.r?`${busy(n).b} × ${esc(n.r.b)}${busy(n).pct<100?` <span class="dim">(${busy(n).pct}% busy)</span>`:''}`:'<span class="dim">hand-fed or brought in</span>'}</td></tr>`).join('')}</table></div>`;
}

/* ---- production planner ---- */
function recipeFor(item){return S.recipes.find(r=>r.out.toLowerCase()===item.toLowerCase());}
function plan(item,perMin,depth,lines,raw,seen){
  const r=recipeFor(item),pad='  '.repeat(depth);
  if(!r||seen.has(r.out.toLowerCase())){raw[item]=(raw[item]||0)+perMin;lines.push(`${pad}${item}: ${fmt(perMin)}/min  (raw or gathered)`);return;}
  const crafts=perMin/r.q,bRate=60/r.s*r.q,count=perMin/bRate;
  lines.push(`${pad}${r.out}: ${fmt(perMin)}/min  ->  ${fmt(count)} x ${r.b||'building'} (${Math.ceil(count-1e-9)} to build)${r.guess?'  [craft time is a placeholder]':''}`);
  const next=new Set(seen);next.add(r.out.toLowerCase());
  for(const [k,q] of Object.entries(r.in))plan(k,crafts*q,depth+1,lines,raw,next);
}

  const out=$('ro').value.trim(),q=parseFloat($('rq').value),s=parseFloat($('rs').value);
  if(!out||!(q>0)||!(s>0)){alert('Fill in what it makes, a quantity and a craft time.');return;}

  const i=S.recipes.findIndex(x=>x.out.toLowerCase()===out.toLowerCase());

function resetRecipes(){if(confirm('Replace your recipes with the defaults?')){S.recipes=BASE_RECIPES.map(r=>JSON.parse(JSON.stringify(r)));save();route();}}

/* ---- calculators ---- */
function pgCalc(){return `<h2>Calculators</h2><p class="sub">Quick maths for planning lines.</p>
<div class="card"><h3 style="margin-top:0">Craft time to rate</h3><div class="row">Seconds per craft <input id="ct" type="number" value="64"> Items per craft <input id="cq" type="number" value="1" style="width:80px"> Buildings <input id="cb" type="number" value="1" style="width:80px"></div><div class="res" id="cres"></div></div>
<div class="card"><h3 style="margin-top:0">Building ratio</h3><div class="row">Producer makes <input id="rp" type="number" value="6" style="width:80px">/min &nbsp; Consumer needs <input id="rc" type="number" value="4" style="width:80px">/min</div><div class="res" id="rres"></div></div>
<div class="card"><h3 style="margin-top:0">Sparks per route</h3><div class="row">Round trip seconds <input id="tt" type="number" value="20" style="width:80px"> Items per Spark trip <input id="tc" type="number" value="1" style="width:80px"> Target items/min <input id="tr" type="number" value="10" style="width:80px"></div><div class="res" id="tres"></div>
<p class="dim">Time one Spark's loop from pickup back to pickup. Stumpies carry one item; Carry and Hauling Sparks carry more, so check the number in-game.</p></div>
<div class="card"><h3 style="margin-top:0">Spark batch cost</h3><div class="row">Make <input id="bn" type="number" value="10" style="width:80px"> of <select id="br">${S.recipes.map(r=>`<option>${esc(r.out)}</option>`).join('')}</select></div><div class="res" id="bres"></div></div>`;}
const nv=id=>parseFloat($(id).value);
function calcAll(){
  const t=nv('ct'),q=nv('cq'),b=nv('cb');
  $('cres').innerHTML=t>0&&q>0&&b>0?`<b>${fmt(60/t*q*b)}</b> per minute &nbsp;·&nbsp; ${fmt(3600/t*q*b)} per hour &nbsp;·&nbsp; one item every ${fmt(t/(q*b))} s`:'Enter positive numbers.';
  const p=nv('rp'),c=nv('rc');
  if(p>0&&c>0){let best=null;for(let i=1;i<=12&&!best;i++){const j=i*p/c;if(Math.abs(j-Math.round(j))<0.02&&Math.round(j)<=24)best=[i,Math.round(j)];}
    $('rres').innerHTML=`One producer feeds <b>${fmt(p/c)}</b> consumers.`+(best?` A balanced block: <b>${best[0]}</b> producer${best[0]>1?'s':''} to <b>${best[1]}</b> consumer${best[1]>1?'s':''}.`:' No small whole-number ratio; round up the producers.');}
  else $('rres').textContent='Enter positive numbers.';
  const tt=nv('tt'),tc=nv('tc'),tr=nv('tr');
  $('tres').innerHTML=tt>0&&tc>0&&tr>0?(()=>{const per=60/tt*tc,n=Math.ceil(tr/per-1e-9);return `One Spark moves <b>${fmt(per)}</b> items/min. You need <b>${n}</b> Spark${n>1?'s':''} on this route (${fmt(n*per)} items/min).`;})():'Enter positive numbers.';
  const bn=nv('bn'),r=recipeFor($('br').value||'');
  if(r&&bn>0){const crafts=Math.ceil(bn/r.q-1e-9);$('bres').innerHTML=`${crafts} craft${crafts>1?'s':''}: `+Object.entries(r.in).map(([k,v])=>`<b>${fmt(v*crafts)}</b> ${esc(k)}`).join(', ')+` &nbsp;·&nbsp; ${fmt(crafts*r.s/60)} min on one ${esc(r.b||'building')}`;}
  else $('bres').textContent='Add a recipe on the Production Planner page.';
}

function pgNotes(){return `<h2>My Notes</h2><p class="sub">Saved automatically on this device.</p><textarea id="nt" style="width:100%;height:60vh" placeholder="Base layout, quest progress, what each villager wants...">${esc(S.notes)}</textarea>`;}

/* ================= ROUTER ================= */
function route(){
  const [pg,sub]=(location.hash.slice(1)||'home').split('/');
  const page=PAGES.some(p=>p[0]===pg)?pg:'home';
  buildNav(page);
  const m=$('main');
  m.innerHTML=({home:pgHome,guides:()=>pgGuides(sub),layouts:()=>pgLayouts(sub),recipes:()=>pgRecipes(sub),buildings:pgBuildings,sparks:pgSparks,logistics:pgLogistics,quests:pgQuests,world:pgWorld,planner:pgPlanner,calc:pgCalc,notes:pgNotes})[page]();
  window.scrollTo(0,0);
  m.querySelectorAll('input[type=checkbox][data-k]').forEach(cb=>{cb.checked=!!S.checks[cb.dataset.k];cb.onchange=()=>{S.checks[cb.dataset.k]=cb.checked;save();};});
  m.querySelectorAll('input[type=checkbox][data-q]').forEach(cb=>{cb.onchange=()=>{S.quests[cb.dataset.q]=cb.checked;save();questProgress();};});
  if(page==='recipes'&&$('rq2')){$('rq2').oninput=recipesRender;$('rb2').onchange=recipesRender;recipesRender();}
  if(page==='planner'){['pt','pr','ph'].forEach(id=>$(id).oninput=$(id).onchange=runPlan);runPlan();}
  if(page==='sparks'){$('sq').oninput=sparksRender;$('sk').onchange=sparksRender;$('sc').onchange=sparksRender;sparksRender();}
  if(page==='calc'){m.querySelectorAll('input,select').forEach(e=>e.oninput=calcAll);calcAll();}
  if(page==='notes')$('nt').oninput=e=>{S.notes=e.target.value;save();};
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
