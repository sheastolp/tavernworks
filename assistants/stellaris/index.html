<title>Stellaris Assistant · Tavernworks</title>
<meta name="description" content="Stellaris Assistant: beginner to expert guides, every origin, an empire builder that checks your ethics, authority, civics and origin, species traits with a trait-point builder, planets and a habitability checker, the economy, technology, traditions and an ascension perk planner, leaders and policies, diplomacy and the Galactic Community, a megastructure and relic tracker, leviathans, fallen empires and crises with prep checklists, weapons and defenses with a fleet counter finder, ships, war goals, DLC, a campaign tracker, a galactic log, console commands and notes. Runs in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
<style>
:root{--bg:#0a0e16;--panel:#111827;--panel2:#1a2234;--line:#2a3550;--tx:#e6ecf5;--dim:#8f9bb3;--acc:#5cc8f0;--acc-ink:#03202b;--acc2:#b9a3f0;--ok:#7fd8a0;--warn:#f2c14e;--err:#ff7a6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
#app{display:flex;height:100vh}
#nav{width:225px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
#nav h1{font-size:15px;margin:4px 8px 12px;color:var(--acc);letter-spacing:.5px}
#nav a{display:block;padding:7px 10px;margin:2px 0;border-radius:6px;color:var(--tx);text-decoration:none;cursor:pointer}
#nav a:hover{background:var(--panel2)}
#nav a.home{color:var(--dim);font-size:13px}
#nav a.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
#nav .grp{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:12px 10px 2px}
#main{flex:1;overflow:auto;padding:20px 24px}
h2{margin:0 0 4px;font-size:22px}
h3{margin:18px 0 6px;color:var(--acc2);font-size:16px}
p.sub{color:var(--dim);margin:0 0 16px}
a{color:var(--acc2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.tile:hover{border-color:var(--acc)}
.tile b{color:var(--acc)}
@media(max-width:760px){#app{flex-direction:column;height:auto;min-height:100vh}#nav{width:auto;display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}#nav h1{width:100%}#nav .grp{display:none}#main{padding:16px}}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
input,select,textarea{background:#070a10;border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
input[type=text],input[type=number],input[type=search]{width:130px}
input[type=checkbox]{width:auto}
table{border-collapse:collapse;width:100%}
td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--panel2);color:var(--dim);margin:1px 0 1px 6px}
.tag.w{background:#16291f;color:#9fe0b4}.tag.r{background:#2c1716;color:#ff9b8f}.tag.i{background:#13243a;color:#9cc9f0}.tag.g{background:#2c2410;color:#efcd7a}.tag.v{background:#241a3a;color:#c9b4f5}
.note{border-left:3px solid var(--warn);background:#221d0e;padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;color:#eadca6}
.tip{border-left:3px solid var(--acc);background:var(--panel2);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.ok{color:var(--ok)}.bad{color:var(--err)}.dim{color:var(--dim)}.wrn{color:var(--warn)}
label.chk{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.conf{color:var(--ok)}.unv{color:var(--warn)}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--acc)}
a.mob{font-weight:600;color:var(--acc);text-decoration:none;cursor:pointer}
a.mob:hover{text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat small{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stat .big{font:600 20px/1.2 Consolas,"Cascadia Mono",monospace}
.mech li{margin:4px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{border-radius:999px;padding:3px 11px;font-size:13px}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chips button.off{opacity:.45}
.chips button.fan{background:var(--acc2);color:#1a1030;border-color:var(--acc2)}
.chk-list div{margin:3px 0}
.pill{display:inline-block;min-width:26px;text-align:center;font:600 12px/20px Consolas,monospace;border-radius:5px;padding:0 6px;background:var(--panel2);border:1px solid var(--line)}
.pill.pos{color:var(--ok)}.pill.neg{color:var(--err)}
.hab{display:inline-block;min-width:52px;text-align:center;font:600 12px/20px Consolas,monospace;border-radius:5px;color:#08121a}
.timeline{position:relative;margin:10px 0 18px;padding-left:22px;border-left:2px solid var(--line)}
.timeline .ev{position:relative;margin:0 0 12px}
.timeline .ev:before{content:"";position:absolute;left:-29px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--panel2);border:2px solid var(--line)}
.timeline .ev.past:before{background:var(--acc);border-color:var(--acc)}
.timeline .ev.now:before{background:var(--warn);border-color:var(--warn);box-shadow:0 0 0 4px #f2c14e33}
.timeline .yr{font:600 13px Consolas,monospace;color:var(--acc)}
.slot{background:var(--panel2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;min-height:42px}
.slot.full{border-style:solid;border-color:var(--acc)}
.perks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:10px 0}
.verdict{border-radius:8px;padding:10px 12px;margin:8px 0;border:1px solid var(--line);background:var(--panel2)}
.verdict.good{border-color:#2f6a46}.verdict.badv{border-color:#7a2f2a}
kbd,code{font:12px Consolas,"Cascadia Mono",monospace;background:#070a10;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
</style>

<script>
/* ================= DATA =================
   conf: true  = long-standing mechanics from the Stellaris wiki, Paradox dev diaries or several agreeing guides.
   conf: false = exact numbers that moved between patches, DLC details, or single-source claims; check the tooltip.
   Written against the 4.x versions (2025 to 2026). Version 4.0 ("Phoenix") reworked pops into pop groups,
   jobs into workforce and districts into zones, so exact outputs from older guides are often wrong now;
   anything with a number in it is marked ○ unless it has stayed put for years. Stellaris shows the real
   value of almost everything in a tooltip: trust that first. */

/* Ethics. id, name, opposite id, short effect, playstyle. f=fanatic doubles the effect and costs 2 points. */
const ETHICS=[
{id:'aut',n:'Authoritarian',opp:'ega',eff:'More influence; slavery allowed; worker stratum happier with order',play:'Stable, tall or slaving empires. Unlocks Imperial authority and the Slaver Guilds and Imperial Cult civics.',conf:true},
{id:'ega',n:'Egalitarian',opp:'aut',eff:'Better specialist output and faction influence; no slavery',play:'Democracies, research and unity from happy specialists.',conf:true},
{id:'xph',n:'Xenophobe',opp:'xpl',eff:'Faster pop growth, cheaper outposts; dislikes other species',play:'Claim space fast; fanatic + militarist or spiritualist unlocks Fanatic Purifiers.',conf:true},
{id:'xpl',n:'Xenophile',opp:'xph',eff:'Better trade and diplomacy, more envoys; likes aliens',play:'Federations, migration treaties and a multi-species empire.',conf:true},
{id:'mil',n:'Militarist',opp:'pac',eff:'Faster fire rate and cheaper claims',play:'Early conquest. Warrior Culture, Distinguished Admiralty and Nationalistic Zeal want it.',conf:true},
{id:'pac',n:'Pacifist',opp:'mil',eff:'More stability; limits on aggressive wars',play:'Tall builders. Agrarian Idyll and Inwards Perfection.',conf:true},
{id:'spi',n:'Spiritualist',opp:'mat',eff:'More unity and stability; Psionic ascension is natural',play:'Unity-heavy builds, Exalted Priesthood, Psionics.',conf:true},
{id:'mat',n:'Materialist',opp:'spi',eff:'More research; robots earlier and happier',play:'Tech rush, Technocracy, Synthetic ascension.',conf:true},
{id:'ges',n:'Gestalt Consciousness',opp:'',eff:'One mind: no factions, no ethics drift, no happiness. Takes all three points.',play:'Hive Mind or Machine Intelligence. A very different game.',conf:true}
];
const ETHN=Object.fromEntries(ETHICS.map(e=>[e.id,e.n]));

/* Authorities. ban: ethics it can't be taken with ('f' prefix = only the fanatic version is banned). */
const AUTH=[
{id:'dem',n:'Democratic',ban:['aut'],eff:'Elections every 10 years; the ruler gets a mandate to fulfil for a reward. More leader options.',tip:'Great for Egalitarian builds. Mandates are free unity and influence if you plan for them.',conf:true},
{id:'oli',n:'Oligarchic',ban:['fega','faut'],eff:'Elections every 20 years; agenda costs less.',tip:'The flexible middle ground. Works with almost every civic.',conf:false},
{id:'dic',n:'Dictatorial',ban:['ega'],eff:'Ruler for life; ruler gets more leader traits.',tip:'Pair with Philosopher King or Exalted Priesthood.',conf:true},
{id:'imp',n:'Imperial',ban:['ega'],eff:'Ruler for life with an heir from the same family.',tip:'Unlocks Imperial Cult (with Spiritualist and Authoritarian). Strong stability.',conf:true},
{id:'cor',n:'Corporate',ban:[],dlc:'MegaCorp',eff:'Branch offices on other empires\' planets; corporate civics; trade focus.',tip:'Plays like Oligarchic with a commercial twist. Criminal Heritage changes how branch offices work.',conf:false},
{id:'hive',n:'Hive Mind',gestalt:'hive',ban:[],dlc:'Utopia',eff:'One organic mind. Drones, no consumer goods, no factions.',tip:'Devouring Swarm and Tree of Life are the famous builds.',conf:true},
{id:'mac',n:'Machine Intelligence',gestalt:'mac',ban:[],dlc:'Synthetic Dawn',eff:'One machine mind. Robots instead of pops, no food unless you have organics.',tip:'Determined Exterminator, Driven Assimilator and Rogue Servitor are the special builds.',conf:true}
];

/* Civics. a: who can take it ('reg' = Democratic, Oligarchic, Dictatorial, Imperial; 'cor' = Corporate;
   'hive'; 'mac'). auth: narrows the authority. req: ethics needed ('mil' = militarist or fanatic militarist,
   'fxph' = fanatic only, 'mil|spi' = either). ban: ethics it can't have. x: civics it can't be combined with. */

{n:'Meritocracy',a:'reg',auth:['dem','oli'],eff:'Specialist output up; leaders cap higher.',r:'A',conf:true},
{n:'Masterful Crafters',a:'reg',eff:'Artisans make more consumer goods and some trade/unity.',r:'A',conf:false},

{n:'Inwards Perfection',a:'reg',req:['pac','xph'],x:['Diplomatic Corps','Free Haven'],eff:'Big unity and stability; can\'t do most diplomacy.',r:'A',conf:true},
{n:'Diplomatic Corps',a:'reg',x:['Inwards Perfection','Fanatic Purifiers'],eff:'More envoys and diplomatic weight.',r:'B',conf:false},
{n:'Free Haven',a:'reg',req:['xpl'],x:['Inwards Perfection'],eff:'Faster migration, more pop growth from immigration.',r:'B',conf:true},
{n:'Pompous Purists',a:'reg',req:['xph'],eff:'More influence; a proud, inward-looking diplomacy ○.',r:'C',conf:false},
{n:'Environmentalist',a:'reg',ban:['fmat'],eff:'Pops use fewer consumer goods; happier.',r:'C',conf:false},
{n:'Pleasure Seekers',a:'reg',eff:'Servants jobs, decadent lifestyle; amenities and happiness.',r:'C',conf:false},
{n:'Death Cult',a:'reg',req:['spi'],dlc:'Necroids',eff:'Mortal initiates and sacrifice edicts for big temporary bonuses.',r:'B',conf:false},

{n:'Barbaric Despoilers',a:'reg',req:['aut','mil'],ban:['xpl','pac'],x:['Fanatic Purifiers'],dlc:'Apocalypse',eff:'Raid planets for pops and resources with special war goals.',r:'B',conf:false},
{n:'Catalytic Processing',a:'reg',dlc:'Plantoids',eff:'Alloy foundries use food instead of minerals.',r:'B',conf:false},
{n:'Byzantine Bureaucracy',a:'reg',ban:['ges'],eff:'Bureaucrats make stability; gets better with more of them.',r:'C',conf:false},
{n:'Cutthroat Politics',a:'reg',eff:'Leaders gain experience faster; more scandals.',r:'C',conf:false},
/* Corporate */
{n:'Criminal Heritage',a:'cor',eff:'Branch offices are criminal syndicates: they work anywhere, even without a treaty.',r:'A',dlc:'MegaCorp',conf:true},
{n:'Free Traders',a:'cor',eff:'More trade value; trade policies stronger.',r:'B',dlc:'MegaCorp',conf:false},
{n:'Gospel of the Masses',a:'cor',req:['spi'],eff:'Spiritualist pops make trade.',r:'B',dlc:'MegaCorp',conf:true},
{n:'Indentured Assets',a:'cor',req:['aut'],eff:'Corporate slavery: indentured servitude.',r:'B',dlc:'MegaCorp',conf:true},
{n:'Media Conglomerate',a:'cor',eff:'Branch offices and culture workers make unity.',r:'C',dlc:'MegaCorp',conf:false},
{n:'Naval Contractors',a:'cor',eff:'More naval capacity; shipbuilding branch buildings.',r:'B',dlc:'MegaCorp',conf:false},
{n:'Private Prospectors',a:'cor',eff:'Cheaper outposts.',r:'C',dlc:'MegaCorp',conf:false},
{n:'Ruthless Competition',a:'cor',eff:'Leaders are better and level faster.',r:'C',dlc:'MegaCorp',conf:false},
{n:'Trading Posts',a:'cor',eff:'Cheaper outposts in systems with trade.',r:'C',dlc:'MegaCorp',conf:false},
{n:'Franchising',a:'cor',eff:'Subjects pay you more; extra branch office value.',r:'C',dlc:'MegaCorp',conf:false},
{n:'Brand Loyalty',a:'cor',eff:'More unity from branch offices.',r:'C',dlc:'MegaCorp',conf:false},
/* Hive */
{n:'Devouring Swarm',a:'hive',x:['Empath'],eff:'Eats other species. Total war, strong early fleets, hates everyone.',r:'A',conf:true},
{n:'Terravore',a:'hive',x:['Devouring Swarm','Empath'],dlc:'Lithoids',eff:'Eats planets (lithoid): consume worlds into minerals and alloys.',r:'B',conf:false},
{n:'Ascetic',a:'hive',eff:'Fewer amenities needed; stability up.',r:'B',conf:true},
{n:'Divided Attention',a:'hive',eff:'More administrative capacity from synapse drones.',r:'B',conf:false},
{n:'Empath',a:'hive',x:['Devouring Swarm','Terravore'],dlc:'Federations',eff:'Can do diplomacy normally; trust and opinion bonuses.',r:'B',conf:false},

{n:'Constructobot',a:'mac',eff:'Cheaper districts and buildings.',r:'B',conf:false},

{n:'Unitary Cohesion',a:'mac',eff:'More unity.',r:'B',conf:false},
{n:'Zero-Waste Protocols',a:'mac',eff:'Less upkeep for buildings and pops.',r:'B',conf:false},
{n:'Warbots',a:'mac',eff:'Stronger armies.',r:'C',conf:false},
{n:'Catalytic Processing',a:'mac',dlc:'Plantoids',eff:'Alloys from food.',r:'C',conf:false,key:'Catalytic Processing (machine)'}

/* Origins. d: difficulty 1-5. req: a short requirement string shown to the player; chk: machine-checked
   requirements for the empire builder (gestalt: only gestalt / 'no' = not gestalt; auth; req ethics). */
const ORIGINS=[
{n:'Prosperous Unification',d:1,dlc:'',eff:'A strong capital and a few years of bonus output.',tip:'The safest start. Best for your first game.',chk:{},conf:true},
{n:'Galactic Doorstep',d:2,dlc:'',eff:'A dormant gateway in your home system.',tip:'A gateway network early if you research it; otherwise similar to Prosperous Unification.',chk:{},conf:true},
{n:'Lost Colony',d:2,dlc:'',eff:'You\'re a colony of a more advanced parent empire that appears nearby.',tip:'Good diplomacy start; the parent empire is often friendly.',chk:{},conf:true},
{n:'Remnants',d:2,dlc:'Ancient Relics',eff:'Home world is a Relic World with an ancient arcology.',tip:'Lots of unity and research; relic worlds have different districts.',chk:{},conf:true},
{n:'Shattered Ring',d:3,dlc:'Federations',eff:'You live on a broken ring world segment.',tip:'Strong once you repair the segments; slow first decades.',chk:{},conf:true},

{n:'Post-Apocalyptic',d:3,dlc:'Federations',eff:'A tomb world home, survivor species, radiation-proof.',tip:'You can colonise tomb worlds well; nobody else wants them.',chk:{gestalt:'notmac'},conf:true},
{n:'Syncretic Evolution',d:2,dlc:'Federations',eff:'A second, servile species shares your home world.',tip:'Free extra worker species with strong traits.',chk:{gestalt:'notmac'},conf:true},

{n:'Common Ground',d:2,dlc:'Federations',eff:'Start in a federation with two other new empires.',tip:'Learn federations with friends from day one.',chk:{gestalt:'no',ban:['xph']},conf:false},
{n:'Hegemon',d:2,dlc:'Federations',eff:'Lead a Hegemony federation with two lesser empires.',tip:'You lead; the members follow.',chk:{gestalt:'no',ban:['ega']},conf:false},
{n:'Doomsday',d:4,dlc:'Federations',eff:'Your home world will explode in a few decades.',tip:'Expand fast. The planet does blow up.',chk:{},conf:true},

${ck('o4','Capital: build a mining district and a generator district first, then a research building.')}
${ck('o5','Tradition: <b>Discovery</b> (research) or <b>Expansion</b> (wide). Gestalts often start with Expansion.')}
${ck('o6','Colonise two planets by 2220 if you can. Use the colony ship from the colony tech.')}
${ck('o7','Build an <b>alloy foundry</b> (or the gestalt version) by 2215: alloys build everything.')}
${ck('o8','Upgrade your capital starbase to a <b>Starport</b> and add a shipyard and anchorages.')}
${ck('o9','Make a small fleet: 6 to 10 corvettes to kill pirates and space critters.')}
${ck('o10','Pick your first <b>ascension perk</b> when it unlocks: Technological Ascendancy, Interstellar Dominion or a path.')}
<div class="note">Exact build orders changed with 4.0 (pop groups and district zones) ○. The priorities above haven't.</div>`},
{id:'economy',title:'Economy that works',blurb:'Jobs, districts, specialisation and the market.',body:`
<p>Stellaris economy is <b>pops → jobs → resources</b>. Districts and buildings create jobs; pops fill them; jobs make resources.</p>
${ck('e1','Give each planet a <b>designation</b>: mining, agri, generator, forge, factory, research. One planet doing one thing is stronger. See <a href="#economy">Economy</a>.')}
${ck('e2','Watch <b>unemployment</b> and <b>free jobs</b>: build ahead of growth by one district.')}
${ck('e3','Balance <b>consumer goods</b>: specialists eat them. Build civilian industries or buy on the market.')}
${ck('e4','Don\'t chase a huge surplus: a small positive income of each resource is enough. Spend the rest.')}
${ck('e5','Use the <b>Galactic Market</b> to fix shortages. Buying a little is fine; selling surplus minerals early is common.')}
${ck('e6','Plan <b>alloys</b>: aim for 20 to 30 per month by 2230 and 100 or more by 2300 ○.')}
${ck('e7','Research matters most: researchers on a strong research world, plus research buildings.')}
${ck('e8','Use <b>edicts</b> for your biggest need, and swap them as needs change.')}
<div class="tip">Version 4.0 reworked trade into its own resource with clerk and merchant jobs, and pop growth into pop groups. Old guides about trade routes and piracy may be out of date ○.</div>`},
{id:'expansion',title:'Expansion and colonies',blurb:'Outposts, colony targets, habitability and sprawl.',body:`
${ck('x1','Outpost every useful system you can reach. Prioritise chokepoints and systems with habitable planets.')}
${ck('x2','Colonise planets with <b>60% habitability or better</b> first, bigger planets first. See <a href="#habitability">the checker</a>.')}
${ck('x3','Use <b>Expansion</b> traditions and <b>Interstellar Dominion</b> for a wide game.')}
${ck('x4','Gene-mod or ask aliens to join you: a second species with a different climate doubles your options.')}
${ck('x5','Watch <b>administrative capacity</b> (sprawl). Expanding past it raises tech and tradition costs, but it\'s usually still worth it.')}
${ck('x6','Plan habitats (Voidborne) and terraforming for later. Ring Worlds are the best real estate.')}
<div class="tip">Wide vs tall: wide empires get more of everything but pay sprawl; tall empires stack bonuses on a few strong worlds. Both work; Stellaris tends to reward more pops.</div>`},
{id:'research',title:'Research',blurb:'What to research, rare techs and the tech deck.',body:`
<p>Three fields: <b>Physics</b> (energy, shields, lasers), <b>Society</b> (food, colonies, gene modding) and <b>Engineering</b> (minerals, ships, armor).</p>
${ck('r1','Take <a href="#tech">resource techs</a> as soon as they show up.')}
${ck('r2','Take colony and habitability techs early in a wide game.')}
${ck('r3','Take weapon and armor upgrades for one weapon type; don\'t spread across all.')}
${ck('r4','Rare techs (purple cards) are worth it. Don\'t skip them.')}
${ck('r5','Science ships with high-level scientists research faster on the council.')}
${ck('r6','Late game: repeatables. Weapon damage, armor and resource repeatables decide crisis fights.')}
<div class="tip">You don\'t see every tech. The game draws three options per field from a weighted deck. Technological Ascendancy and some traditions add a fourth option ○.</div>`},
{id:'unity',title:'Unity, traditions and ascension',blurb:'Pick tradition trees and ascension perks in a smart order.',body:`
${ck('u1','First tree: <b>Discovery</b> or <b>Expansion</b>. Second: Prosperity or Harmony / Synchronicity.')}
${ck('u2','Use the <a href="#traditions">ascension planner</a> to plan your perks.')}
${ck('u3','First perk: Technological Ascendancy, Interstellar Dominion or One Vision.')}
${ck('u4','Second or third perk: start your <b>ascension path</b>.')}
${ck('u5','Mid-game: Galactic Wonders or Master Builders for megastructures; Galactic Force Projection for war.')}
${ck('u6','Build unity: bureaucrats, priests, monuments. Unity also buys edicts and leaders.')}`},
{id:'fleets',title:'Fleets and combat',blurb:'Ship designs, counters and how battles work.',body:`
<p>Battles are automatic. You win them before they start: with <b>composition</b>, <b>counters</b>, <b>tech</b> and <b>numbers</b>.</p>
${ck('fl1','Pick one weapon family to research deeply. Mix kinetic and energy until you see the enemy.')}
${ck('fl2','Check the enemy fleet\'s shields and armor (click the fleet) and use the <a href="#combat">counter finder</a>.')}
${ck('fl3','Early: corvettes with mixed weapons. Mid: destroyers as pickets and cruisers. Late: artillery battleships and a titan.')}
${ck('fl4','Use the right combat computer: artillery for battleships, swarm for corvettes, picket for destroyers.')}
${ck('fl5','Keep fleets under command limit and total ships under naval capacity.')}
${ck('fl6','Merge fleets before big battles; fight at your own starbases when you can.')}
${ck('fl7','Admirals matter: pick traits that boost fire rate or evasion.')}
<div class="tip">Fleet power is a rough guide. A fleet with the right counters can beat one with 1.5× the power.</div>`},
{id:'defense',title:'Starbases and defense',blurb:'Chokepoints, starbase builds and fortress worlds.',body:`
${ck('d1','Find your chokepoints: systems that every invader must go through.')}
${ck('d2','Upgrade chokepoint starbases to Star Hold or Fortress and add <b>defense platforms</b>, gun batteries and hangar bays.')}
${ck('d3','Use a Fortress world or Unyielding tradition for real fortresses.')}
${ck('d4','Keep your fleet nearby; starbases buy time but rarely win alone.')}
${ck('d5','Ion cannons and Eternal Vigilance make starbases scary late.')}`},
{id:'diplomacy',title:'Diplomacy and federations',blurb:'Opinion, trust, pacts, the Galactic Community and federations.',body:`
${ck('dp1','Send envoys to improve relations with neighbours you want as friends.')}
${ck('dp2','Sign research and commercial pacts: free bonuses.')}
${ck('dp3','A defensive pact with a strong neighbour stops a lot of wars.')}
${ck('dp4','Found or join a <a href="#diplomacy">federation</a> that matches your ethics.')}
${ck('dp5','In the Galactic Community, vote for resolutions that help you and against sanctions on you.')}
${ck('dp6','Rivalries give influence and unity; one rival at a time is plenty.')}`},
{id:'gestalt',title:'Playing a gestalt',blurb:'Hive Minds and Machine Intelligences play differently.',body:`
<ul class="mech"><li>No factions, no happiness, no consumer goods (mostly). Stability comes from amenities and policies.</li><li>Drones fill jobs: menial drones (workers) and complex drones (specialists).</li><li>Machines need no food (unless they keep organics); hives need food but no goods.</li><li>Gestalts have their own tradition (Synchronicity) and their own civics.</li><li>Devouring Swarm and Determined Exterminator are total-war empires: everyone hates you, and you get combat bonuses.</li><li>Driven Assimilators turn organics into cyborgs; Rogue Servitors keep bio-trophies for unity.</li></ul>
${ck('g1','Use Expansion early: gestalts expand fast.')}
${ck('g2','Keep amenities up: maintenance drones are your entertainers.')}
${ck('g3','Exterminators and swarms: build fleets early. You will be at war with everyone.')}`},
{id:'megacorp',title:'Playing a MegaCorp',blurb:'Branch offices, trade and commercial pacts.',body:`
<ul class="mech"><li>Corporate authority (MegaCorp DLC). Sign commercial pacts with neighbours, then build <b>branch offices</b> on their planets for income.</li><li>Criminal Heritage needs no pacts: your offices are crime syndicates.</li><li>Universal Transactions (ascension perk) opens more empires.</li><li>Trade matters more for you; check how 4.0 trade works in the tooltip ○.</li></ul>
${ck('m1','Commercial pact with every neighbour.')}
${ck('m2','Branch office on the biggest planets you can reach.')}`},
{id:'genocide',title:'Genocidal empires',blurb:'Fanatic Purifiers, Exterminators and Devouring Swarms.',body:`
<ul class="mech"><li>Every other empire hates you forever. You can\'t do diplomacy.</li><li>You get big combat and bombardment bonuses, and no claims are needed: you take systems when you win.</li><li>Purge the pops on the planets you take, or use them while they last.</li><li>Your early fleet decides the game. Rush a neighbour before 2230.</li></ul>
${ck('gc1','Build a fleet early: two shipyards, alloys first.')}
${ck('gc2','Attack the weakest neighbour first; avoid fallen empires.')}
${ck('gc3','Plan defense: every AI will gang up on you.')}`},
{id:'crisis',title:'Crises and the endgame',blurb:'Prepare 50 years before the end-game year.',body:`
<p>The endgame crisis is designed to beat unprepared players. See <a href="#threats">Threats</a> for each crisis and its counters.</p>
${ck('cr1','By 2350: alloys income of 200 or more, research going into repeatables ○.')}
${ck('cr2','Titans, battleships and a Juggernaut or Mega Shipyard.')}
${ck('cr3','Starbase fortresses on your chokepoints.')}
${ck('cr4','Defender of the Galaxy or Galactic Force Projection ascension perks.')}
${ck('cr5','Federation or allies: a crisis is easier together.')}
${ck('cr6','When it appears: check its shields and armor, refit your designs, and strike before it grows.')}`},
{id:'ascension',title:'Ascension paths',blurb:'Genetic, Psionic, Cybernetic, Synthetic and machine paths.',body:`
<p>Your ascension path changes your species for the late game. In recent versions each path is a tradition tree unlocked by an ascension perk ○.</p>
<ul class="mech">${PATHS.map(p=>`<li><b style="color:${p.col}">${p.n}</b>: ${p.what} <span class="dim">Best for: ${p.best}</span></li>`).join('')}</ul>
${ck('as1','Pick a path by 2260 or so, ideally as your second or third perk.')}
${ck('as2','Psionic: watch Shroud events. Some patrons have a price.')}
${ck('as3','Synthetic: robots don\'t need food; rebuild your economy around it.')}`},
{id:'ironman',title:'Ironman and achievements',blurb:'Settings, saves and the difficulty jump.',body:`
<ul class="mech"><li>Ironman saves to one file automatically; you can\'t load an older save.</li><li>Achievements need Ironman and an unmodified game (checksum).</li><li>Difficulties: Ensign, Captain, Commodore, Admiral, Grand Admiral. Commodore and up give the AI bonuses; set scaling difficulty to ramp them over time.</li><li>Crisis strength can be raised to 25× ○: the AI scales too.</li></ul>`},
{id:'mistakes',title:'Common mistakes',blurb:'What new players do wrong (and how to fix it).',body:`<ul class="mech">${MISTAKES.map(m=>`<li><b>${m[0]}</b>: ${m[1]}</li>`).join('')}</ul>`}
];

let S={checks:{},game:{empire:'',species:'',origin:'',year:'2200',diff:'',size:'',iron:false},goals:[],log:[],mega:{},relics:{},build:{eth:{},auth:'',civ:[],origin:''},traits:[],climate:'continental',habMod:0,foe:[],perks:[],perkSlots:8,notes:''};
try{const x=JSON.parse(localStorage.getItem('stel_state')||'null');if(x)S=Object.assign(S,x);}catch(e){}
const save=()=>{try{localStorage.setItem('stel_state',JSON.stringify(S));}catch(e){}};
const diff=n=>'<span title="Difficulty" style="color:var(--acc)">'+'●'.repeat(n)+'<span class="dim">'+'●'.repeat(5-n)+'</span></span>';
const rate=r=>`<span class="tag ${r==='S'?'v':r==='A'?'w':r==='B'?'i':''}" title="Rough strength rating">${r}</span>`;

/* ================= PAGES ================= */
const PAGES=[['home','Home'],
 ['_'],['guides','Guides'],['origins','Origins'],['timeline','Galaxy timeline'],['glossary','Glossary'],
 ['_'],['builder','Empire builder'],['ethics','Ethics and authority'],['civics','Civics'],['traits','Species traits'],['habitability','Planets and habitability'],
 ['_'],['economy','Economy and jobs'],['tech','Technology'],['traditions','Traditions and ascension'],['leaders','Leaders and policies'],
 ['_'],['diplomacy','Diplomacy and federations'],['megas','Megastructures'],['threats','Threats and crises'],['exploration','Exploration and relics'],
 ['_'],['combat','Weapons and counters'],['ships','Ships and fleets'],['war','War and war goals'],
 ['_'],['dlc','DLC guide'],['campaign','Campaign and goals'],['log','Galactic log'],['console','Console commands'],['notes','My Notes']];
const GROUPS=['Learn','Your empire','Growing','The galaxy','War','Your game'];
function buildNav(cur){let gi=0;$('nav').innerHTML='<a class="home" href="/">&larr; Tavernworks</a><a class="home" href="/assistants/">&larr; All assistants</a><h1>STELLARIS<br>ASSISTANT</h1>'+PAGES.map(([id,n])=>id==='_'?`<div class="grp">${GROUPS[gi++]}</div>`:`<a href="#${id}" class="${cur===id?'on':''}">${n}</a>`).join('');}
const REAL=PAGES.filter(p=>p[0]!=='_');

const TILE={guides:'First game, the opening, economy, expansion, research, unity, fleets, defense, diplomacy, gestalts, MegaCorps, genocidal empires, crises, ascension, Ironman, mistakes',origins:'Every origin with difficulty, DLC and requirements',timeline:'What happens when, from 2200 to 2500',glossary:'Every Stellaris term in plain words',builder:'Pick ethics, authority, civics and origin, and see what\'s allowed',ethics:'The nine ethics and seven authorities',civics:'Every civic, filterable, with requirements and ratings',traits:'Every species trait and a trait-point builder',habitability:'Planet classes, special worlds and a habitability checker',economy:'Resources, strata, jobs and planet designations',tech:'Key technologies and rare techs',traditions:'Tradition trees, ascension paths and an ascension perk planner',leaders:'Leader classes, policies and edicts',diplomacy:'Opinion, trust, pacts, federations, subjects and the Galactic Community',megas:'Every megastructure with a build tracker',threats:'Leviathans, fallen empires and every crisis with counters',exploration:'Surveying, anomalies, archaeology and a relic tracker',combat:'Weapons, defenses and a fleet counter finder',ships:'Ship classes, combat computers and fleet compositions',war:'War goals, claims, war exhaustion and tips',dlc:'Every DLC and whether it\'s worth it',campaign:'Your current game and goals',log:'A log of your galaxy\'s history',console:'Commands, with copy buttons',notes:'Your own notes'};
function crisisPrep(){const ks=['cr1','cr2','cr3','cr4','cr5','cr6','cp1','cp2','cp3','cp4','cp5','cp6'];return Math.round(ks.filter(k=>S.checks[k]).length/ks.length*100);}
function pgHome(){
  const g=S.game,gd=S.goals.filter(x=>x.done).length,mb=Object.values(S.mega).filter(v=>v==='built').length;
  return `${TWArt.hero(281990,'Stellaris')}<h2>Stellaris Assistant</h2><p class="sub">A companion for <i>Stellaris</i>, from your first outpost to the endgame crisis. Your empire design, campaign, goals, galactic log, megastructures, relics and notes are saved on this device.</p>
<div class="stats"><div class="stat"><small>Empire</small>${g.empire?`<a class="mob" href="#campaign">${esc(g.empire)}</a>`:'<a class="mob" href="#campaign">Set up a game</a>'}</div><div class="stat"><small>Year</small><a class="mob big" href="#timeline">${esc(g.year||'—')}</a></div><div class="stat"><small>Goals done</small><a class="mob big" href="#campaign">${gd} / ${S.goals.length}</a></div><div class="stat"><small>Log entries</small><a class="mob big" href="#log">${S.log.length}</a></div><div class="stat"><small>Megastructures</small><a class="mob big" href="#megas">${mb} / ${MEGAS.length}</a></div><div class="stat"><small>Ascension perks</small><a class="mob big" href="#traditions">${S.perks.length} / ${S.perkSlots}</a></div><div class="stat"><small>Crisis prep</small><a class="mob big" href="#threats">${crisisPrep()}%</a></div></div>
${nextMilestone()}
<div class="grid">${REAL.slice(1).map(([id,n])=>`<div class="tile" onclick="location.hash='${id}'"><b>${n}</b><div class="dim">${TILE[id]}</div></div>`).join('')}</div>
<div class="note">Facts marked <span class="conf">●</span> are long-standing mechanics from the Stellaris wiki, Paradox's dev diaries or several guides that agree. Facts marked <span class="unv">○</span> are exact numbers that moved between patches, DLC details, or come from one source. Written against the 4.x versions (2025 and 2026); 4.0 reworked pops, jobs and trade, so older guides' numbers are often wrong. Stellaris explains almost every number in a tooltip: trust what you see in-game first.</div>`;}
function nextMilestone(){const y=+S.game.year;if(!y)return '';const n=TIMELINE.find(t=>t.y>y);return n?`<div class="tip"><b>Next milestone:</b> ${n.y} (${n.y-y} years away): <b>${esc(n.n)}</b>. ${esc(n.d)} <a href="#timeline">Timeline</a></div>`:'';}

function pgGuides(sub){
  if(sub){const g=GUIDES.find(x=>x.id===sub);if(g){const i=GUIDES.indexOf(g);return `<p><a href="#guides">&larr; All guides</a></p><h2>${g.title}</h2><div class="card">${g.body}</div><div class="row">${i?`<a class="mob" href="#guides/${GUIDES[i-1].id}">&larr; ${GUIDES[i-1].title}</a>`:''}<span style="flex:1"></span>${GUIDES[i+1]?`<a class="mob" href="#guides/${GUIDES[i+1].id}">${GUIDES[i+1].title} &rarr;</a>`:''}</div>`;}}
  return `<h2>Guides</h2><p class="sub">From your first outpost to the endgame crisis. Checkboxes are saved on this device.</p><div class="grid">${GUIDES.map(g=>`<div class="tile" onclick="location.hash='guides/${g.id}'"><b>${g.title}</b><div class="dim">${g.blurb}</div></div>`).join('')}</div>`;
}

/* ================= ORIGINS ================= */
let orD=0,orQ='';
function originReq(o){const c=o.chk,r=[];if(c.gestalt==='no')r.push('Not gestalt');if(c.gestalt==='hive')r.push('Hive Mind');if(c.gestalt==='mac')r.push('Machine Intelligence');if(c.gestalt==='notmac')r.push('Not Machine');(c.req||[]).forEach(e=>r.push(ethLabel(e)));(c.ban||[]).forEach(e=>r.push('Not '+ethLabel(e)));if(c.auth)r.push(c.auth.map(a=>AUTH.find(x=>x.id===a).n).join(' or '));return r.join(', ')||'Anyone';}
function ethLabel(e){return e.split('|').map(x=>x[0]==='f'&&ETHN[x.slice(1)]?'Fanatic '+ETHN[x.slice(1)]:ETHN[x]||x).join(' or ');}
function pgOrigins(){return `<h2>Origins</h2><p class="sub">Your origin is your empire's backstory, and it shapes the first decades a lot. Prosperous Unification is the safe choice; the rest trade safety for a story or a twist.</p>
<div class="chips" id="ord">${[0,1,2,3,4].map(d=>`<button data-d="${d}" class="${orD===d?'on':''}">${d?'Difficulty '+d:'Any difficulty'}</button>`).join('')}</div>
<div class="row"><input type="search" id="orq" placeholder="Search origins or DLC" style="width:240px" value="${esc(orQ)}"></div>
<div class="card tbl"><table id="ort"></table></div>
<div class="note">Requirements and difficulty are a rough guide ○. Some origins need a specific species type (Lithoid, Aquatic, Toxoid). The empire creator greys out anything you can't pick and says why.</div>`;}
function originsWire(){const draw=()=>{const q=orQ.toLowerCase(),r=ORIGINS.filter(o=>(!orD||o.d===orD)&&(!q||(o.n+' '+o.dlc+' '+o.eff).toLowerCase().includes(q)));
  $('ort').innerHTML='<tr><th>Origin</th><th>Difficulty</th><th>What it does</th><th>Needs</th><th>DLC</th></tr>'+(r.map(o=>`<tr><td>${mark(o.conf)} <b>${esc(o.n)}</b></td><td>${diff(o.d)}</td><td>${esc(o.eff)}<div class="dim">${esc(o.tip)}</div></td><td class="dim">${esc(originReq(o))}</td><td>${o.dlc?`<span class="tag g">${esc(o.dlc)}</span>`:'<span class="dim">Base game</span>'}</td></tr>`).join('')||'<tr><td colspan="5" class="dim">Nothing matches.</td></tr>');};
  document.querySelectorAll('#ord button').forEach(b=>b.onclick=()=>{orD=+b.dataset.d;document.querySelectorAll('#ord button').forEach(x=>x.classList.toggle('on',x===b));draw();});
  $('orq').oninput=e=>{orQ=e.target.value;draw();};draw();}

/* ================= TIMELINE ================= */
function pgTimeline(){const y=+S.game.year||0;let nowDone=false;
  return `<h2>Galaxy timeline</h2><p class="sub">What usually happens when, with default settings. Mid-game, end-game and victory years can all be changed when you set up a galaxy.</p>
<div class="card"><div class="row"><label>Current year <input type="number" id="ty" value="${esc(S.game.year)}" style="width:100px"></label><span class="dim">Saved with your campaign.</span></div></div>
<div class="timeline">${TIMELINE.map(t=>{let cls='';if(y){if(t.y<=y)cls='past';else if(!nowDone){cls='now';nowDone=true;}}return `<div class="ev ${cls}"><span class="yr">${t.y}</span> ${mark(t.conf)} <b>${esc(t.n)}</b>${cls==='now'?' <span class="tag g">next</span>':''}<div class="dim">${esc(t.d)}</div></div>`;}).join('')}</div>
<div class="note">Crises and fallen empire awakenings can fire later than the listed year (they have a chance each year after it), or not at all if you turn them off.</div>`;}
function timelineWire(){$('ty').onchange=e=>{S.game.year=e.target.value;save();route(true);};}

let glQ='';
function pgGlossary(){return `<h2>Glossary</h2><p class="sub">Stellaris has a lot of words. Here's what they mean.</p><div class="row"><input type="search" id="gq" placeholder="Search terms" style="width:240px" value="${esc(glQ)}"></div><div class="card tbl" style="margin-top:8px"><table id="gt"></table></div>`;}
function glossWire(){const draw=()=>{const q=glQ.toLowerCase();const r=GLOSS.filter(g=>!q||(g[0]+' '+g[1]).toLowerCase().includes(q));$('gt').innerHTML=r.map(g=>`<tr><td style="width:190px"><b>${esc(g[0])}</b></td><td>${esc(g[1])}</td></tr>`).join('')||'<tr><td class="dim">Nothing matches.</td></tr>';};$('gq').oninput=e=>{glQ=e.target.value;draw();};draw();}

/* ================= EMPIRE BUILDER ================= */
const B=()=>S.build;
const has=e=>(B().eth[e]||0)>0, fan=e=>B().eth[e]===2;
const ethOk=cond=>cond.split('|').some(x=>x[0]==='f'&&ETHN[x.slice(1)]?fan(x.slice(1)):has(x));
const ethBanned=b=>b[0]==='f'&&ETHN[b.slice(1)]?fan(b.slice(1)):has(b);
const ethPts=()=>Object.entries(B().eth).reduce((s,[k,v])=>s+(k==='ges'?(v?3:0):v),0);
const authGroup=a=>a==='hive'?'hive':a==='mac'?'mac':a==='cor'?'cor':a?'reg':'';
function authProblems(a){const A=AUTH.find(x=>x.id===a);if(!A)return [];const p=[];
  if(has('ges')&&!A.gestalt)p.push(A.n+' needs a non-gestalt empire');
  if(!has('ges')&&A.gestalt)p.push(A.n+' needs Gestalt Consciousness');
  A.ban.forEach(b=>{if(ethBanned(b))p.push(A.n+' can\'t be '+ethLabel(b));});return p;}
function civicProblems(c){const p=[],a=B().auth,g=authGroup(a);
  if(g&&c.a!==g&&!(g==='cor'&&c.a==='reg'))p.push(c.a==='hive'?'Hive Mind only':c.a==='mac'?'Machine Intelligence only':c.a==='cor'?'Corporate only':'Not for gestalts');
  if(c.auth&&a&&!c.auth.includes(a))p.push('Needs '+c.auth.map(x=>AUTH.find(y=>y.id===x).n).join(' or '));
  (c.req||[]).forEach(r=>{if(!ethOk(r))p.push('Needs '+ethLabel(r));});
  (c.ban||[]).forEach(b=>{if(ethBanned(b))p.push('Can\'t be '+ethLabel(b));});
  (c.x||[]).forEach(x=>{if(B().civ.includes(x)&&x!==c.key)p.push('Not with '+x);});
  return p;}
function originProblems(o){const c=o.chk,p=[],a=B().auth;
  if(c.gestalt==='no'&&has('ges'))p.push('Not for gestalts');
  if(c.gestalt==='hive'&&a!=='hive')p.push('Hive Mind only');
  if(c.gestalt==='mac'&&a!=='mac')p.push('Machine Intelligence only');
  if(c.gestalt==='notmac'&&a==='mac')p.push('Not for machines');
  (c.req||[]).forEach(r=>{if(!ethOk(r))p.push('Needs '+ethLabel(r));});

function buildVerdict(){const b=B(),err=[],warn=[],pts=ethPts();
  if(has('ges')){if(Object.keys(b.eth).some(k=>k!=='ges'&&b.eth[k]))err.push('Gestalt Consciousness takes all three ethic points: drop the others.');}
  else if(pts<3)err.push(`Use all three ethic points (${pts} of 3 used). A fanatic ethic costs 2.`);
  else if(pts>3)err.push(`Too many ethic points (${pts} of 3).`);
  ETHICS.forEach(e=>{if(e.opp&&has(e.id)&&has(e.opp)&&e.id<e.opp)err.push(`${e.n} and ${ETHN[e.opp]} are opposites.`);});
  if(!b.auth)err.push('Pick an authority.');else err.push(...authProblems(b.auth));
  const civs=b.civ.map(k=>CIVICS.find(c=>c.key===k)).filter(Boolean);
  civs.forEach(c=>{const p=civicProblems(c);if(p.length)err.push(`${c.n}: ${p.join('; ')}.`);if(b.auth==='cor'&&c.a==='reg')warn.push(`${c.n}: MegaCorps can take some regular civics but not all ○. Check in the empire creator.`);});
  if(civs.length<2)warn.push(`You start with two civic slots (${civs.length} picked).`);
  if(civs.length>2)err.push(`Only two civics at the start (${civs.length} picked). More slots unlock later ○.`);
  if(!b.origin)warn.push('Pick an origin (Prosperous Unification if unsure).');
  else{const o=ORIGINS.find(x=>x.n===b.origin);if(o){const p=originProblems(o);if(p.length)err.push(`${o.n}: ${p.join('; ')}.`);if(o.dlc)warn.push(`${o.n} needs ${o.dlc}.`);}}
  civs.forEach(c=>{if(c.dlc)warn.push(`${c.n} needs ${c.dlc}.`);});
  const A=AUTH.find(x=>x.id===b.auth);if(A&&A.dlc)warn.push(`${A.n} needs ${A.dlc}.`);
  return {err,warn};}

function pgEconomy(){return `<h2>Economy and jobs</h2><p class="sub">Pops work jobs; jobs make resources; districts and buildings create jobs. Basic resources (energy, minerals, food) feed advanced ones (alloys, consumer goods), which build fleets and keep specialists happy.</p>

function perkWarnings(){const w=[],P=S.perks,paths=P.filter(n=>PERK_PATHS.includes(n));

  if(paths.length&&P.indexOf(paths[0])>3)w.push('Ascension paths take decades to pay off. Take yours earlier (second to fourth slot).');
  if(!paths.length&&P.length>=3)w.push('No ascension path yet. Most strong builds take one by the third or fourth perk.');
  ['Galactic Wonders','Master Builders','Arcology Project','Colossus Project','Defender of the Galaxy','Become the Crisis','Galactic Contender'].forEach(n=>{const i=P.indexOf(n);if(i>-1&&i<2)w.push(n+' in slot '+(i+1)+' is very early: its payoff (or its unlock) comes mid to late game.');});
  if(P.includes('Become the Crisis')&&has('pac'))w.push('Become the Crisis can\'t be taken by Pacifists (your Empire builder has Pacifist).');
  if(P.includes('Universal Transactions')&&B().auth&&B().auth!=='cor')w.push('Universal Transactions is for MegaCorps.');
  if(P.length>S.perkSlots)w.push(`You've planned ${P.length} perks but have ${S.perkSlots} slots.`);
  return w;}

function combatWire(){const draw=()=>{const foes=S.foe.map(id=>FOE.find(f=>f.id===id)).filter(Boolean);if(!foes.length){$('foeout').innerHTML='';return;}

  const best=WEAPONS.filter(w=>sc[w.id]>0).sort((a,b)=>sc[b.id]-sc[a.id]),bad=WEAPONS.filter(w=>sc[w.id]<0);
  $('foeout').innerHTML=`<p style="margin:8px 0 4px"><b>Weapons:</b> ${best.map(w=>`<span class="tag w">${w.n}</span>`).join('')||'<span class="dim">no clear counter: a balanced mix and more tech</span>'}</p>

  document.querySelectorAll('#foe button').forEach(b=>b.onclick=()=>{const id=b.dataset.foe;S.foe=S.foe.includes(id)?S.foe.filter(x=>x!==id):S.foe.concat(id);b.classList.toggle('on');save();draw();});

<h3>Before you declare</h3><div class="card">
${ck('w1','Claims on the systems you want (influence).')}
${ck('w2','Your fleet power beats theirs plus their allies and defensive pacts.')}
${ck('w3','Armies: 2 or 3 assault armies per planet you want to invade.')}
${ck('w4','Alloys stockpiled to rebuild losses.')}
${ck('w5','Your own chokepoints are defended.')}
${ck('w6','You checked the enemy fleet in the <a href="#combat">counter finder</a> and refit.')}</div>`;}

/* ================= YOUR GAME ================= */
function pgDlc(){const rk={Essential:'v',Great:'w',Good:'i',Okay:'',Cosmetic:''};
  return `<h2>DLC guide</h2><p class="sub">What each piece adds and whether it's worth it. Free patches come with every DLC release, so the base game keeps growing too.</p>
<div class="card tbl"><table><tr><th>DLC</th><th>Year</th><th>Verdict</th><th>What it adds</th></tr>${DLC.map(d=>`<tr><td>${mark(d.conf)} <b>${esc(d.n)}</b></td><td class="dim">${d.y}</td><td><span class="tag ${rk[d.r]}">${d.r}</span></td><td>${esc(d.eff)}</td></tr>`).join('')}</table></div>
<div class="tip"><b>If you buy only three:</b> Utopia, Federations and Overlord. Then MegaCorp, Apocalypse, Nemesis and Galactic Paragons. The subscription (Expansion Subscription) is a cheap way to try them all.</div>
<div class="note">Newer packs and story packs may be missing or described from early information ○. The store page is the final word.</div>`;}

const GOALSUG=['Claim every chokepoint near my capital','Five colonies by 2230','First ascension perk','Pick an ascension path','Found a federation','Build a Science Nexus','Build a Dyson Sphere','Build a Ring World','Kill a leviathan','Get the Galatron','Become Galactic Custodian','Beat the endgame crisis','Restore an Imperium','Reach 2500 alive'];
function pgCampaign(){const g=S.game,done=S.goals.filter(x=>x.done).length;
  return `<h2>Campaign and goals</h2><p class="sub">Keep track of your current game and what you're aiming for.</p>
<div class="card"><div class="row"><label>Empire <input type="text" id="ge" value="${esc(g.empire)}" style="width:200px" placeholder="e.g. United Nations of Earth"></label>
<label>Species <input type="text" id="gsp" value="${esc(g.species)}" style="width:140px" placeholder="e.g. Human"></label>
<label>Origin <select id="go"><option value=""></option>${ORIGINS.map(o=>`<option${g.origin===o.n?' selected':''}>${esc(o.n)}</option>`).join('')}</select></label></div>
<div class="row"><label>Year <input type="number" id="gy" value="${esc(g.year)}" style="width:90px"></label>
<label>Difficulty <select id="gd">${['','Ensign','Captain','Commodore','Admiral','Grand Admiral'].map(d=>`<option${g.diff===d?' selected':''}>${d}</option>`).join('')}</select></label>
<label>Galaxy <select id="gz">${['','Tiny','Small','Medium','Large','Huge'].map(d=>`<option${g.size===d?' selected':''}>${d}</option>`).join('')}</select></label>
<label class="chk" style="margin:0"><input type="checkbox" id="gi"${g.iron?' checked':''}> Ironman</label></div>
${S.build.auth?`<div class="dim" style="margin-top:6px">Empire design: ${Object.entries(S.build.eth).filter(([,v])=>v).map(([k,v])=>(v===2?'Fanatic ':'')+ETHN[k]).join(', ')} · ${AUTH.find(a=>a.id===S.build.auth).n} · ${S.build.civ.map(esc).join(', ')||'no civics'} <a href="#builder">edit</a></div>`:''}</div>
${nextMilestone()}
<h3>Goals</h3><div class="dim">${done} of ${S.goals.length} done</div><div class="bar"><i style="width:${S.goals.length?done/S.goals.length*100:0}%"></i></div>
<div class="card"><form class="row" id="gf"><input type="text" id="gn" style="width:300px" placeholder="A goal, e.g. Take the Sol chokepoint"><button class="pri">Add</button></form>
<div class="chips">${GOALSUG.map((s,i)=>`<button type="button" data-gsug="${i}">+ ${esc(s)}</button>`).join('')}</div>
${S.goals.map((x,i)=>`<div class="row"><label class="chk" style="flex:1;margin:0"><input type="checkbox" data-gdone="${i}"${x.done?' checked':''}> <span class="${x.done?'dim':''}">${esc(x.n)}</span></label><button data-gdel="${i}" title="Remove">✕</button></div>`).join('')||'<div class="dim">No goals yet.</div>'}</div>
${S.goals.length?'<button id="gclear">Remove finished goals</button>':''}`;}
function campWire(){const g=S.game;
  $('ge').oninput=e=>{g.empire=e.target.value;save();};$('gsp').oninput=e=>{g.species=e.target.value;save();};$('go').onchange=e=>{g.origin=e.target.value;save();};
  $('gy').onchange=e=>{g.year=e.target.value;save();route(true);};$('gd').onchange=e=>{g.diff=e.target.value;save();};$('gz').onchange=e=>{g.size=e.target.value;save();};$('gi').onchange=e=>{g.iron=e.target.checked;save();};
  $('gf').onsubmit=e=>{e.preventDefault();const n=$('gn').value.trim();if(!n)return;S.goals.push({n,done:false});save();route(true);};
  document.querySelectorAll('[data-gsug]').forEach(b=>b.onclick=()=>{S.goals.push({n:GOALSUG[+b.dataset.gsug],done:false});save();route(true);});
  document.querySelectorAll('[data-gdone]').forEach(c=>c.onchange=()=>{S.goals[+c.dataset.gdone].done=c.checked;save();route(true);});
  document.querySelectorAll('[data-gdel]').forEach(b=>b.onclick=()=>{S.goals.splice(+b.dataset.gdel,1);save();route(true);});
  if($('gclear'))$('gclear').onclick=()=>{S.goals=S.goals.filter(x=>!x.done);save();route(true);};}

const LOGK=[['contact','📡 First contact'],['colony','🌍 Colony'],['war','⚔️ War'],['peace','🕊️ Peace'],['tech','🔬 Breakthrough'],['ascend','✨ Ascension'],['mega','🏗️ Megastructure'],['crisis','☄️ Crisis'],['other','📜 Other']];
let lgF='';
function pgLog(){const L=S.log.map((e,i)=>Object.assign({i},e)).filter(e=>!lgF||e.k===lgF).sort((a,b)=>(+a.y||0)-(+b.y||0));
  return `<h2>Galactic log</h2><p class="sub">The history of your galaxy as you play it: first contacts, wars, colonies, ascensions and crises.</p>
<div class="card"><form class="row" id="lf"><input type="number" id="ly" style="width:90px" placeholder="Year" value="${esc(S.game.year)}"><select id="lk">${LOGK.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select><input type="text" id="lt" style="width:340px" placeholder="What happened, e.g. Met the Blorg Commonality"><button class="pri">Add</button></form></div>
<div class="chips" id="lgf"><button data-lf="" class="${lgF?'':'on'}">All (${S.log.length})</button>${LOGK.map(([k,n])=>{const c=S.log.filter(e=>e.k===k).length;return c?`<button data-lf="${k}" class="${lgF===k?'on':''}">${n} (${c})</button>`:'';}).join('')}</div>
<div class="card tbl"><table><tr><th>Year</th><th>Type</th><th>Entry</th><th></th></tr>${L.map(e=>`<tr><td><input type="number" data-le="${e.i}:y" value="${esc(e.y)}" style="width:80px"></td><td>${(LOGK.find(k=>k[0]===e.k)||LOGK[8])[1]}</td><td><input type="text" data-le="${e.i}:t" value="${esc(e.t)}" style="width:100%;min-width:220px"></td><td><button data-ldel="${e.i}" title="Remove">✕</button></td></tr>`).join('')||'<tr><td colspan="4" class="dim">Nothing logged yet. Start with your first contact.</td></tr>'}</table></div>`;}
function logWire(){
  $('lf').onsubmit=e=>{e.preventDefault();const t=$('lt').value.trim();if(!t)return;S.log.push({y:$('ly').value,k:$('lk').value,t});save();route(true);};
  document.querySelectorAll('[data-lf]').forEach(b=>b.onclick=()=>{lgF=b.dataset.lf;route(true);});
  document.querySelectorAll('[data-le]').forEach(i=>i.onchange=()=>{const [ix,k]=i.dataset.le.split(':');S.log[+ix][k]=i.value;save();});
  document.querySelectorAll('[data-ldel]').forEach(b=>b.onclick=()=>{if(confirm('Remove this entry?')){S.log.splice(+b.dataset.ldel,1);save();route(true);}});}

function pgConsole(){return `<h2>Console commands</h2><p class="sub">For testing, fixing a broken save, or just having fun. Not available in Ironman, and they turn off achievements for that game.</p>
<div class="card"><ol class="mech"><li>Load a non-Ironman game.</li><li>Press <kbd>\`</kbd> or <kbd>~</kbd> (the key under Esc; on some keyboards <kbd>Alt</kbd>+<kbd>2</kbd>+<kbd>1</kbd> or <kbd>Shift</kbd>+<kbd>3</kbd>) to open the console. No launch option needed.</li><li>Type <code>help</code> for every command in your version.</li><li><code>debugtooltip</code> shows planet, empire and fleet IDs in tooltips: you need them for commands that take an ID.</li></ol></div>
<div class="card tbl"><table><tr><th>Command</th><th>What it does</th><th></th></tr>${CONSOLE.map(c=>`<tr><td>${mark(c[2])} <code>${esc(c[0])}</code></td><td>${esc(c[1])}</td><td><button data-copy="${esc(c[0])}" title="Copy">Copy</button></td></tr>`).join('')}</table></div>
<div class="note">Command names change now and then. If one doesn't work, <code>help</code> lists the current ones.</div>`;}
function consoleWire(){document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{try{navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200);}catch(e){}});}

function pgNotes(){return `<h2>My Notes</h2><p class="sub">Saved automatically on this device.</p><textarea id="nt" style="width:100%;height:60vh" placeholder="Which neighbour to befriend, the chokepoint to fortify, the design that beat the Prethoryn, when the end-game year is...">${esc(S.notes)}</textarea>`;}

/* ================= ROUTER ================= */
const RENDER={home:pgHome,guides:null,origins:pgOrigins,timeline:pgTimeline,glossary:pgGlossary,builder:pgBuilder,ethics:pgEthics,civics:pgCivics,traits:pgTraits,habitability:pgHabitability,economy:pgEconomy,tech:pgTech,traditions:pgTraditions,leaders:pgLeaders,diplomacy:pgDiplomacy,megas:pgMegas,threats:pgThreats,exploration:pgExploration,combat:pgCombat,ships:pgShips,war:pgWar,dlc:pgDlc,campaign:pgCampaign,log:pgLog,console:pgConsole,notes:pgNotes};
const WIRE={origins:originsWire,timeline:timelineWire,glossary:glossWire,builder:builderWire,civics:civicsWire,traits:traitsWire,habitability:habWire,tech:techWire,traditions:tradWire,megas:megaWire,threats:threatsWire,exploration:explWire,combat:combatWire,campaign:campWire,log:logWire,console:consoleWire,notes:()=>{$('nt').oninput=e=>{S.notes=e.target.value;save();};}};
function route(keepScroll){
  const [pg,sub]=(location.hash.slice(1)||'home').split('/');
  const page=REAL.some(p=>p[0]===pg)?pg:'home';
  buildNav(page);
  const m=$('main'),top=m.scrollTop;
  m.innerHTML=page==='guides'?pgGuides(sub):RENDER[page]();
  m.scrollTop=keepScroll===true?top:0;
  m.querySelectorAll('input[type=checkbox][data-k]').forEach(cb=>{cb.checked=!!S.checks[cb.dataset.k];cb.onchange=()=>{S.checks[cb.dataset.k]=cb.checked;save();if(page==='threats')route(true);};});
  if(WIRE[page])WIRE[page]();
}
window.addEventListener('hashchange',()=>route());
route();
</script>
</body>
</html>
