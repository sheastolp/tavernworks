<meta name="description" content="Aion 2 Assistant for the global PC version: daily and weekly checklists that reset themselves, Odyle Energy, Nightmare, Conquest and Transcendence counters, an Abyss hour stopwatch, Artifact Siege and Abyss boss countdowns, field boss respawn timers, maps with your own pins for items, enemies and pet farms, every area of Verteron and Altgard, a pet soul tracker for all 205 pets, monster kills, several characters and servers, an item level planner, enhancement, Arcana, Stigma and Daevanion trackers, plus classes, dungeons, unlocks, the Abyss and guides. Runs in your browser.">

<style>
:root{--bg:#0b0e16;--panel:#121725;--panel2:#1a2133;--line:#2a3450;--tx:#e8ecf6;--dim:#97a1bb;--acc:#e8c066;--acc-ink:#221800;--acc2:#7cc4f0;--ok:#86d39a;--warn:#f2c14e;--err:#ff7a6b}
body.asmo{--bg:#100b14;--panel:#1a1220;--panel2:#24192d;--line:#3b2948;--acc:#c79bf2;--acc-ink:#1d0b2b;--acc2:#f08aa0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
#app{display:flex;height:100vh}
#nav{width:220px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
#nav h1{font-size:15px;margin:4px 8px 8px;color:var(--acc);letter-spacing:.5px}
#nav a{display:block;padding:7px 10px;margin:2px 0;border-radius:6px;color:var(--tx);text-decoration:none;cursor:pointer}
#nav a:hover{background:var(--panel2)}
#nav a.home{color:var(--dim);font-size:13px}
#nav a.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
#nav .grp{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:12px 10px 2px}
#nav .who{margin:0 6px 8px;width:calc(100% - 12px)}
#main{flex:1;overflow:auto;padding:20px 24px}
h2{margin:0 0 4px;font-size:22px}
h3{margin:18px 0 6px;color:var(--acc2);font-size:16px}
p.sub{color:var(--dim);margin:0 0 16px}
a{color:var(--acc2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.tile:hover{border-color:var(--acc)}
.tile b{color:var(--acc)}
@media(max-width:760px){#app{flex-direction:column;height:auto;min-height:100vh}#nav{width:auto;display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}#nav h1,#nav .who{width:100%}#nav .grp{display:none}#main{padding:16px}}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.sm{padding:2px 8px;font-size:12px}
input,select,textarea{background:#07090f;border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
input[type=text],input[type=number],input[type=search]{width:130px}
input[type=checkbox]{width:auto}
table{border-collapse:collapse;width:100%}
td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.lock td{opacity:.55}
.tbl{overflow-x:auto}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--panel2);color:var(--dim);margin:0 4px 2px 0}
.tag.g{background:#18281a;color:#a6dc94}.tag.r{background:#2b1418;color:#ff9b9b}.tag.b{background:#14232c;color:#9cc9dc}.tag.y{background:#2c2614;color:#f0d283}
.note{border-left:3px solid var(--warn);background:#221f10;padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;color:#eadca6}
.tip{border-left:3px solid var(--acc);background:var(--panel2);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.ok{color:var(--ok)}.bad{color:var(--err)}.dim{color:var(--dim)}.wn{color:var(--warn)}
label.chk{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.conf{color:var(--ok)}.unv{color:var(--warn)}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:4px 0 6px}
.bar i{display:block;height:100%;background:var(--acc)}
.bar i.full{background:var(--err)}
a.mob{font-weight:600;color:var(--acc);text-decoration:none;cursor:pointer}
a.mob:hover{text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:10px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat small{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.big{font:600 20px/1.2 Consolas,"Cascadia Mono",monospace}
.mono{font-family:Consolas,"Cascadia Mono",monospace;font-variant-numeric:tabular-nums}
.mech li{margin:4px 0}
.ctr{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ctr .card{margin:0}
.ctr .v{font:600 24px/1.1 Consolas,"Cascadia Mono",monospace;color:var(--acc)}
.ctr .v small{font-size:13px;color:var(--dim)}
.timer{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.timer .t{font:600 22px/1.1 Consolas,"Cascadia Mono",monospace}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{border-radius:999px;padding:3px 11px;font-size:13px}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.sc{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.alert{border-left:3px solid var(--err);background:#2a1414;padding:8px 12px;border-radius:0 6px 6px 0;margin:6px 0}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.slot b{display:block;margin-bottom:4px}
.num{width:64px!important}
.ch{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.ch.on{border-color:var(--acc)}
.mapbox{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;align-items:start}
@media(max-width:1000px){.mapbox{grid-template-columns:minmax(0,1fr)}}
.mwrap{position:relative}
.mw{position:relative;overflow:hidden;height:72vh;min-height:340px;background:var(--panel);border:1px solid var(--line);border-radius:10px;touch-action:none;cursor:crosshair;user-select:none}
.mw.drag{cursor:grabbing}
.mi{position:absolute;left:0;top:0;transform-origin:0 0}
.mi img{display:block;width:100%;height:100%;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-100%) scale(var(--iz,1));transform-origin:50% 100%;font-size:22px;line-height:1;cursor:pointer;filter:drop-shadow(0 1px 2px #000)}
.pin.done{opacity:.4}.pin.sel{font-size:30px;filter:drop-shadow(0 0 5px var(--acc))}
.pin.wait::after{content:'⏳';font-size:11px;position:absolute;right:-9px;top:-4px}
.mctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.mctl button{width:34px;padding:4px 0;background:var(--panel)}
.mhint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--acc);color:var(--acc-ink);border-radius:6px;padding:4px 10px;font-weight:600}
.mside .card{margin-bottom:10px}
.mside .chips button{font-size:12px;padding:2px 9px}
.plist{max-height:340px;overflow:auto;margin-top:6px}
.pl{display:flex;justify-content:space-between;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;border-bottom:1px solid var(--line)}
.pl:hover,.pl.on{background:var(--panel2)}

const GUIDES=[
{id:'start',title:'Starting out',blurb:'Faction, class, server and your first hours',body:`<p>Aion 2 is a free-to-play MMORPG set about 200 years after the first Aion. You pick the <b>Elyos</b> (start in Poeta, then Verteron) or the <b>Asmodians</b> (Ishalgen, then Altgard). Each server holds one faction, and you meet the other side in the Abyss.</p>
<ul class="mech"><li><b>Pick your server region with care.</b> Europe, NA East, NA West, South America or Asia. You get one free transfer per account, within the same faction, region and launch wave.</li>
<li><b>Easiest classes:</b> Templar (tank) and Cleric (healer) are the most forgiving and always find groups. Gladiator is the easiest damage class. Assassin is the hardest.</li>
<li><b>Server-wide limits:</b> the Daily Dungeon (14 a week), Duty Missions (5 a day) and some Odyle crafts are shared by every character on the server, so alts don't multiply them.</li>
<li>Global is PC only. The PvP flag is on from the start, and direct player trades are off.</li></ul>
<div class="tip">Use the character switcher in the sidebar: everything you track here is per character, and the server-wide counters follow the server name you give each one.</div>`},
{id:'level',title:'Levelling to 45',blurb:'The story route and what to collect on the way',body:`<ol class="mech"><li><b>Follow the main story.</b> It gates class advancement, wings and most systems.</li>
<li><b>Unlock wings</b> the moment the story offers them ("The Power in the Lake" / "The Being Beneath the Lake"). Flight changes how fast you move around.</li>
<li><b>Clear Sealed Dungeons on your route</b> for one-time Daevanion Crystals, Wisdom Stones and Enhancement Stones. Don't detour for all 161.</li>
<li><b>Grab Hidden Cubes and Empyrean Traces as you pass.</b> Traces give permanent stats through the Monolith.</li>
<li><b>Don't enhance levelling gear.</b> Everything before 45 is replaced. The level 45 story weapon, Guard and Bracelet are the first safe targets.</li>
<li>Krao Cave (40 to 45) closes the levelling story for both factions.</li></ol>
<p>See <a href="#unlocks">Unlocks</a> for what each level opens.</p>`},
{id:'at45',title:'You hit 45: what first',blurb:'The order to open the endgame',body:`<ol class="mech"><li>Do the 45 story and enhance the story weapon, Guard and Bracelet to +4.</li>
<li>Fill every manastone slot and spend every Daevanion Crystal: both are free item level.</li>
<li>Run <b>Draupnir</b> at 700, and use your <b>Nightmare</b> attempts every day; only clears count.</li>
<li>At <b>1,000</b> open the Abyss (Lower Reshanta) and start Ascension Trial Easy.</li>
<li>Push to <b>1,600</b> for Transcendence, your Arcana source. Run both Transcendence dungeons to fill all five slots.</li>
<li>From here it's the daily and weekly loop on the <a href="#tracker">Tracker</a>.</li></ol>`},
{id:'ilvl',title:'Gearing and item level',blurb:'Where item level comes from, cheapest first',body:`<ul class="mech"><li><b>Daevanion Crystals:</b> about +1 each. From Sealed Dungeons, regional quests, the Shugo Festival, Nightmare fragments and Abyss Points (Azphel crystals).</li>
<li><b>Manastones:</b> +1 to +4 each. Fill every slot.</li>
<li><b>Enhancement:</b> +1 per level per piece. Spread it: six pieces at +8 beat one at +15 and the rest at +2. Take everything to +4, then +6 to +8, and save +10 and up for gear you'll keep.</li>
<li><b>Arcana:</b> 20 (Common) to 80 (Unique) per slot, five slots.</li>
<li><b>Better gear grades</b> carry more base item level. A Vakron Guard (Unique) comes from two Gear Change Vouchers plus Kinah through Substance Morph ○.</li>
<li><b>Belt</b> upgrades from Stronghold materials; the <b>Amulet</b> through the Monolith.</li></ul>
<p>The <a href="#planner">Item level planner</a> shows what's next and where your easiest points are.</p>`},
{id:'loop',title:'An efficient daily and weekly loop',blurb:'What to do each day, and what to finish before Wednesday',body:`<p><b>Every day (about 30 to 60 minutes):</b></p><ol class="mech"><li>Spend Odyle Energy on cubes before it caps at 560 (it fills in about 3 days from empty).</li><li>Five Duty Missions.</li><li>A Nightmare clear if you can beat a new tier.</li><li>Two Daily Dungeon runs.</li><li>Event keys and a Spacetime Rift.</li></ol>
<p><b>Before the Wednesday reset:</b> Ascension Trial (3), Subjugation (3), Sanctuary, Exploration rewards, Battlefield wins, Abyss hours, Odyle crafts and Season Mission points. Nightmare, Conquest and Transcendence counters bank for about a week, so missing a day isn't a loss; the weekly ones don't bank.</p>
<div class="note">Guides agree the reset is on Wednesday, but not on the hour. Hover any counter in-game for the countdown and set the matching hour in <a href="#settings">Settings</a>.</div>`},
{id:'abyss',title:'The Abyss and Artifact Siege',blurb:'Reshanta, Abyss Points, sieges and bosses',body:`<ul class="mech"><li>Opens at level 45. Lower Reshanta at item level 1,000, Middle at 3,000. Upper isn't open on global.</li>
<li>You get <b>7 hours a week</b> per layer, bankable to 7. Rift Stones add 1 hour (Lower/Middle). The <a href="#tracker">Tracker</a> has a stopwatch for each layer.</li>
<li><b>Abyss Points</b> buy Stigma Shards and Azphel crystals. There's a weekly cap; past it, Spacetime Rifts still trickle a few.</li>
<li><b>Artifact Siege:</b> Monday, Thursday and Saturday at 21:00 server time. Land the final strike on a Dimensional Core to take its artifact. Each held artifact boosts your faction's Abyss Points and opens an instanced farming area.</li>
<li><b>Bosses:</b> Nahma on Sunday and Friday at 21:00; the Executors (Lower) and Ducal, Marakha, Dramos (Middle) on Monday, Thursday and Saturday at 21:30. See <a href="#schedule">Schedule</a> for countdowns.</li></ul>`},
{id:'odyle',title:'Odyle Energy budgeting',blurb:'Never waste regen',body:`<p>Odyle Energy refills 15 every 3 hours (120 a day) to a cap of 560, even offline. A Conquest or Transcendence cube costs 40, Krao Cave and Urugugu Canyon cubes 20.</p><ul class="mech"><li>120 a day is three 40-cost cubes. If you log in once a day, open three and you'll never cap.</li><li>From empty it takes about 4 days and 16 hours to fill. From 400 it caps in about 33 hours, so don't leave a big stockpile over a long weekend.</li><li>Substance Morph can make extra Odyle Energy: 4 per character and 16 per server a week.</li></ul><p>The <a href="#tracker">Tracker</a> shows when you'll cap.</p>`},
{id:'stigma',title:'Stigma, Daevanion and Arcana',blurb:'The three skill-and-stat systems',body:`<ul class="mech"><li><b>Stigma:</b> extra skills you choose. Slots at 22, 27, 32 and 37 (four on global). Level them with Stigma Shards from the Abyss. Patches move Stigmas between damage and utility, so check notes after balance updates.</li>
<li><b>Daevanion:</b> five boards opening at 12, 20, 30, 40 and 45. Spend crystals from the centre outward on nodes for your role.</li>
<li><b>Arcana:</b> five slots. Each card has a fixed main stat and random sub stats; feed cards in to level them. Some form sets that only work complete.</li></ul>
<p>Track all three on <a href="#build">Build</a>.</p>`},
{id:'alts',title:'Alts and server-wide limits',blurb:'What multiplies with more characters and what doesn’t',body:`<table><tr><th>Per character (alts add more)</th><th>Shared by the server</th></tr><tr><td>Odyle Energy · Nightmare · Conquest · Transcendence · Ascension Trial · Subjugation · Sanctuary · Exploration · Abyss hours · 4 Odyle crafts</td><td>Daily Dungeon (14 a week) · Duty Missions (5 a day) · 16 Odyle crafts · 10 cube skips · Shugo and Dimensional Invasion keys</td></tr></table>
<p>Add each alt on <a href="#chars">Characters</a> with the same server name and the shared counters follow them.</p>`},
{id:'money',title:'Membership and the shop',blurb:'What’s paid and what isn’t',body:`<ul class="mech"><li>Aion 2 is free to play. Quna is the premium currency.</li><li>Membership is a subscription; every Founder's Pack includes 30 days. In Korea, the link between paid membership, currency and gameplay perks drew complaints.</li><li>NC says store cosmetics give no gameplay advantage.</li><li>Global has a limited Quna-to-Kinah exchange and no direct player trades.</li></ul><div class="note">Membership perks differ between Korea and global and have changed; read the in-game shop text before you buy.</div>`},
{id:'global',title:'Global vs Korea',blurb:'What global has, and what’s coming',body:`<table><tr><th></th><th>Global</th><th>Korea and Taiwan</th></tr>
<tr><td>Level cap</td><td>45</td><td>50 (since 1 July 2026)</td></tr><tr><td>Classes</td><td>8</td><td>9 (Brawler)</td></tr><tr><td>Regions</td><td>Verteron, Altgard</td><td>+ Eltnen, Morheim</td></tr><tr><td>Abyss</td><td>Lower, Middle</td><td>+ Upper</td></tr><tr><td>Group sizes</td><td>Party 5, Sanctuary 10, Force 20</td><td>Same since Chapter 1</td></tr></table>
<p>NC said global would get already-finished content based on data and feedback rather than on a fixed schedule. No dated global roadmap has been published.</p>`},
{id:'mistakes',title:'Common mistakes',blurb:'Things that cost new Daevas time',body:`<ul class="mech"><li>Enhancing levelling gear.</li><li>Letting Odyle Energy sit at 560.</li><li>Skipping Nightmare because you might wipe; only clears use an attempt.</li><li>Burning the Daily Dungeon's 14 shared entries on one alt early in the week.</li><li>Leaving weekly tickets until after Wednesday's reset; they don't carry over.</li><li>Pushing one piece to +15 instead of the whole set to +8.</li><li>Empty manastone slots.</li><li>Reading Korean-build guides as if everything applies to global.</li></ul>`}
];

/* ---- time zones: turn "Wednesday 07:00 in zone X" into a timestamp ---- */
function tzParts(tz,t){try{const p={};new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric',weekday:'short'}).formatToParts(new Date(t)).forEach(x=>p[x.type]=x.value);
  return {y:+p.year,mo:+p.month-1,d:+p.day,h:+p.hour%24,mi:+p.minute,s:+p.second,wd:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday)};}catch(e){return tzParts('UTC',t);}}
const tzOff=(tz,t)=>{const p=tzParts(tz,t);return Date.UTC(p.y,p.mo,p.d,p.h,p.mi,p.s)-Math.floor(t/1e3)*1e3;};
function zoned(tz,y,mo,d,h,mi){const g=Date.UTC(y,mo,d,h,mi);let t=g-tzOff(tz,g);return g-tzOff(tz,t);}
/* the next time at h:mi on one of the weekdays (null = any day) after t */
function nextAt(tz,days,h,mi,t){const p=tzParts(tz,t);for(let i=0;i<9;i++){const x=zoned(tz,p.y,p.mo,p.d+i,h,mi),w=tzParts(tz,x).wd;if(x>t&&(!days||days.includes(w)))return x;}return t+864e5;}
function prevAt(tz,days,h,mi,t){const p=tzParts(tz,t);for(let i=0;i<9;i++){const x=zoned(tz,p.y,p.mo,p.d-i,h,mi),w=tzParts(tz,x).wd;if(x<=t&&(!days||days.includes(w)))return x;}return t-864e5;}
const lastDaily=t=>prevAt(S.set.rTz,null,S.set.rHour,0,t);
const lastWeekly=t=>prevAt(S.set.rTz,[S.set.rDay],S.set.rHour,0,t);
const nextDaily=t=>nextAt(S.set.rTz,null,S.set.rHour,0,t);
const nextWeekly=t=>nextAt(S.set.rTz,[S.set.rDay],S.set.rHour,0,t);

/* ---- resets: clear daily and weekly use, bank Nightmare, roll the Abyss clock ---- */
function abyssUsed(a,now){return a.used+(a.run?now-a.run:0);}
function rollover(){const now=Date.now(),d=lastDaily(now),w=lastWeekly(now);let ch=false;
  for(const c of S.chars){
    if(c.dAt<d){const n=c.dAt?Math.max(1,Math.round((d-c.dAt)/864e5)):0;c.daily={};
      const nm=TRACK.find(t=>t.id==='nightmare');c.cnt.nightmare=Math.min(nm.cap,(c.cnt.nightmare==null?nm.gain:c.cnt.nightmare)+n*nm.gain);
      c.dAt=d;ch=true;}
    if(c.wAt<w){c.week={};for(const k in c.abyss){const a=c.abyss[k];a.used=0;if(a.run)a.run=w;}c.wAt=w;ch=true;}
  }
  for(const k in S.srv){const s=S.srv[k];if(s.dAt<d){s.daily={};s.dAt=d;ch=true;}if(s.wAt<w){s.week={};s.wAt=w;ch=true;}}
  if(ch)save();return ch;}

/* ---- counters ---- */
function regenNow(c,t,now){const r=c.regen[t.id];if(!r)return null;const ticks=Math.floor((now-r.at)/t.every);const v=Math.min(t.cap,r.v+ticks*t.step);return {v,next:r.v+ticks*t.step>=t.cap?0:r.at+(ticks+1)*t.every,full:v>=t.cap?0:r.at+Math.ceil((t.cap-r.v)/t.step)*t.every};}
function regenSet(c,t,v,now){v=Math.max(0,Math.min(t.cap,v));const cur=c.regen[t.id];
  /* keep the partial tick when spending, so the next +step stays on time */
  if(cur){const ticks=Math.floor((now-cur.at)/t.every),old=Math.min(t.cap,cur.v+ticks*t.step);c.regen[t.id]=old>=t.cap?{v,at:now}:{v,at:cur.at+ticks*t.every};}
  else c.regen[t.id]={v,at:now};}
function used(t,c){const s=srvOf(c),bag=t.kind==='day'?(t.scope==='s'?s.daily:c.daily):(t.scope==='s'?s.week:c.week);return {bag,n:+bag[t.id]||0};}

/* ---- Schedule ---- */
function upcoming(now,days){const out=[],end=now+days*864e5;
  for(const e of SCHED){let t=now;for(;;){t=nextAt(S.set.tz,e.d,e.h,e.m,t);if(t>end)break;out.push({n:e.n,w:e.w,t,conf:e.conf});}}
  out.push({n:'Daily reset',w:'',t:nextDaily(now),conf:false});out.push({n:'Weekly reset',w:'',t:nextWeekly(now),conf:false});
  return out.filter(x=>x.t<=end||x.n.includes('reset')).sort((a,b)=>a.t-b.t);}
function pgSchedule(){const now=Date.now(),ev=upcoming(now,7),sp=tzParts(S.set.tz,now);
  return `<h2>Schedule</h2><p class="sub">The fixed weekly events for the next seven days, in your own time. Server time is ${esc(S.set.tz)} (now ${String(sp.h).padStart(2,'0')}:${String(sp.mi).padStart(2,'0')}); change it in <a href="#settings">Settings</a>.</p>
<div class="card tbl"><table><tr><th>Event</th><th>Where</th><th>Your time</th><th class="n">Starts in</th></tr>${ev.map(e=>`<tr><td>${mark(e.conf)} <b>${esc(e.n)}</b></td><td>${esc(e.w)}</td><td>${when(e.t)}</td><td class="n mono" data-cd="${e.t}">${dur(e.t-now)}</td></tr>`).join('')}</table></div>
<h3>The weekly pattern (server time)</h3><div class="card tbl"><table><tr><th>Event</th><th>Where</th><th>Days</th><th>Time</th></tr>${SCHED.map(e=>`<tr><td><b>${esc(e.n)}</b>${e.x?`<div class="dim" style="font-size:12px">${esc(e.x)}</div>`:''}</td><td>${esc(e.w)}</td><td>${e.d.map(d=>DAYN[d].slice(0,3)).join(', ')}</td><td class="mono">${String(e.h).padStart(2,'0')}:${String(e.m).padStart(2,'0')}</td></tr>`).join('')}</table></div>
<div class="note">Spawn times are from guides, in server time. Which time zone each global server region uses isn't published, so the defaults in Settings are guesses ○. Watcher Kaira (every 3 hours) and Spacetime Rifts (every 3 hours) have no fixed start, so log them on <a href="#bosses">Field bosses</a> or <a href="#timers">Timers</a>.</div>`;}

function applyView(){const v=mapView[mapId],mi=$('mi');if(!mi||!v)return;mi.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.z})`;mi.style.setProperty('--iz',1/v.z);}
function fitView(W,H){const r=$('mw').getBoundingClientRect(),z=Math.min(r.width/W,r.height/H)||1;mapView[mapId]={z,min:z/2,x:(r.width-W*z)/2,y:(r.height-H*z)/2,W,H};applyView();}
function zoomAt(f,mx,my){const v=mapView[mapId],z=Math.max(v.min,Math.min(v.min*40,v.z*f)),k=z/v.z;v.x=mx-(mx-v.x)*k;v.y=my-(my-v.y)*k;v.z=z;applyView();}
function mapsWire(){const c=C(),m=curMap(),img=mapImg[m.id]||null,W=img?img.w:1000,H=img?img.h:1000,mw=$('mw'),v=mapView[m.id];
  if(!v||v.W!==W||v.H!==H)fitView(W,H);else applyView();
  let d=null;
  mw.onpointerdown=e=>{if(e.button)return;d={x:e.clientX,y:e.clientY,mv:false,pin:(e.target.closest('[data-pin]')||{}).dataset?.pin};mw.setPointerCapture(e.pointerId);};
  mw.onpointermove=e=>{if(!d)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;if(!d.mv&&Math.hypot(dx,dy)<5)return;d.mv=true;mw.classList.add('drag');const v=mapView[m.id];v.x+=dx;v.y+=dy;d.x=e.clientX;d.y=e.clientY;applyView();};
  mw.onpointerup=e=>{mw.classList.remove('drag');const q=d;d=null;if(!q||q.mv)return;
    const r=mw.getBoundingClientRect(),v=mapView[m.id],x=(e.clientX-r.left-v.x)/v.z/W,y=(e.clientY-r.top-v.y)/v.z/H,inside=x>=0&&y>=0&&x<=1&&y<=1;
    if(pinMove){const p=S.pins.find(z=>z.id===pinMove);if(p&&inside){p.x=x;p.y=y;}pinMove='';save();route(true);return;}
    if(q.pin){pinSel=q.pin;pinDraft=null;route(true);return;}
    if(inside){pinDraft={x,y};pinSel='';route(true);}};
  mw.onwheel=e=>{e.preventDefault();const r=mw.getBoundingClientRect();zoomAt(e.deltaY<0?1.2:1/1.2,e.clientX-r.left,e.clientY-r.top);};
  document.querySelectorAll('[data-mz]').forEach(b=>b.onclick=()=>{const z=b.dataset.mz;if(z==='fit')fitView(W,H);else{const r=mw.getBoundingClientRect();zoomAt(+z,r.width/2,r.height/2);}});

  $('mimg').onclick=()=>$('mfile').click();$('mfile').onchange=e=>{const f=e.target.files[0];if(f)setImg(m.id,f);};
  if($('mimgx'))$('mimgx').onclick=()=>{if(confirm('Remove the map picture? Your pins stay.'))setImg(m.id,null);};
  document.querySelectorAll('[data-lay]').forEach(b=>b.onclick=()=>{const o=mapPref().off;o[b.dataset.lay]=!o[b.dataset.lay];save();route(true);});
  $('mhide').onchange=e=>{mapPref().hide=e.target.checked;save();route(true);};

${S.chars.map(x=>`<div class="card ch ${x.id===c.id?'on':''}"><div><b>${esc(x.name)}</b> <span class="tag ${x.fac==='Elyos'?'y':'b'}">${esc(x.fac)}</span><span class="tag">${esc(clsOf(x.cls).n)}</span><span class="tag">Lv ${x.lvl}</span><span class="tag">iLv ${fmtN(x.ilvl)}</span>${x.server?`<span class="tag">${esc(x.server)}</span>`:''}</div><div class="row">${x.id===c.id?'<span class="ok">Active</span>':`<button class="sm" data-sw="${x.id}">Switch</button>`}${S.chars.length>1?`<button class="sm" data-cdl="${x.id}" title="Delete">✕</button>`:''}</div></div>`).join('')}
<h3>Edit ${esc(c.name)}</h3><div class="card"><div class="row"><label>Name <input type="text" data-cf="name" value="${esc(c.name)}" style="width:160px"></label><label>Server <input type="text" data-cf="server" value="${esc(c.server)}" placeholder="e.g. Siel" style="width:140px"></label>
<label>Faction <select data-cf="fac">${['Elyos','Asmodian'].map(f=>`<option${c.fac===f?' selected':''}>${f}</option>`).join('')}</select></label>
<label>Class <select data-cf="cls">${CLASSES.map(k=>`<option value="${k.id}"${c.cls===k.id?' selected':''}>${esc(k.n)}${k.kr?' (Korea)':''}</option>`).join('')}</select></label></div>
<div class="row"><label>Level <input type="number" class="num" data-cf="lvl" min="1" max="50" value="${c.lvl}"></label><label>Item level <input type="number" data-cf="ilvl" min="0" value="${c.ilvl}" style="width:90px"></label><label>Combat Power <input type="number" data-cf="cp" min="0" value="${c.cp}" style="width:110px"></label><label class="chk"><input type="checkbox" data-cf="member"${c.member?' checked':''}> Membership</label></div></div>
<div class="card"><form class="row" id="nf"><input id="nn" type="text" style="width:160px" placeholder="New character name"><button class="pri">Add character</button></form></div>`;}
function charsWire(){const c=C();
  document.querySelectorAll('[data-cf]').forEach(i=>i.onchange=()=>{const k=i.dataset.cf;c[k]=i.type==='checkbox'?i.checked:i.type==='number'?Math.max(0,+i.value||0):i.value.trim();if(k==='lvl')c.lvl=Math.max(1,Math.min(50,c.lvl));if(k==='server')rollover();save();route(true);});
  document.querySelectorAll('[data-cdl]').forEach(b=>b.onclick=()=>{const x=S.chars.find(y=>y.id===b.dataset.cdl);if(!confirm('Delete '+x.name+' and everything tracked for them?'))return;S.chars=S.chars.filter(y=>y!==x);if(S.cur===x.id)S.cur=S.chars[0].id;save();route(true);});
  $('nf').onsubmit=e=>{e.preventDefault();const x=newChar($('nn').value.trim()||'New Daeva',c.server);x.fac=c.fac;x.dAt=lastDaily(Date.now());x.wAt=lastWeekly(Date.now());S.chars.push(x);S.cur=x.id;save();route(true);};}

/* ---- Item level planner ---- */
function pgPlanner(){const c=C(),il=+c.ilvl||0,nx=ILVL.find(x=>x[0]>il);
  const enh=SLOTS.reduce((a,s)=>a+(+c.enh[s]||0),0),tgt=SLOTS.reduce((a,s)=>a+Math.max(+c.enh[s]||0,+c.enhT[s]||0),0);
  const arcE=ARCANA.filter(a=>!c.arc[a[0]]||!c.arc[a[0]].g).length,low=SLOTS.filter(s=>(+c.enh[s]||0)<4);
  return `<h2>Item level planner</h2><p class="sub">${esc(c.name)} is at item level <b>${fmtN(il)}</b>. <a href="#chars">Change it</a>.</p>
<div class="card tbl"><table><tr><th class="n">Item level</th><th>Opens</th><th class="n">Gap</th></tr>${ILVL.map(([n,t,cf])=>`<tr class="${n<=il?'':'lock'}"><td class="n mono">${n<=il?'<span class="ok">✔</span> ':''}${fmtN(n)}</td><td>${mark(cf)} ${esc(t)}</td><td class="n mono">${n<=il?'':fmtN(n-il)}</td></tr>`).join('')}</table></div>
${nx?`<div class="tip"><b>Next: ${fmtN(nx[0])}</b> (${esc(nx[1])}), ${fmtN(nx[0]-il)} to go. Cheapest first: ${[arcE&&il>=1600?`${arcE} empty Arcana slot${arcE>1?'s':''} (20 to 80 each)`:'',low.length?`${low.length} piece${low.length>1?'s':''} under +4`:'','any empty manastone slots (1 to 4 each)','unspent Daevanion Crystals (about 1 each)'].filter(Boolean).join(', ')}.</div>`:'<div class="tip ok">Every listed breakpoint is open.</div>'}
<h3>Enhancement</h3><p class="dim">Each level adds 1 item level to that piece. Set where each piece is and where you want it. Current: <b>+${enh}</b> in total. Your targets add <b>+${tgt-enh}</b> item level.</p>
<div class="slots">${SLOTS.map(s=>`<div class="slot"><b>${s}</b><div class="row"><label>Now <input type="number" class="num" min="0" max="25" data-en="${s}" value="${+c.enh[s]||0}"></label><label>Goal <input type="number" class="num" min="0" max="25" data-et="${s}" value="${c.enhT[s]??''}"></label></div></div>`).join('')}</div>
<div class="row"><button data-eall="4">Goal +4 on all</button><button data-eall="8">Goal +8 on all</button><button data-eall="">Clear goals</button></div>
<div class="note">The slot list is from guides and may not match the global client exactly ○. Spreading enhancement wins: six pieces at +8 give more than one at +15 with the rest at +2, and costs climb fast past +10.</div>`;}
function plannerWire(){const c=C();
  document.querySelectorAll('[data-en]').forEach(i=>i.onchange=()=>{c.enh[i.dataset.en]=Math.max(0,+i.value||0);save();route(true);});
  document.querySelectorAll('[data-et]').forEach(i=>i.onchange=()=>{if(i.value==='')delete c.enhT[i.dataset.et];else c.enhT[i.dataset.et]=Math.max(0,+i.value||0);save();route(true);});
  document.querySelectorAll('[data-eall]').forEach(b=>b.onclick=()=>{const v=b.dataset.eall;SLOTS.forEach(s=>{if(v==='')delete c.enhT[s];else c.enhT[s]=+v;});save();route(true);});}

/* ---- Build ---- */
function pgBuild(){const c=C(),cl=clsOf(c.cls),ai=ARCANA.reduce((a,[s])=>{const x=c.arc[s]||{};return a+(+x.il||0);},0);
  return `<h2>Build</h2><p class="sub">${esc(c.name)}, ${esc(cl.n)} level ${c.lvl}. Write down what you run so you can rebuild it after a respec or patch.</p>
<h3>Stigma</h3><div class="slots">${STIG.map((l,i)=>`<div class="slot"><b>Slot ${i+1} <span class="dim">(level ${l})</span></b>${c.lvl<l?'<div class="dim">Locked</div>':''}<input type="text" data-sg="${i}" value="${esc(c.stig[i]||'')}" placeholder="Stigma and level" style="width:100%"></div>`).join('')}</div>
<h3>Daevanion boards</h3><div class="slots">${DAEV.map(([n,l])=>{const d=c.dae[n]||{};return `<div class="slot"><b>${n} <span class="dim">(level ${l})</span></b>${c.lvl<l?'<div class="dim">Locked</div>':`<div class="row"><label>Nodes <input type="number" class="num" min="0" data-dn="${n}" value="${d.n||0}"></label><label class="chk"><input type="checkbox" data-dd="${n}"${d.done?' checked':''}> Done</label></div>`}<input type="text" data-dt="${n}" value="${esc(d.t||'')}" placeholder="Path or priority" style="width:100%"></div>`;}).join('')}</div>
<h3>Arcana</h3><p class="dim">Arcana item level so far: <b>${ai}</b> of up to 400.</p><div class="slots">${ARCANA.map(([s,src])=>{const x=c.arc[s]||{};return `<div class="slot"><b>${s}</b><div class="dim" style="font-size:12px">${esc(src)}</div><div class="row"><select data-ag="${s}">${AGRADE.map(([v,n])=>`<option value="${v}"${(x.g||'')===v?' selected':''}>${n}</option>`).join('')}</select><label>iLv <input type="number" class="num" min="0" max="80" data-ai="${s}" value="${x.il||''}"></label></div><input type="text" data-at="${s}" value="${esc(x.t||'')}" placeholder="Main stat, set" style="width:100%"></div>`;}).join('')}</div>
<div class="note">Common is 20 item level and Unique 80; the grades between aren't published, so type the number from the card ○. Some guides say season one has four Arcana slots, the global client shows five.</div>
<h3>Your class: ${esc(cl.n)}</h3><div class="card">${classCard(cl)}</div>`;}
function buildWire(){const c=C();
  document.querySelectorAll('[data-sg]').forEach(i=>i.oninput=()=>{c.stig[+i.dataset.sg]=i.value;save();});
  const dae=n=>c.dae[n]||(c.dae[n]={});
  document.querySelectorAll('[data-dn]').forEach(i=>i.onchange=()=>{dae(i.dataset.dn).n=Math.max(0,+i.value||0);save();});
  document.querySelectorAll('[data-dd]').forEach(i=>i.onchange=()=>{dae(i.dataset.dd).done=i.checked;save();});
  document.querySelectorAll('[data-dt]').forEach(i=>i.oninput=()=>{dae(i.dataset.dt).t=i.value;save();});
  const arc=s=>c.arc[s]||(c.arc[s]={});
  document.querySelectorAll('[data-ag]').forEach(i=>i.onchange=()=>{const a=arc(i.dataset.ag),g=AGRADE.find(x=>x[0]===i.value);a.g=i.value;if(g&&g[2]!=null&&!a.il)a.il=g[2];if(!i.value)a.il=0;save();route(true);});
  document.querySelectorAll('[data-ai]').forEach(i=>i.onchange=()=>{arc(i.dataset.ai).il=Math.max(0,Math.min(80,+i.value||0));save();route(true);});
  document.querySelectorAll('[data-at]').forEach(i=>i.oninput=()=>{arc(i.dataset.at).t=i.value;save();});}

/* ---- Progression ---- */
function pgProgress(){const c=C(),done=PROG.filter((_,i)=>c.prog[i]).length,groups=[...new Set(PROG.map(p=>p[0]))];
  return `<h2>Progression</h2><p class="sub" id="pdone">${esc(c.name)}: ${done} of ${PROG.length} done</p><div class="bar"><i id="pbar" style="width:${done/PROG.length*100}%"></i></div>
${groups.map(g=>`<h3>${g}</h3><div class="card">${PROG.map((p,i)=>p[0]===g?`<label class="chk"><input type="checkbox" data-p="${i}"${c.prog[i]?' checked':''}> ${esc(p[1])}</label>`:'').join('')}</div>`).join('')}
<button onclick="if(confirm('Clear the progression ticks for this character?')){C().prog={};save();route()}">Reset</button>`;}

/* ---- Lookups ---- */
function classCard(k){return `<div class="ch"><div><b class="big">${esc(k.n)}</b>${k.alias?` <span class="dim">(${esc(k.alias)})</span>`:''}${k.kr?' <span class="tag r">Korea only</span>':''}</div><div><span class="tag">${esc(k.role)}</span><span class="tag">${esc(k.wpn)}</span>${k.diff!=='—'?`<span class="tag">Difficulty: ${esc(k.diff)}</span><span class="tag ${/high/i.test(k.beg)?'g':''}">For beginners: ${esc(k.beg)}</span>`:''}</div></div><p>${esc(k.play)}</p>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${k.good.length?`<div><b class="ok">Strengths</b><ul class="mech">${k.good.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}${k.bad.length?`<div><b class="bad">Weaknesses</b><ul class="mech">${k.bad.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</div>`;}
function pgClasses(){return `<h2>Classes</h2><p class="sub">Eight classes on global. Some Korean translations call the Sorcerer a Wizard and the Spiritmaster a Summoner. NC doesn't publish a tier list, and balance patches move things, so the ratings below are about how forgiving each class is, not how strong.</p>
${CLASSES.map(k=>`<div class="card" id="cls-${k.id}">${classCard(k)}</div>`).join('')}`;}

let ctQ='',ctF='all';
function contentRows(list,c){return list.map(x=>{const lockL=c.lvl<x.lv,lockI=x.il&&(+c.ilvl||0)<x.il,open=!lockL&&!lockI&&x.g!==false;
  return `<tr class="${open?'':'lock'}"><td>${mark(x.conf)} <b>${esc(x.n)}</b>${x.g===false?' <span class="tag r">Korea only</span>':x.g===null?' <span class="tag y">Global unconfirmed</span>':''}<div class="dim" style="font-size:12px">${esc(x.d)}</div></td><td>${esc(x.t)}</td><td>${esc(x.size)}</td><td class="mono">Lv ${x.lv}${x.il?` · iLv ${fmtN(x.il)}`:x.il===null?' · iLv ?':''}</td><td>${esc(x.lim)}</td><td>${esc(x.rew)}</td><td>${x.g===false?'':open?'<span class="ok">Open</span>':`<span class="dim">${lockL?'Level '+x.lv:'iLv '+fmtN(x.il)}</span>`}</td></tr>`;}).join('');}
function pgContent(){const c=C(),types=['all','open','Expedition','Transcendence','Sanctuary','Abyss','PvP','Solo','Korea only'];
  const q=ctQ.toLowerCase(),list=CONTENT.filter(x=>(!q||(x.n+' '+x.d+' '+x.rew+' '+x.t).toLowerCase().includes(q))&&(ctF==='all'||(ctF==='open'?(c.lvl>=x.lv&&(!x.il||c.ilvl>=x.il)&&x.g!==false):ctF==='Korea only'?x.g===false:ctF==='Solo'?/solo/i.test(x.t):x.t.includes(ctF))));
  return `<h2>Dungeons and raids</h2><p class="sub">Every instance and repeatable activity, checked against ${esc(c.name)} (level ${c.lvl}, item level ${fmtN(c.ilvl)}).</p>
<div class="row"><input type="search" id="ctq" placeholder="Search" value="${esc(ctQ)}" style="width:200px"></div><div class="chips">${types.map(t=>`<button data-ctf="${t}" class="${ctF===t?'on':''}">${t==='all'?'All':t==='open'?'Open to me':t}</button>`).join('')}</div>
<div class="card tbl"><table><tr><th>Content</th><th>Type</th><th>Size</th><th>Gate</th><th>Limit</th><th>Rewards</th><th></th></tr>${contentRows(list,c)||'<tr><td colspan="7" class="dim">Nothing matches.</td></tr>'}</table></div>
<div class="note">Item level gates differ between guides, and many come from the Korean build. Treat ○ gates as roughly right.</div>`;}
function contentWire(){$('ctq').oninput=e=>{ctQ=e.target.value;const p=e.target.selectionStart;route(true);const i=$('ctq');i.focus();i.setSelectionRange(p,p);};document.querySelectorAll('[data-ctf]').forEach(b=>b.onclick=()=>{ctF=b.dataset.ctf;route(true);});}

function pgUnlocks(){const c=C();return `<h2>Unlocks by level</h2><p class="sub">What the global client opens as you level. Wings come from the story, not a set level. ${esc(c.name)} is level ${c.lvl}.</p>
<div class="card tbl"><table><tr><th class="n">Level</th><th>Opens</th></tr>${UNLOCKS.map(([l,t])=>`<tr class="${l<=c.lvl?'':'lock'}"><td class="n mono">${l<=c.lvl?'<span class="ok">✔</span> ':''}${l}</td><td>${esc(t)}</td></tr>`).join('')}</table></div>`;}

function pgAbyss(){const c=C(),now=Date.now();
  return `<h2>The Abyss</h2><p class="sub">Reshanta is shared PvPvE between the Elyos and Asmodians. It opens at level 45.</p>
<div class="card tbl"><table><tr><th>Layer</th><th>Item level</th><th>Weekly time</th><th>On global</th></tr><tr><td><b>Lower Reshanta</b> (Chaotic)</td><td>1,000 (one guide adds 500k Combat Power ○)</td><td>7 h</td><td class="ok">Yes</td></tr><tr><td><b>Middle Reshanta</b></td><td>3,000</td><td>7 h</td><td class="ok">Yes</td></tr><tr><td><b>Upper Reshanta</b></td><td>—</td><td>—</td><td class="bad">Korea only</td></tr></table></div>
<h3>Time</h3><ul class="mech"><li>7 hours a week per layer, bankable to 7. Membership is reported to double Lower and Middle to 14 ○.</li><li>Rift Stones add 1 hour (Lower/Middle) or 30 minutes (lesser).</li><li>${esc(c.name)} has <b>${dur(Math.max(0,abyssMax(c)-abyssUsed(c.abyss.lower,now)))}</b> left in Lower Reshanta. <a href="#tracker">Start the clock</a>.</li></ul>
<h3>Abyss Points and rank</h3><ul class="mech"><li>From kills, Abyss bosses, Duty Missions (1,000 per Wanted bounty), enemy Sealed Dungeons and Spacetime Rifts.</li><li>A weekly cap, tracked separately for PvE and PvP. Past it, only Rifts add a little.</li><li>Spend them on Stigma Shards and Daevanion Crystal: Azphel.</li><li>Ranks go by placement in your class: Supreme Commander is first, 5-Star Officer is 7th to 20th ○.</li></ul>
<h3>Artifact Siege</h3><div class="card">${esc(SCHED[0].x)} Monday, Thursday and Saturday at 21:00 server time. Every artifact your faction holds also opens an instanced farming area. <a href="#schedule">See countdowns</a>.</div>
<h3>Abyss bosses</h3><div class="card tbl"><table><tr><th>Boss</th><th>Layer</th><th>When (server time)</th></tr>${SCHED.slice(1).map(e=>`<tr><td><b>${esc(e.n)}</b></td><td>${esc(e.w)}</td><td>${e.d.map(d=>DAYN[d].slice(0,3)).join(', ')} ${String(e.h).padStart(2,'0')}:${String(e.m).padStart(2,'0')}</td></tr>`).join('')}<tr><td><b>Watcher Kaira</b></td><td>Lower Reshanta</td><td>Every 3 hours</td></tr></table></div>`;}

function pgWorld(){const c=C();return `<h2>Regions</h2><p class="sub">NC says the world is about 36 times the size of the first game's, built for flight and diving.</p>

<h3>Field bosses</h3><div class="card tbl"><table><tr><th>Boss</th><th>Verteron</th><th>Altgard</th></tr>${FBOSS.filter(b=>b.v!=='Lower Reshanta').map(b=>`<tr><td><b>${esc(b.n)}</b>${b.lv?` <span class="tag">Lv ${b.lv}</span>`:''}</td><td>${esc(b.v)}</td><td>${esc(b.a)}</td></tr>`).join('')}</table></div>
<p><a href="#bosses">Track respawns</a>. Guides list 23 named monsters in Verteron and 22 in Altgard.</p>`;}

function pgGlossary(){return `<h2>Glossary</h2><p class="sub">The words Aion 2 throws at you.</p><div class="card tbl"><table>${GLOSS.map(([a,b])=>`<tr><td style="white-space:nowrap"><b>${esc(a)}</b></td><td>${esc(b)}</td></tr>`).join('')}</table></div>`;}

function pgUpdates(){const today=new Date().toISOString().slice(0,10);
  return `<h2>Global vs Korea, updates</h2><p class="sub">Korea and Taiwan are about a season ahead. What they have now is roughly what global gets next.</p>${GUIDES.find(g=>g.id==='global').body}

let lkQ='';
function pgLookup(){const q=lkQ.trim().toLowerCase(),hit=s=>s.toLowerCase().includes(q),res=[];
  if(q){CLASSES.forEach(k=>{if(hit(k.n+' '+(k.alias||'')+' '+k.role+' '+k.wpn+' '+k.play))res.push(['Class',k.n,k.role+' · '+k.wpn,'classes']);});
    CONTENT.forEach(x=>{if(hit(x.n+' '+x.t+' '+x.d+' '+x.rew))res.push(['Content',x.n,x.t+' · Lv '+x.lv+(x.il?' · iLv '+x.il:'')+' · '+x.lim,'content']);});
    GLOSS.forEach(([a,b])=>{if(hit(a+' '+b))res.push(['Term',a,b,'glossary']);});
    UNLOCKS.forEach(([l,t])=>{if(hit(t))res.push(['Unlock','Level '+l,t,'unlocks']);});
    ILVL.forEach(([n,t])=>{if(hit(t))res.push(['Item level',fmtN(n),t,'planner']);});
    FBOSS.concat(SCHED).forEach(b=>{if(hit(b.n+' '+(b.v||'')+' '+(b.a||'')+' '+(b.w||'')))res.push(['Boss / event',b.n,b.w||(b.v+' / '+b.a),b.w?'schedule':'bosses']);});
    ZONES.forEach(z=>{if(hit(z.n+' '+z.x))res.push(['Region',z.n,z.f+' · '+z.lv,'world']);});
    for(const m in AREAS)areaList(m).forEach(a=>{const f=[a.n,...a.h,...a.v,...a.o].find(hit);if(f)res.push(['Area',a.n,(MAPS.find(x=>x.id===m)||{}).n+(f!==a.n?' · '+f:''),'areas']);});
    PETS.forEach(p=>{if(hit(p.n))res.push(['Pet',p.n,p.g+' · '+(p.combat?'monster souls':'chests and merchants'),'pets']);});
    S.pins.forEach(p=>{if(hit(p.l+' '+(p.note||'')+' '+(p.pet||'')))res.push(['Your pin',p.l,PINT[p.t][1]+' · '+((MAPS.find(x=>x.id===p.m)||{}).n||'')+(p.a?' · '+p.a:''),'maps']);});
    GUIDES.forEach(g=>{if(hit(g.title+' '+g.body.replace(/<[^>]+>/g,'')))res.push(['Guide',g.title,g.blurb,'guides/'+g.id]);});}
  return `<h2>Search</h2><p class="sub">Look up a dungeon, boss, term, class or guide.</p><input type="search" id="lkq" placeholder="e.g. Arcana, Nahma, Draupnir, Odyle" value="${esc(lkQ)}" style="width:min(420px,100%)">
<div class="chips">${['Odyle','Arcana','Nightmare','Abyss Points','Stigma','Daily Dungeon','Siege','Transcendence'].map(s=>`<button data-lk="${s}">${s}</button>`).join('')}</div>
${q?`<div class="card tbl"><table>${res.map(([t,n,d,h])=>`<tr><td><span class="tag">${t}</span></td><td><a class="mob" href="#${h}">${esc(n)}</a></td><td>${esc(d)}</td></tr>`).join('')||'<tr><td class="dim">Nothing found.</td></tr>'}</table></div>`:''}`;}
function lookupWire(){const i=$('lkq');i.oninput=e=>{lkQ=e.target.value;const p=e.target.selectionStart;route(true);const j=$('lkq');j.focus();j.setSelectionRange(p,p);};if(!lkQ)i.focus();
  document.querySelectorAll('[data-lk]').forEach(b=>b.onclick=()=>{lkQ=b.dataset.lk;route(true);});}

function pgGuides(sub){
  if(sub){const g=GUIDES.find(x=>x.id===sub);if(g)return `<p><a href="#guides">&larr; All guides</a></p><h2>${g.title}</h2><div class="card">${g.body}</div>`;}
  return `<h2>Guides</h2><p class="sub">Short, practical guides for the global version.</p><div class="grid">${GUIDES.map(g=>`<div class="tile" onclick="location.hash='guides/${g.id}'"><b>${g.title}</b><div class="dim">${g.blurb}</div></div>`).join('')}</div>`;}

function pgNotes(){return `<h2>My Notes</h2><p class="sub">Saved automatically on this device.</p><textarea id="nt" style="width:100%;height:60vh" placeholder="Legion name, Stigma rotation, where the Hidden Cubes you missed are, which alt holds what...">${esc(S.notes)}</textarea>`;}

function pgSettings(){const now=Date.now(),st=S.set,loc=new Date(nextWeekly(now));
  return `<h2>Settings</h2><p class="sub">Times the tracker uses. Match them to the game once and every countdown follows.</p>
<div class="card"><h3 style="margin-top:0">Server time</h3><p class="dim">Used for the Artifact Siege and Abyss bosses ("21:00 server time"). Which zone each global region uses isn't published ○; compare the in-game clock with these.</p>
<div class="row"><select id="stz">${TZS.map(([n,z])=>`<option value="${z}"${st.tz===z?' selected':''}>${n} · ${z}</option>`).join('')}${TZS.some(x=>x[1]===st.tz)?'':`<option selected>${esc(st.tz)}</option>`}</select><input type="text" id="stz2" placeholder="or any zone, e.g. Europe/Berlin" style="width:220px"></div></div>
<div class="card"><h3 style="margin-top:0">Reset</h3><p class="dim">Guides agree on Wednesday but not the hour; two say 07:00 UTC ○. Hover any counter in-game for the "recharge in" countdown and set it here.</p>
<div class="row"><label>Weekly on <select id="rd">${DAYN.map((d,i)=>`<option value="${i}"${+st.rDay===i?' selected':''}>${d}</option>`).join('')}</select></label><label>at <input type="number" class="num" id="rh" min="0" max="23" value="${st.rHour}">:00</label><label>in <select id="rtz"><option${st.rTz==='UTC'?' selected':''}>UTC</option><option value="${esc(st.tz)}"${st.rTz===st.tz&&st.rTz!=='UTC'?' selected':''}>server time</option></select></label></div>
<p>Next weekly reset in your time: <b>${loc.toLocaleString([],{weekday:'long',hour:'2-digit',minute:'2-digit'})}</b>. Daily resets happen at the same hour every day.</p></div>
<div class="card"><h3 style="margin-top:0">Data</h3><p class="dim">Everything is in this browser under <code>a2_state</code>. Sign in on the <a href="/assistants/">assistants page</a> to sync it through your Google Drive.</p><button id="exp">Download a backup</button> <label><button id="impb">Restore a backup</button><input type="file" id="imp" accept=".json" hidden></label></div>`;}
function settingsWire(){
  const setTz=z=>{try{new Intl.DateTimeFormat('en',{timeZone:z});}catch(e){alert('Unknown time zone: '+z);return;}const wasSrv=S.set.rTz===S.set.tz&&S.set.rTz!=='UTC';S.set.tz=z;if(wasSrv)S.set.rTz=z;save();route(true);};
  $('stz').onchange=e=>setTz(e.target.value);$('stz2').onchange=e=>{if(e.target.value.trim())setTz(e.target.value.trim());};
  /* moving the reset only affects future resets, so don't wipe today's ticks */
  const re=()=>{const now=Date.now();S.set.rDay=+$('rd').value;S.set.rHour=Math.max(0,Math.min(23,+$('rh').value||0));S.set.rTz=$('rtz').value;const d=lastDaily(now),w=lastWeekly(now);
    S.chars.forEach(c=>{c.dAt=Math.max(c.dAt,d);c.wAt=Math.max(c.wAt,w);});for(const k in S.srv){S.srv[k].dAt=Math.max(S.srv[k].dAt,d);S.srv[k].wAt=Math.max(S.srv[k].wAt,w);}save();route(true);};
  $('rd').onchange=re;$('rh').onchange=re;$('rtz').onchange=re;
  $('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='aion2-assistant.json';a.click();};
  $('impb').onclick=()=>$('imp').click();
  $('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const s=JSON.parse(t);if(!s.chars)throw 0;if(confirm('Replace everything here with this backup?')){S=Object.assign(S,s);save();rollover();route();}}catch(x){alert('That file isn’t an Aion 2 Assistant backup.');}});};}

/* ================= ROUTER ================= */
let tick=0;
function route(keepScroll){
  rollover();
  const [pg,sub]=(location.hash.slice(1)||'home').split('/');
  const page=REAL.some(p=>p[0]===pg)?pg:'home';
  buildNav(page);
  const m=$('main'),top=m.scrollTop;
  m.innerHTML=({home:pgHome,tracker:pgTracker,checklist:pgChecklist,schedule:pgSchedule,bosses:pgBosses,maps:pgMaps,areas:pgAreas,pets:pgPets,timers:pgTimers,chars:pgChars,planner:pgPlanner,build:pgBuild,progress:pgProgress,lookup:pgLookup,guides:()=>pgGuides(sub),classes:pgClasses,content:pgContent,unlocks:pgUnlocks,abyss:pgAbyss,world:pgWorld,glossary:pgGlossary,updates:pgUpdates,notes:pgNotes,settings:pgSettings})[page]();
  m.scrollTop=keepScroll===true?top:0;
  m.querySelectorAll('input[type=checkbox][data-p]').forEach(cb=>{cb.onchange=()=>{const c=C();c.prog[cb.dataset.p]=cb.checked;save();const d=PROG.filter((_,i)=>c.prog[i]).length;$('pdone').textContent=c.name+': '+d+' of '+PROG.length+' done';$('pbar').style.width=d/PROG.length*100+'%';};});
  m.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{S.cur=b.dataset.sw;save();route(true);});
  ({tracker:trackerWire,checklist:checklistWire,bosses:bossWire,maps:mapsWire,areas:areasWire,pets:petsWire,timers:timerWire,chars:charsWire,planner:plannerWire,build:buildWire,content:contentWire,lookup:lookupWire,settings:settingsWire})[page]?.();
  if(page==='notes')$('nt').oninput=e=>{S.notes=e.target.value;save();};
  /* one clock for every countdown on the page; redraw when something finishes or a reset passes */
  clearInterval(tick);tick=setInterval(()=>{const now=Date.now();let redraw=false;
    document.querySelectorAll('[data-cd]').forEach(el=>{const t=+el.dataset.cd;if(t<=now){redraw=true;return;}el.textContent=dur(t-now);});
    const c=C();for(const k of ['lower','middle']){const a=c.abyss[k];if(!a.run)continue;const el=document.querySelector(`[data-ab="${k}"]`),b=document.querySelector(`[data-abb="${k}"]`),u=abyssUsed(a,now),mx=abyssMax(c);if(el)el.textContent=dur(Math.max(0,mx-u));if(b)b.style.width=Math.min(100,u/mx*100)+'%';}
    const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if((redraw||rollover())&&!typing)route(true);},1000);
}
window.addEventListener('hashchange',()=>route());
window.addEventListener('storage',e=>{if(e.key==='a2_state'){try{S=Object.assign(S,JSON.parse(e.newValue));route(true);}catch(x){}}});
route();
</script>
