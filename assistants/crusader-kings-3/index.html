const GUIDES=[
{id:'first',title:'Your first game',blurb:'Pick a start, read the screen, survive the first decade.',body:`
<p>CK3 is a game about a <b>dynasty</b>, not a country. When your character dies you play as their heir. The game ends if no one in your dynasty holds a title.</p>
<label class="chk"><input type="checkbox" data-k="f1"> Start in <b>1066 Ireland</b> as Murchad of Munster (the tutorial), or any duke in a quiet corner. Avoid empires and tiny counts surrounded by kings.</label>
<label class="chk"><input type="checkbox" data-k="f2"> Pick a lifestyle focus (top-left portrait → Lifestyle). Stewardship → Domain is the safest first pick.</label>
<label class="chk"><input type="checkbox" data-k="f3"> Fill your council. Use the "best candidate" suggestions, then set tasks: Chancellor on Fabricate Claim, Steward on Collect Taxes, Spymaster on Find Secrets.</label>
<label class="chk"><input type="checkbox" data-k="f4"> Marry if you aren't. Look for a spouse with good congenital traits and a powerful family (an alliance).</label>
<label class="chk"><input type="checkbox" data-k="f5"> Hire men-at-arms in the Military tab. Two or three regiments beat hundreds of levies.</label>
<label class="chk"><input type="checkbox" data-k="f6"> Check your heir and their education. Assign a guardian with high skill in the focus you want.</label>
<label class="chk"><input type="checkbox" data-k="f7"> Find a war: use a claim or de jure claim on a weaker neighbour (the Decisions and Casus Belli lists show options).</label>
<label class="chk"><input type="checkbox" data-k="f8"> Watch your vassals: green opinion good, red bad. Big unhappy vassals start factions.</label>
<div class="tip">Pause (space) whenever something pops up. CK3 is meant to be read. Hover everything: the tooltips explain every number.</div>`},
{id:'realm',title:'Running a realm',blurb:'Domain limit, vassals, titles and keeping it together.',body:`
<ul class="mech"><li>Keep your <b>domain</b> under its limit: hold the best castles (and maybe one city), give the rest away.</li>
<li>Give land to people who won't rebel: <b>content</b>, <b>loyal</b>, friends, family with your dynasty, or vassals you have hooks on.</li>
<li>Create <b>duchy</b> titles you hold most of: it lowers your vassal count and unlocks de jure claims on the rest.</li>
<li>Raise <b>crown authority</b> when your vassals are happy. Each level gives you more control and annoys them.</li>
<li>Change to a better <b>succession law</b> as soon as you can. See the <a href="#succession">Succession simulator</a>.</li>
<li>Build in your capital: development there grows your culture's innovations too.</li></ul>`},
{id:'succ',title:'Succession without tears',blurb:'Stop your realm splitting on death.',body:`
<ul class="mech"><li><b>Partition</b> splits everything. Every son (or child) gets a share, and heirs with same-tier titles become independent.</li>
<li>Switch to <b>High Partition</b> as soon as your culture has the innovation: the primary heir always gets at least half.</li>
<li>Get <b>Single Heir</b> (Primogeniture) in the High Medieval era with enough crown authority.</li>
<li>Until then: have fewer children, put extra children into the clergy or holy orders, marry daughters away matrilineally or not, <b>destroy</b> extra titles of your primary tier you don't need, or <b>give lesser titles to your primary heir</b> while you're alive.</li>
<li><b>Disinherit</b> a bad child (costs prestige/dread and opinion), or let a scheme handle it.</li>
<li>Elective laws let you pick the best candidate, but you need the electors' votes.</li></ul>
<div class="tip">Play with the <a href="#succession">simulator</a> before your ruler gets old.</div>`},
{id:'war',title:'How to win wars',blurb:'Men-at-arms, knights, commanders, terrain and war score.',body:`
<ul class="mech"><li>An army is <b>levies</b> (cheap, weak), <b>men-at-arms</b> (expensive, strong), and <b>knights</b> (your best fighters).</li>
<li>The <b>commander</b>'s Martial gives battle advantage. Brave, high-martial commanders with commander traits (Logistician, Reaver, Unyielding...) are best.</li>
<li><b>Terrain</b> matters: defenders on hills and mountains gain advantage, attacking across a river or from the sea loses it. Heavy cavalry hate forests and hills.</li>
<li><b>Supply</b> runs out in large armies in poor land. Split into smaller stacks and gather before battle.</li>
<li><b>War score</b>: battles, sieges and holding the war's target. At 100% you can force the peace.</li>
<li>Siege weapons make sieges far faster. Hire mercenaries or holy orders when you need more men fast.</li>
<li>Allies: marry into powerful families. Call them in with the war's "Call allies" button.</li></ul>
<div class="tip">See the <a href="#maa">Men-at-arms counter finder</a> before your next war.</div>`},
{id:'intrigue',title:'Schemes, secrets and hooks',blurb:'The quiet way to win.',body:`
<ul class="mech"><li>Put your <b>Spymaster</b> on Find Secrets in your own court and your vassals' courts. Every secret is a potential hook.</li>
<li><b>Strong hooks</b> come from criminal secrets: blackmail that never runs out. Use them to make vassals accept anything.</li>
<li><b>Murder</b> clears bad heirs and rivals. Recruit agents (people with opinion of you or hooks), and raise success chance before launching.</li>
<li>Getting caught creates a secret on <i>you</i>. Keep your own spymaster on Disrupt Schemes.</li>
<li>Seduce and Romance give hooks and children; Befriend and Sway build love.</li></ul>`},
{id:'faith',title:'Faith, holy wars and reformation',blurb:'Piety, crusades and making your own religion.',body:`
<ul class="mech"><li>Piety comes from pious acts, temples, the Theology tree and some traits.</li>
<li><b>Holy wars</b> take land from other faiths. The head of faith can call a <b>Great Holy War</b> (crusade or jihad) for a whole kingdom.</li>
<li>Pagan faiths can be <b>reformed</b>: hold enough of your holy sites (usually three) and pay the piety, then pick doctrines and tenets ○.</li>
<li>Any faith can spawn a new one: <b>Create a new faith</b> (a heresy) if you're a big enough ruler with enough piety, and change its doctrines.</li>
<li>Your court chaplain converts counties. Holy sites and faith fervour make conversion faster.</li></ul>
<div class="tip">See <a href="#faith">Faith</a> for doctrines and tenets worth picking.</div>`},
{id:'culture',title:'Culture, innovations and eras',blurb:'Tech, traditions and new cultures.',body:`
<ul class="mech"><li>Each culture researches <b>innovations</b> on its own. Development in that culture's counties and the culture head's Learning speed it up.</li>
<li>The culture head picks a <b>fascination</b>: the innovation research focuses on.</li>
<li>Cultures have pillars (ethos, heritage, language, martial custom) and <b>traditions</b> that give bonuses.</li>
<li>With enough acceptance you can <b>hybridise</b> two cultures, or <b>diverge</b> into a new one with your pick of traditions (Royal Court) ○.</li>
<li>Your steward can promote your culture in a county; the county slowly converts.</li></ul>`},
{id:'dynasty',title:'Dynasty and house',blurb:'Renown, legacies and cadet branches.',body:`
<ul class="mech"><li>Your <b>dynasty</b> earns renown from its members' titles and deeds. Spend it on <b>legacies</b> (permanent dynasty-wide perks).</li>
<li>A <b>house</b> is a branch of the dynasty. Big landed relatives can found <b>cadet branches</b>.</li>
<li>The house and dynasty heads have powers over members: disinherit, denounce, legitimise bastards, and call on family ○.</li>
<li>Marry your children to rulers and get your dynasty onto as many thrones as you can: if you die without a landed heir, you continue as a landed dynasty member.</li></ul>`},
{id:'stress',title:'Stress and mental health',blurb:'Why your king went mad.',body:`
<ul class="mech"><li>Acting against your <b>personality</b> builds stress: a Compassionate ruler executing someone, a Shy one hosting a feast.</li>
<li>Stress breaks at <b>100, 200 and 300</b>. Each break forces a coping choice, often a new trait.</li>
<li>Lose stress with activities (feasts, hunts, pilgrimages), friends and lovers, the Calm trait, Learning Medicine perks, and good coping traits like <b>Athletic</b> and <b>Journaller</b>.</li>
<li>Play in character: most event options that fit your traits reduce stress.</li></ul>
<div class="tip">Try the <a href="#stress">stress calculator</a> and the trait conflict checker on <a href="#traits">Traits</a>.</div>`},
{id:'marriage',title:'Marriage, alliances and children',blurb:'Politics in the bedchamber.',body:`
<ul class="mech"><li>A marriage gives an <b>alliance</b> with the spouse's liege family (usually), and claims for your children.</li>
<li><b>Matrilineal</b> marriages keep children in the woman's dynasty: use them for daughters who'll rule.</li>
<li>Marry for <b>genetics</b>: Genius, Beautiful and Herculean spouses give you better heirs. See the <a href="#genetics">Genetics planner</a>.</li>
<li>Betrothals lock in a marriage for a child; they become married when of age.</li>
<li>Too many sons under partition shatters your realm. Under single heir, more sons are useful spares.</li></ul>`},
{id:'money',title:'Gold, prestige and piety',blurb:'What to spend on and when.',body:`
<ul class="mech"><li><b>Gold</b>: men-at-arms and their upgrades first, then buildings in your capital, then a war chest.</li>
<li><b>Prestige</b>: wars, creating titles, raising crown authority, hiring knights' accolades, tribal buildings and men-at-arms.</li>
<li><b>Piety</b>: holy wars, faith actions, excommunication requests, reformation.</li>
<li>Don't sit on large amounts. Prestige and piety levels matter, but the points are meant to be spent.</li>
<li>Stewardship and the Wealth tree increase gold; Diplomacy Majesty raises prestige; Learning Theology raises piety.</li></ul>`},
{id:'activities',title:'Travel and activities',blurb:'Feasts, hunts, pilgrimages and tournaments.',body:`
<ul class="mech"><li>Host or attend activities from the Activities button. Each costs gold and time, and gives prestige, piety, stress loss or artifacts.</li>
<li>Travel (Tours & Tournaments) takes time and carries danger. A good Travel Leader and safety options help.</li>
<li>Your knights can win <b>accolades</b> at tournaments, which give bonuses to your army.</li></ul>
<div class="card tbl" style="margin-top:8px"><table><tr><th>Activity</th><th>What it does</th></tr>${ACTS.map(a=>`<tr><td>${mark(a[2])} <b>${a[0]}</b></td><td>${a[1]}</td></tr>`).join('')}</table></div>`},
{id:'tribal',title:'Playing tribal and pagan',blurb:'Raid, conquer, reform.',body:`
<ul class="mech"><li>Tribal rulers pay for buildings and men-at-arms with <b>prestige</b>. Wars are cheap and frequent.</li>
<li><b>Raid</b> neighbours of other faiths for gold and prisoners (Northern Lords adds much more).</li>
<li>Use <b>Subjugation</b> to make whole realms into vassals, and the conquest CBs some cultures get.</li>
<li>Reform your faith once you hold enough holy sites, then switch to feudal or clan government when your culture reaches the right innovations.</li></ul>`},
{id:'admin',title:'Administrative government (Roads to Power)',blurb:'The Byzantine way.',body:`
<ul class="mech"><li>Titles belong to the state: governors are appointed, not inherited. Your <b>noble family</b> keeps its estate and influence.</li>
<li><b>Influence</b> is the currency for appointments and politics.</li>
<li>Themes (provinces) are run by governors who can be moved and replaced.</li>
<li>Rise through the ranks; the throne can go to a powerful family by appointment or coup.</li></ul>
<div class="note">Roads to Power mechanics have been patched several times. Treat details here as ○ and read the in-game encyclopedia.</div>`},
{id:'landless',title:'Landless adventurers (Roads to Power)',blurb:'A camp, a band and a dream.',body:`
<ul class="mech"><li>Play a landless adventurer: a camp with followers and officers, taking contracts from rulers.</li>
<li>Earn gold, prestige and provisions, then claim land of your own with an adventurer's CB.</li>
<li>Good for a fresh start with a younger son, or when you lose your last title.</li></ul>
<div class="note">○ Details vary by patch; the game's tutorials for landless play are worth reading.</div>`},
{id:'steppe',title:'The steppe (Khans of the Steppe)',blurb:'Herds, horses and hordes.',body:`
<ul class="mech"><li>Nomadic rulers move their camps with their <b>herds</b> and use them as a resource.</li>
<li>Horse archers dominate. Subjugate neighbours rather than administer them.</li>
<li>The Mongols in 1178 make for a dramatic game.</li></ul>
<div class="note">○ Written from the DLC's announced features; check the encyclopedia.</div>`},
{id:'ironman',title:'Ironman and achievements',blurb:'Rules and tips.',body:`
<ul class="mech"><li>Achievements need <b>Ironman</b> on (set when starting a game), with a checksum-compatible game (mods that change it disable achievements).</li>
<li>The console is disabled in Ironman.</li>
<li>Save in Ironman means autosave only: think before you click.</li>
<li>Many achievements need a specific start date or character. Read the condition before you start.</li></ul>`},
{id:'mistakes',title:'Common mistakes',blurb:'What new players get wrong.',body:`<div class="tbl"><table>${MISTAKES.map(m=>`<tr><td style="width:240px"><b>${m[0]}</b></td><td>${m[1]}</td></tr>`).join('')}</table></div>`}

    const both=a&&b,bl=+G.blood;let w=both?'Very likely':'Possible';let pct=both?80:35;if(good)pct+=bl>=2?10:0;else pct-=bl>=3?10:0;pct=Math.max(5,Math.min(95,pct));
    if(!both&&pct<30)w='Unlikely';
    const tierNote=(a&&b&&a.tiered&&a.lvl!==b.lvl)?` Most likely between ${GENS.find(x=>x.g===g&&x.lvl===Math.min(a.lvl,b.lvl)).t} and ${GENS.find(x=>x.g===g&&x.lvl===Math.max(a.lvl,b.lvl)).t}.`:'';
    return `<tr><td><b>${esc(g)}</b> <span class="tag ${good?'w':'r'}">${good?'good':'bad'}</span></td><td>${a?esc(a.t):'<span class="dim">—</span>'}</td><td>${b?esc(b.t):'<span class="dim">—</span>'}</td><td><div class="meter" style="width:140px;margin:2px 0"><i style="width:${pct}%;background:${good?'#8fcf7a':'#ff7a6b'}"></i></div><span class="${good?'ok':'bad'}">${w}</span> <span class="dim">(~${pct}% ○)</span>${tierNote}</td></tr>`;});

/* ================= SUCCESSION SIMULATOR ================= */
const LAWOPT=[['conf','Confederate Partition'],['part','Partition'],['high','High Partition'],['single','Single Heir (Primogeniture)'],['elect','Elective']];
const PRESETS=[
['Irish king (default)',[{n:'Kingdom of Ireland',t:3},{n:'Duchy of Munster',t:2},{n:'Duchy of Leinster',t:2},{n:'County of Desmond',t:1},{n:'County of Thomond',t:1},{n:'County of Ormond',t:1},{n:'County of Dublin',t:1}]],
['Duke with spare counties',[{n:'Duchy of Normandy',t:2},{n:'County of Rouen',t:1},{n:'County of Caux',t:1},{n:'County of Évreux',t:1},{n:'County of Bayeux',t:1}]],
['King of two kingdoms',[{n:'Kingdom of England',t:3},{n:'Kingdom of Scotland',t:3},{n:'Duchy of Wessex',t:2},{n:'Duchy of Lothian',t:2},{n:'County of Middlesex',t:1},{n:'County of Lothian',t:1},{n:'County of Somerset',t:1}]],
['Emperor',[{n:'Empire of Britannia',t:4},{n:'Kingdom of England',t:3},{n:'Kingdom of Ireland',t:3},{n:'Duchy of Wessex',t:2},{n:'Duchy of Munster',t:2},{n:'County of Middlesex',t:1},{n:'County of Desmond',t:1},{n:'County of Dublin',t:1}]]];
function simulate(law,nh,titles){
  const ts=titles.map((t,i)=>({...t,i})).filter(t=>t.n.trim()).sort((a,b)=>b.t-a.t||a.i-b.i);
  const heirs=Array.from({length:Math.max(1,nh)},()=>[]);if(!ts.length)return {heirs,ts};
  heirs[0].push(ts[0]);const rest=ts.slice(1);
  if(law==='single'||law==='elect'||nh<=1){heirs[0].push(...rest);return {heirs,ts};}
  if(law==='high'){const need=Math.ceil(ts.length/2);while(heirs[0].length<need&&rest.length)heirs[0].push(rest.shift());}
  // Even split: each title (highest tier first) to the heir with the fewest titles; ties go to the elder child.
  for(const t of rest){let best=law==='high'?1:0;for(let h=0;h<heirs.length;h++){if(law==='high'&&h===0)continue;if(heirs[h].length<heirs[best].length)best=h;}heirs[best].push(t);}
  return {heirs,ts};}
function pgSuccession(){const C=S.succ;return `<h2>Succession simulator</h2><p class="sub">Enter your titles and number of eligible children to see how your realm will divide when you die. Your primary title is the first one of the highest tier.</p>
<div class="card"><div class="row"><label>Law <select id="slaw">${LAWOPT.map(([k,n])=>`<option value="${k}"${C.law===k?' selected':''}>${n}</option>`).join('')}</select></label><label>Eligible children <input type="number" id="sheirs" min="1" max="10" value="${C.heirs}" style="width:70px"></label>
<label>Preset <select id="spre"><option value="">—</option>${PRESETS.map((p,i)=>`<option value="${i}">${esc(p[0])}</option>`).join('')}</select></label></div>
<div class="tbl"><table id="stit"><tr><th>Title</th><th>Tier</th><th></th></tr>${C.titles.map((t,i)=>`<tr><td><input type="text" data-tn="${i}" value="${esc(t.n)}" style="width:240px"></td><td><select data-tt="${i}">${[4,3,2,1].map(k=>`<option value="${k}"${t.t===k?' selected':''}>${TIERN[k]}</option>`).join('')}</select></td><td><button data-tdel="${i}" title="Remove">✕</button></td></tr>`).join('')}</table></div>
<div class="row"><button id="sadd">+ Add title</button><span class="dim">Only list titles you hold yourself. Vassals' titles don't pass to your children.</span></div></div>
<div id="sout"></div>
<h3>Succession laws</h3><div class="card tbl"><table><tr><th>Law</th><th>How it works</th><th>Needs</th></tr>${SUCC.map(s=>`<tr><td>${mark(s.conf)} <b>${esc(s.n)}</b></td><td>${esc(s.d)}</td><td class="dim">${esc(s.req)}</td></tr>`).join('')}</table></div>
<h3>Gender law</h3><div class="card tbl"><table>${GENDER.map(g=>`<tr><td style="width:240px"><b>${g[0]}</b></td><td>${g[1]}</td></tr>`).join('')}</table></div>
<div class="tip"><b>Beating partition</b><ul class="mech" style="margin:4px 0 0"><li>Have fewer eligible children, or send extras into the clergy or a holy order (they can't inherit).</li><li>Give titles to your primary heir while you're alive: they keep them.</li><li><b>Destroy</b> extra titles of your primary tier you don't need (Titles screen) so they can't be handed out.</li><li>Change to High Partition or Single Heir the moment you can.</li><li>Disinherit a child (prestige and opinion cost) or plan an "accident".</li></ul></div>
<div class="note">The simulator splits titles as evenly as possible, highest tier first, as Partition aims to. The game's real algorithm also weighs de jure ties and keeps titles near each other, so its split can differ ○. Heirs who get a title of your primary tier become independent; the rest become vassals of the primary heir.</div>`;}
function succWire(){const C=S.succ;
  const draw=()=>{const {heirs,ts}=simulate(C.law,+C.heirs||1,C.titles);if(!ts.length){$('sout').innerHTML='<div class="dim">Add a title.</div>';return;}
    const top=ts[0].t,counties=ts.filter(t=>t.t===1).length,kept=heirs[0].filter(t=>t.t===1).length;
    const indep=heirs.slice(1).filter(h=>h.some(t=>t.t===top)).length;
    $('sout').innerHTML=`${C.law==='elect'?'<div class="note">Under an elective law everything goes to one winner chosen by electors. Your preferred candidate needs their votes: check the title\'s Succession tab ○.</div>':''}
<div class="stats"><div class="stat"><small>Primary heir keeps</small><span class="big">${heirs[0].length} / ${ts.length}</span></div><div class="stat"><small>Counties kept</small><span class="big ${kept<counties/2?'bad':''}">${kept} / ${counties}</span></div><div class="stat"><small>New independent realms</small><span class="big ${indep?'bad':'ok'}">${indep}</span></div><div class="stat"><small>Siblings as vassals</small><span class="big">${heirs.slice(1).filter(h=>h.length&&!h.some(t=>t.t===top)).length}</span></div></div>
<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">${heirs.map((h,i)=>{const ind=i>0&&h.some(t=>t.t===top);return `<div class="heir ${i?'':'p'}"><h4>${i?'Child '+(i+1):'Primary heir'} ${i?(h.length?(ind?'<span class="tag r">independent</span>':'<span class="tag g">vassal of the heir</span>'):'<span class="tag">nothing</span>'):'<span class="tag w">gets your primary title</span>'}</h4>${h.map(t=>`<div>${tierTag(t.t)}${esc(t.n)}</div>`).join('')||'<div class="dim">—</div>'}</div>`;}).join('')}</div>`;};
  $('slaw').onchange=e=>{C.law=e.target.value;save();draw();};
  $('sheirs').oninput=e=>{C.heirs=Math.max(1,Math.min(10,+e.target.value||1));save();draw();};
  $('spre').onchange=e=>{if(e.target.value==='')return;C.titles=PRESETS[+e.target.value][1].map(t=>({...t}));save();route(true);};
  document.querySelectorAll('[data-tn]').forEach(i=>i.oninput=()=>{C.titles[+i.dataset.tn].n=i.value;save();draw();});
  document.querySelectorAll('[data-tt]').forEach(s=>s.onchange=()=>{C.titles[+s.dataset.tt].t=+s.value;save();draw();});
  document.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=()=>{C.titles.splice(+b.dataset.tdel,1);save();route(true);});
  $('sadd').onclick=()=>{C.titles.push({n:'New county',t:1});save();route(true);};
  draw();}

<li>Each doctrine and tenet has a piety cost; changing many at once gets expensive.</li>
<li>Popular for a strong dynasty: <b>Unrestricted consanguinity</b> with a Blood legacy, <b>Communion</b> for piety, <b>Pursuit of Power</b> or <b>Armed Pilgrimages</b> for war ○.</li></ul></div>
<h3>Holy wars and excommunication</h3><div class="card"><ul class="mech"><li>Holy wars cost piety and need a target of another faith; the hostility between faiths sets the cost.</li><li>The head of a spiritual faith can call a <b>Great Holy War</b> against a kingdom.</li><li>The head of faith can <b>excommunicate</b> a ruler of the faith: anyone can then holy-war them.</li><li><b>Fervour</b> falls as heresies and other faiths grow; low fervour makes conversions to a heresy more likely.</li></ul></div>
<div class="note">Chapter V's <i>By God Alone</i> is announced to rework religion in 2026. If you have it, some of this may have changed ○.</div>`;}

function pgCulture(){return `<h2>Culture</h2><p class="sub">Every culture has pillars and traditions, and researches innovations on its own.</p>
<h3>Pillars</h3><div class="card"><ul class="mech"><li><b>Ethos</b>: the culture's broad character (below).</li><li><b>Heritage</b>: its family of cultures (Frankish, Iberian, North Germanic...). Same heritage means easy acceptance.</li><li><b>Language</b>: shared language helps diplomacy and acceptance.</li><li><b>Martial custom</b>: who can be knights and commanders (men, women or both).</li></ul></div>
<h3>Ethos</h3><div class="card tbl"><table>${ETHOS.map(e=>`<tr><td style="width:140px"><b>${e[0]}</b></td><td>${e[1]}</td></tr>`).join('')}</table></div>
<h3>Some traditions</h3><div class="card tbl"><table>${TRAD.map(t=>`<tr><td style="width:190px"><b>${t[0]}</b></td><td>${t[1]} ${mark(false)}</td></tr>`).join('')}</table></div>
<h3>Eras and innovations</h3><div class="card tbl"><table><tr><th>Era</th><th>What it's like</th><th>Landmark innovations</th></tr>${ERAS.map(e=>`<tr><td><b>${e[0]}</b></td><td>${e[1]}</td><td class="dim">${e[2]} ${mark(false)}</td></tr>`).join('')}</table></div>
<div class="tip"><ul class="mech" style="margin:0"><li>Raise development in your culture's counties to speed innovations.</li><li>The culture head (the highest-tier ruler of the culture) picks the fascination; a high-Learning head helps everyone.</li><li><b>Hybridise</b> with a culture you have high acceptance with, or <b>diverge</b> to rewrite your traditions (Royal Court) ○.</li><li>Your steward can <b>promote culture</b> in a county to convert it.</li></ul></div>`;}

function pgDynasty(){const lg=Object.values(S.legacy).filter(Boolean).length;
  return `<h2>Dynasty legacies</h2><p class="sub">Your dynasty earns <b>renown</b> from every landed member. Spend it on legacies: each track has five perks bought in order. Tick the ones your dynasty has.</p>
<div class="dim">${lg} of ${LEGACY.length*5} perks</div><div class="bar"><i style="width:${lg/(LEGACY.length*5)*100}%"></i></div>
<div class="tree">${LEGACY.map(([n,d])=>`<div class="card" style="margin:0"><h3 style="margin-top:0">${n}</h3><p class="dim" style="margin:0 0 8px">${d}</p><div class="lvl">${[1,2,3,4,5].map(i=>`<label><input type="checkbox" data-lg="${n}:${i}"${S.legacy[n+':'+i]?' checked':''}> ${i}</label>`).join('')}</div></div>`).join('')}</div>
<div class="tip" style="margin-top:14px"><ul class="mech" style="margin:0"><li><b>Blood</b> is a favourite: better genes for every generation.</li><li><b>Law</b> helps with crown authority and vassals; <b>Kin</b> keeps family loyal.</li><li>Renown grows faster with more landed dynasty members, especially kings and emperors.</li><li>Cost rises with each perk you buy ○.</li></ul></div>
<h3>House and dynasty heads</h3><div class="card"><ul class="mech"><li>The dynasty head can use dynasty powers on members: disinherit, denounce, legitimise bastards, and ask for support ○.</li><li>House heads lead a branch. Big cadet branches can become rivals.</li><li>Plant your dynasty on many thrones. If your line fails, you continue as another landed member.</li></ul></div>
<div class="note">DLC and patches added extra legacy tracks for some cultures and expansions ○; the seven here are the base set.</div>`;}

function pgDlc(){return `<h2>DLC guide</h2><p class="sub">What each piece adds and whether it's worth it. The base game is complete on its own.</p>
<div class="card tbl"><table><tr><th>DLC</th><th>Year</th><th>Kind</th><th>What it adds</th><th>Worth it?</th></tr>${DLC.map(d=>`<tr><td>${mark(d.conf)} <b>${esc(d.n)}</b></td><td>${d.y}</td><td>${esc(d.k)}</td><td>${esc(d.d)}</td><td class="dim">${esc(d.buy)}</td></tr>`).join('')}</table></div>
<div class="tip">If you buy one: <b>The Royal Court</b>. Two: add <b>Tours & Tournaments</b>. Then pick by where you play: <b>Roads to Power</b> for Byzantium, <b>Northern Lords</b> for Vikings, the struggle packs for Iberia and Persia.</div>
<div class="note">Release years are approximate for some packs, and 2025–26 content is marked ○. Cosmetic packs (clothing and music) aren't listed. Paradox retires older expansion passes from sale from time to time.</div>`;}

/* ================= YOUR GAME ================= */
const GOALSUG=['Unite my de jure kingdom','Switch to High Partition','Get Single Heir succession','Raise crown authority to High','Reform my faith','Hold all my faith\'s holy sites','Get a Genius heir','Hybridise or diverge my culture','Become an emperor','Restore the Roman Empire','Reach the Late Medieval era','Buy every Blood legacy perk','Survive to 1453'];
function pgCampaign(){const g=S.game,done=S.goals.filter(x=>x.done).length;
  return `<h2>Campaign and goals</h2><p class="sub">Keep track of your current game and what you're aiming for.</p>
<div class="card"><div class="row"><label>Start date <select id="gs">${['','867','1066','1178','Custom'].map(y=>`<option${g.start===y?' selected':''}>${y}</option>`).join('')}</select></label>
<label>Character <input type="text" id="gc" value="${esc(g.char)}" style="width:180px" placeholder="e.g. Murchad"></label>
<label>Dynasty <input type="text" id="gd" value="${esc(g.dyn)}" style="width:150px" placeholder="e.g. Uí Briain"></label>
<label>Year <input type="number" id="gy" value="${esc(g.year)}" style="width:90px"></label>
<label class="chk" style="margin:0"><input type="checkbox" id="gi"${g.iron?' checked':''}> Ironman</label></div></div>
<h3>Goals</h3><div class="dim" id="gdone">${done} of ${S.goals.length} done</div><div class="bar"><i id="gbar" style="width:${S.goals.length?done/S.goals.length*100:0}%"></i></div>
<div class="card"><form class="row" id="gf"><input type="text" id="gn" style="width:300px" placeholder="A goal, e.g. Form the Kingdom of Ireland"><button class="pri">Add</button></form>
<div class="chips">${GOALSUG.map((s,i)=>`<button type="button" data-gsug="${i}">+ ${esc(s)}</button>`).join('')}</div>
${S.goals.map((x,i)=>`<div class="row"><label class="chk" style="flex:1;margin:0"><input type="checkbox" data-gdone="${i}"${x.done?' checked':''}> <span class="${x.done?'dim':''}">${esc(x.n)}</span></label><button data-gdel="${i}" title="Remove">✕</button></div>`).join('')||'<div class="dim">No goals yet.</div>'}</div>
${S.goals.length?'<button id="gclear">Remove finished goals</button>':''}`;}
function campWire(){const g=S.game;
  $('gs').onchange=e=>{g.start=e.target.value;save();};$('gc').oninput=e=>{g.char=e.target.value;save();};$('gd').oninput=e=>{g.dyn=e.target.value;save();};$('gy').oninput=e=>{g.year=e.target.value;save();};$('gi').onchange=e=>{g.iron=e.target.checked;save();};
  $('gf').onsubmit=e=>{e.preventDefault();const n=$('gn').value.trim();if(!n)return;S.goals.push({n,done:false});save();route(true);};
  document.querySelectorAll('[data-gsug]').forEach(b=>b.onclick=()=>{S.goals.push({n:GOALSUG[+b.dataset.gsug],done:false});save();route(true);});
  document.querySelectorAll('[data-gdone]').forEach(c=>c.onchange=()=>{S.goals[+c.dataset.gdone].done=c.checked;save();route(true);});
  document.querySelectorAll('[data-gdel]').forEach(b=>b.onclick=()=>{S.goals.splice(+b.dataset.gdel,1);save();route(true);});
  if($('gclear'))$('gclear').onclick=()=>{S.goals=S.goals.filter(x=>!x.done);save();route(true);};}

function pgChronicle(){const R=S.rulers,yrs=R.reduce((s,r)=>s+(+r.to&&+r.from?Math.max(0,r.to-r.from):0),0);
  return `<h2>Dynasty chronicle</h2><p class="sub">A record of every ruler you've played. Add each heir when they take over.</p>
<div class="stats"><div class="stat"><small>Rulers</small><span class="big">${R.length}</span></div><div class="stat"><small>Years recorded</small><span class="big">${yrs}</span></div><div class="stat"><small>Average reign</small><span class="big">${R.filter(r=>+r.to&&+r.from).length?Math.round(yrs/R.filter(r=>+r.to&&+r.from).length):'—'}</span></div></div>
<div class="card"><form class="row" id="rf"><input type="text" id="rn" style="width:170px" placeholder="Name (e.g. Brian II)"><input type="text" id="rt" style="width:170px" placeholder="Title (e.g. King of Ireland)"><input type="number" id="ra" style="width:90px" placeholder="From" value="${R.length&&R[R.length-1].to?esc(R[R.length-1].to):''}"><input type="number" id="rb" style="width:90px" placeholder="To"><button class="pri">Add ruler</button></form></div>
<div class="card tbl"><table><tr><th>#</th><th>Ruler</th><th>Title</th><th>From</th><th>To</th><th>Traits, deeds, how they died</th><th></th></tr>${R.map((r,i)=>`<tr><td class="dim">${i+1}</td><td><input type="text" data-re="${i}:n" value="${esc(r.n)}" style="width:140px"></td><td><input type="text" data-re="${i}:t" value="${esc(r.t)}" style="width:150px"></td><td><input type="number" data-re="${i}:from" value="${esc(r.from)}" style="width:80px"></td><td><input type="number" data-re="${i}:to" value="${esc(r.to)}" style="width:80px"></td><td><input type="text" data-re="${i}:d" value="${esc(r.d||'')}" style="width:260px" placeholder="Genius, Conqueror; murdered by his brother"></td><td><button data-rdel="${i}" title="Remove">✕</button></td></tr>`).join('')||'<tr><td colspan="7" class="dim">No rulers yet. Start with the character you picked.</td></tr>'}</table></div>`;}
function chronWire(){
  $('rf').onsubmit=e=>{e.preventDefault();const n=$('rn').value.trim();if(!n)return;S.rulers.push({n,t:$('rt').value.trim(),from:$('ra').value,to:$('rb').value,d:''});save();route(true);};
  document.querySelectorAll('[data-re]').forEach(i=>i.oninput=()=>{const [ix,k]=i.dataset.re.split(':');S.rulers[+ix][k]=i.value;save();});
  document.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=()=>{if(confirm('Remove '+S.rulers[+b.dataset.rdel].n+' from the chronicle?')){S.rulers.splice(+b.dataset.rdel,1);save();route(true);}});}

function pgConsole(){return `<h2>Console commands</h2><p class="sub">For testing, fixing a broken save, or just having fun. Not available in Ironman, and they turn off achievements for that game.</p>
<div class="card"><ol class="mech"><li>In Steam: right-click Crusader Kings III → Properties → Launch options, and type <code>-debug_mode</code>. (Other launchers have a similar launch-options box.)</li><li>Start the game and load a non-Ironman save.</li><li>Press <kbd>\`</kbd> or <kbd>~</kbd> (the key under Esc) to open the console. Type <code>help</code> for every command in your version.</li><li>Debug mode also shows character and title IDs in tooltips.</li></ol></div>
<div class="card tbl"><table><tr><th>Command</th><th>What it does</th><th></th></tr>${CONSOLE.map(c=>`<tr><td>${mark(c[2])} <code>${esc(c[0])}</code></td><td>${esc(c[1])}</td><td><button data-copy="${esc(c[0])}" title="Copy">Copy</button></td></tr>`).join('')}</table></div>
<h3>Trait keys</h3><div class="card tbl"><table>${TRAITKEYS.map(t=>`<tr><td style="width:220px"><b>${t[0]}</b></td><td><code>${esc(t[1])}</code></td></tr>`).join('')}</table></div>
<div class="note">Command names have changed in a few patches. If one doesn't work, <code>help</code> lists the current ones, and <code>effect</code> runs any script effect by its game name.</div>`;}
function consoleWire(){document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{try{navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200);}catch(e){}});}

function pgNotes(){return `<h2>My Notes</h2><p class="sub">Saved automatically on this device.</p><textarea id="nt" style="width:100%;height:60vh" placeholder="Who to murder, which cousin to marry, the claim you're fabricating, the duchy you'll create next...">${esc(S.notes)}</textarea>`;}

/* ================= ROUTER ================= */
function route(keepScroll){
  const [pg,sub]=(location.hash.slice(1)||'home').split('/');
  const page=REAL.some(p=>p[0]===pg)?pg:'home';
  buildNav(page);
  const m=$('main'),top=m.scrollTop;
  m.innerHTML=({home:pgHome,guides:()=>pgGuides(sub),starts:pgStarts,regions:()=>pgRegions(sub),glossary:pgGlossary,traits:pgTraits,lifestyles:pgLifestyles,education:pgEducation,stress:pgStress,genetics:pgGenetics,succession:pgSuccession,laws:pgLaws,council:pgCouncil,intrigue:pgIntrigue,holdings:pgHoldings,warfare:pgWarfare,maa:pgMaa,faith:pgFaith,culture:pgCulture,dynasty:pgDynasty,dlc:pgDlc,campaign:pgCampaign,chronicle:pgChronicle,console:pgConsole,notes:pgNotes})[page]();
  m.scrollTop=keepScroll===true?top:0;
  m.querySelectorAll('input[type=checkbox][data-k]').forEach(cb=>{cb.checked=!!S.checks[cb.dataset.k];cb.onchange=()=>{S.checks[cb.dataset.k]=cb.checked;save();};});
  m.querySelectorAll('input[type=checkbox][data-lg]').forEach(cb=>{cb.onchange=()=>{S.legacy[cb.dataset.lg]=cb.checked;save();route(true);};});
  if(page==='starts')startsWire();
  if(page==='glossary')glossWire();
  if(page==='traits')traitsWire();
  if(page==='stress')stressWire();
  if(page==='genetics')genWire();
  if(page==='succession')succWire();
  if(page==='maa')maaWire();
  if(page==='campaign')campWire();
  if(page==='chronicle')chronWire();
  if(page==='console')consoleWire();
  if(page==='notes')$('nt').oninput=e=>{S.notes=e.target.value;save();};
}
window.addEventListener('hashchange',()=>route());
route();
</script>
</body>
</html>
