<style>
:root{--bg:#120e0b;--panel:#1c1611;--panel2:#271e17;--line:#3e3024;--tx:#f0e6d8;--dim:#ab9a86;--acc:#d9a441;--acc-ink:#2a1700;--acc2:#e7a07a;--ok:#8fcf7a;--warn:#f2c14e;--err:#ff7a6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
#app{display:flex;height:100vh}
#nav{width:210px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
#nav h1{font-size:15px;margin:4px 8px 12px;color:var(--acc);letter-spacing:.5px}

#nav a:hover{background:var(--panel2)}
#nav a.home{color:var(--dim);font-size:13px}
#nav a.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
#main{flex:1;overflow:auto;padding:20px 24px}
h2{margin:0 0 4px;font-size:22px}
h3{margin:18px 0 6px;color:var(--acc2);font-size:16px}
p.sub{color:var(--dim);margin:0 0 16px}
a{color:var(--acc2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.tile:hover{border-color:var(--acc)}
.tile b{color:var(--acc)}
@media(max-width:760px){#app{flex-direction:column;height:auto;min-height:100vh}#nav{width:auto;display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}#nav h1{width:100%}#main{padding:16px}}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
input,select,textarea{background:#0b0806;border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
input[type=text],input[type=number]{width:130px}
input[type=checkbox]{width:auto}
table{border-collapse:collapse;width:100%}
td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:600}
.tbl{overflow-x:auto}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--panel2);color:var(--dim);margin-left:6px}
.note{border-left:3px solid var(--warn);background:#2a2419;padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;color:#eadca6}
.tip{border-left:3px solid var(--acc);background:var(--panel2);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.ok{color:var(--ok)}.bad{color:var(--err)}.dim{color:var(--dim)}
label.chk{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.conf{color:var(--ok)}.unv{color:var(--warn)}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--acc)}
a.mob{font-weight:600;color:var(--acc);text-decoration:none;cursor:pointer}
a.mob:hover{text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat small{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.mech li{margin:4px 0}
.attr{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.attr:last-child{border-bottom:0}
.attr .pips{display:flex;gap:2px;flex-wrap:wrap}
.attr .pips i{width:12px;height:14px;border-radius:2px;background:var(--panel2);border:1px solid var(--line)}
.attr .pips i.f{background:var(--acc);border-color:var(--acc)}
.attr .pips i.m{margin-right:6px}
.attr .ctl{display:flex;gap:4px;align-items:center}

.wheel{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}

const GUIDES=[
{id:'firstday',title:'Your first day',blurb:'Water, tools, a bedroll and a roof.',body:`
<p>You wake up crucified in the southern desert. Conan cuts you down. From here everything is about the river to the north.</p>
<label class="chk"><input type="checkbox" data-k="f1"> Pick up stones, branches and plant fibre on the way north. Press the gather key to grab them by hand.</label>
<label class="chk"><input type="checkbox" data-k="f2"> Reach the river and drink. Eat bugs from bushes and berries until you can cook meat.</label>
<label class="chk"><input type="checkbox" data-k="f3"> Open the Journey (it\'s in the inventory screen). Its steps hand out XP and tell you what to do next.</label>
<label class="chk"><input type="checkbox" data-k="f4"> Craft a stone hatchet and stone pickaxe, then a waterskin.</label>
<label class="chk"><input type="checkbox" data-k="f5"> Spend feat points on the Survival and Building feats first.</label>
<label class="chk"><input type="checkbox" data-k="f6"> Build a bedroll: it\'s your respawn point.</label>
<label class="chk"><input type="checkbox" data-k="f7"> Craft hide or fibre armour. Naked, the desert sun and the first enemies will kill you.</label>
<label class="chk"><input type="checkbox" data-k="f8"> Put up a small sandstone hut with a door before night.</label>
<div class="tip">When you die you drop everything. Run back to your body to pick it up before it vanishes, and keep spare tools in a chest at home.</div>`},
{id:'combat',title:'How combat works',blurb:'Light and heavy combos, stamina, dodging.',body:`
<ul class="mech"><li>Each weapon type has its own combo of light and heavy attacks. Mix them: the last hit of a combo is usually the strongest.</li>
<li>Attacking, dodging, sprinting and blocking all use stamina. Never empty the bar mid-fight: you can\'t dodge without it.</li>
<li>Dodge rolls have a little invulnerability. Roll through big swings, not away from them.</li>
<li>Your encumbrance decides how you roll. Heavy armour plus a full pack means a slow, short roll.</li>
<li>Weapons can cause <b>bleed</b>, <b>poison</b>, <b>sunder</b> (lowers armour) and <b>concussive</b> damage (knocks people out).</li>
<li>Strength weapons: swords, axes, maces, greatswords. Agility weapons: daggers, spears, bows, javelins.</li>
<li>Shields block arrows and soften melee hits but slow you down.</li></ul>
<div class="tip">Fight one enemy at a time. Pull a single NPC away from its camp with an arrow, then deal with the rest.</div>`},
{id:'building',title:'Building a base',blurb:'Foundations, stability, tiers and decay.',body:`
<ul class="mech"><li>Start on foundations. They level out rough ground and carry the rest of the building.</li>
<li>Every piece has <b>stability</b>. The further a piece is from a foundation or pillar, the less stable it is. Build pillars to go higher or wider.</li>
<li>Building tiers: <b>Tier 1</b> sandstone, <b>Tier 2</b> insulated wood or brick, <b>Tier 3</b> hardened brick and reinforced wood. Higher tiers resist more damage.</li>
<li>Buildings decay if you stay away too long. Logging in near your base resets the timer.</li>
<li>Your buildings claim the land around them, which stops other players building there and also stops many resources respawning there.</li>
<li>Rivers, mountain shelves and narrow valleys make the strongest base spots.</li></ul>
<div class="tip">Put workbenches where you can walk between them without stairs. You\'ll make that trip thousands of times.</div>`},
{id:'thralls',title:'Taking thralls',blurb:'Knock out, bind, drag, break.',body:`
<ol class="mech"><li>Craft a <b>truncheon</b> (concussive damage) and <b>bindings</b>.</li>
<li>Pull one NPC away from its camp. Hit it with the truncheon until it falls unconscious. Normal weapons kill instead.</li>
<li>Use the bindings on the body and drag it home. Running uses stamina, so watch your bar.</li>
<li>Put the thrall on a <b>Wheel of Pain</b> with food in the wheel. Gruel is the usual choice.</li>
<li>Wait. A taskmaster on the wheel speeds it up. Track wheels on the <a href="#wheel">Wheel of Pain</a> page.</li>
<li>Take the thrall out of the wheel\'s inventory and place it at a bench, an altar, or have it follow you.</li></ol>
<div class="note">A thrall unconscious too long wakes up. Hit it again with the truncheon on the way home if you need to.</div>
<div class="tip">The Lesser Wheel takes one thrall, the Wheel of Pain four and the Greater Wheel eight. Build a bigger wheel as soon as you can.</div>`},
{id:'followers',title:'Followers and pets',blurb:'Levelling your fighter.',body:`
<ul class="mech"><li>Fighter and archer thralls level up by fighting. Their stats grow each level, and their perks depend on how they were raised.</li>
<li>Feed them to heal them out of combat. Some foods give them better growth.</li>
<li>Give them the best armour and weapon you can spare. Their gear doesn\'t wear down as fast as yours.</li>
<li>Pets come from animal pens: tame babies with food. They also level up by fighting.</li>
<li>Your Authority boosts followers, unless you take War Party for a second follower.</li>
<li>Set their stance: attack what attacks you, attack anything, or stay passive while you travel.</li></ul>`},
{id:'purge',title:'The Purge',blurb:'NPC raids on your base.',body:`
<p>On servers with the Purge turned on, a meter fills while you play, build and craft. When it is full, an army attacks one of your bases.</p>
<ul class="mech"><li>The size and type of army depend on how big your base is and where it is.</li>

{id:'temp',title:'Heat, cold and thirst',blurb:'Surviving the climate.',body:`

{id:'sorcery',title:'Sorcery and corruption',blurb:'Power at a price.',body:`

{id:'endgame',title:'Endgame',blurb:'Bosses, obelisks and the bracelet.',body:`

<li>Activate obelisks and map rooms as you explore: they become fast-travel points.</li>

<div class="grid">${REGIONS.map(r=>`<div class="tile" onclick="location.hash='regions/${r.id}'"><b>${esc(r.n)}</b><span class="tag">${/^\d/.test(r.lv)?'Lv ':''}${esc(r.lv)}</span><div class="dim">${esc(r.d)}</div></div>`).join('')}</div>`;

function pgDungeons(){return `<h2>Dungeons</h2><p class="sub">Easiest first. The ranking comes from the community, and players disagree about a few (the Midnight Grove most of all).</p>

<h3>Named thralls worth hunting</h3><div class="card tbl"><table><tr><th>Thrall</th><th>Role</th><th>Found</th><th>Why</th></tr>${NAMED.map(n=>`<tr><td>${mark(n.conf)} <b>${esc(n.n)}</b></td><td>${esc(n.k)}</td><td>${esc(n.where)}</td><td>${esc(n.d)}</td></tr>`).join('')}</table></div>`;}

/* ================= WHEEL OF PAIN ================= */
function breakMins(tier,tmBonus,mult){return TIERS[tier-1].base*mult/(1+tmBonus/100);}
function dur(ms){const s=Math.max(0,Math.round(ms/1e3)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+'h ':'')+String(m).padStart(h?2:1,'0')+'m '+String(x).padStart(2,'0')+'s';}
function pgWheel(){const now=Date.now();
  return `<h2>Wheel of Pain</h2><p class="sub">Work out how long a thrall takes to break, and start a timer for each one on your wheels. Timers keep running when you close the page.</p>
<div class="card"><form id="wf">
<div class="row"><label>Thrall <input id="wn" type="text" style="width:200px" placeholder="e.g. Relic Hunter Archer"></label>
<label>Tier <select id="wt">${TIERS.map(t=>`<option value="${t.t}">Tier ${t.t}</option>`).join('')}</select></label>
<label>Taskmaster <select id="wm">${TASKMASTER.map(([n,b])=>`<option value="${b}">${n}${b?` (+${b}%)`:''}</option>`).join('')}</select></label></div>
<div class="row"><label>Wheel <select id="ww">${WHEELS.map(([n,c])=>`<option>${n}</option>`).join('')}</select></label>
<label>Server multiplier <input id="wx" type="number" min="0.05" step="0.05" value="${S.wheelMult}" style="width:80px" title="1 is default; 0.5 is twice as fast"></label>
<label>Already done <input id="wd" type="number" min="0" max="99" value="0" style="width:64px"> %</label>
<button class="pri">Start timer</button></div>
<div class="dim" id="wcalc"></div></form></div>
<h3>On the wheels</h3>
<div id="wl">${S.wheels.length?S.wheels.map((w,i)=>{const left=w.end-now;return `<div class="card wheel"><div><b>${esc(w.n||'Thrall')}</b> <span class="tag">Tier ${w.t}</span> <span class="tag">${esc(w.w)}</span><div class="dim">Started ${new Date(w.start).toLocaleTimeString([], {timeStyle:'short'})} · done at ${new Date(w.end).toLocaleTimeString([], {timeStyle:'short'})}</div><div class="bar" style="width:220px"><i data-wb="${i}" style="width:${Math.min(100,(now-w.start)/(w.end-w.start)*100)}%"></i></div></div>
<div class="row"><span class="t ${left<=0?'ok':''}" data-wt="${i}">${left<=0?'Ready':dur(left)}</span>${left<=0?`<button data-wr="${i}" class="pri">Add to My Thralls</button>`:''}<button data-wdel="${i}" title="Remove">✕</button></div></div>`;}).join(''):'<div class="dim">No thralls on the wheel. Start a timer above.</div>'}</div>
<div class="tip">Wheels need food to keep turning: gruel, or any food the wheel accepts. If a wheel runs out, the timer here keeps going but the thrall doesn't.</div>
<div class="note">Taskmaster bonuses and the 15-minutes-per-tier base come from the wiki. Your server's "thrall conversion" multiplier changes everything, so set it above. Set "Already done" from the wheel's progress bar to sync a timer with a thrall already on the wheel.</div>`;}
let wheelTimer=0;
function wheelWire(){
  const calc=()=>{const t=+$('wt').value,b=+$('wm').value,x=+$('wx').value||1,d=Math.min(99,Math.max(0,+$('wd').value||0));
    const m=breakMins(t,b,x);$('wcalc').innerHTML=`Breaks in <b>${dur(m*6e4)}</b> from scratch${d?`, <b>${dur(m*6e4*(1-d/100))}</b> from ${d}%`:''}.`;};
  ['wt','wm','wx','wd'].forEach(id=>$(id).oninput=calc);calc();
  $('wf').onsubmit=e=>{e.preventDefault();const t=+$('wt').value,b=+$('wm').value,x=+$('wx').value||1,d=Math.min(99,Math.max(0,+$('wd').value||0));
    const total=breakMins(t,b,x)*6e4,now=Date.now();S.wheelMult=x;
    S.wheels.push({n:$('wn').value.trim(),t,w:$('ww').value,start:now-total*d/100,end:now+total*(1-d/100)});save();route();};
  document.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{S.wheels.splice(+b.dataset.wdel,1);save();route();});
  document.querySelectorAll('[data-wr]').forEach(b=>b.onclick=()=>{const w=S.wheels.splice(+b.dataset.wr,1)[0];
    S.roster.push({n:w.n||'Thrall',t:w.t,job:'',where:'',at:Date.now()});save();location.hash='roster';});
  clearInterval(wheelTimer);wheelTimer=setInterval(()=>{
    if(!$('wl')){clearInterval(wheelTimer);return;}
    const now=Date.now();let redraw=false;
    S.wheels.forEach((w,i)=>{const el=document.querySelector(`[data-wt="${i}"]`),bar=document.querySelector(`[data-wb="${i}"]`);if(!el)return;
      if(w.end<=now&&el.textContent!=='Ready'){redraw=true;return;}
      if(w.end>now)el.textContent=dur(w.end-now);if(bar)bar.style.width=Math.min(100,(now-w.start)/(w.end-w.start)*100)+'%';});
    if(redraw)route();},1000);
}

<div class="tile" data-build="auth:20,vit:20,grit:10"><b>Thrall master</b><div class="dim">Authority 20, Vitality 20, Grit 10</div></div>
<div class="tile" data-build="exp:20,vit:15,grit:15"><b>Gatherer and builder</b><div class="dim">Expertise 20, Vitality 15, Grit 15</div></div></div>
<div class="note">Perk names and exact numbers have shifted since Age of Sorcery (3.0). The perks above describe what each step gives; read the in-game tooltip before you commit. Points can be reset with a Potion of Bestial Memory.</div>`;}
function attrWire(){
  document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{const k=b.dataset.ap;if((S.attrs[k]||0)<ATTR_MAX){S.attrs[k]=(S.attrs[k]||0)+1;save();route(true);}});
  document.querySelectorAll('[data-am]').forEach(b=>b.onclick=()=>{const k=b.dataset.am;if((S.attrs[k]||0)>0){S.attrs[k]--;save();route(true);}});
  $('ap').onchange=e=>{S.attrPool=Math.max(0,+e.target.value||0);save();route(true);};
  $('areset').onclick=()=>{S.attrs={};save();route(true);};
  document.querySelectorAll('[data-build]').forEach(t=>t.onclick=()=>{S.attrs={};t.dataset.build.split(',').forEach(p=>{const [k,v]=p.split(':');S.attrs[k]=+v;});save();route(true);});
}

<td><select data-rj="${i}">${JOBS.map(j=>`<option value="${j}"${r.job===j?' selected':''}>${j||'—'}</option>`).join('')}</select></td>
<td><input type="text" data-rw="${i}" value="${esc(r.where||'')}" style="width:170px"></td>
<td><input type="number" data-rl="${i}" value="${r.lvl||''}" min="0" max="99" style="width:64px"></td><td><button data-rdel="${i}" title="Delete">✕</button></td></tr>`).join('')||'<tr><td colspan="6" class="dim">No thralls yet.</td></tr>'}</table></div>`;}
function rosterWire(){
  $('tf').onsubmit=e=>{e.preventDefault();const n=$('tn').value.trim();if(!n)return;S.roster.push({n,t:+$('tt').value,job:$('tj').value,where:$('tw').value.trim(),at:Date.now()});save();route();};
  document.querySelectorAll('[data-rj]').forEach(s=>s.onchange=()=>{S.roster[+s.dataset.rj].job=s.value;save();});
  document.querySelectorAll('[data-rw]').forEach(s=>s.oninput=()=>{S.roster[+s.dataset.rw].where=s.value;save();});
  document.querySelectorAll('[data-rl]').forEach(s=>s.oninput=()=>{S.roster[+s.dataset.rl].lvl=+s.value||0;save();});
  document.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=()=>{if(confirm('Remove '+S.roster[+b.dataset.rdel].n+'?')){S.roster.splice(+b.dataset.rdel,1);save();route();}});
}

function pgNotes(){return `<h2>My Notes</h2><p class="sub">Saved automatically on this device.</p><textarea id="nt" style="width:100%;height:60vh" placeholder="Base coordinates, server settings, where that named taskmaster spawns...">${esc(S.notes)}</textarea>`;}

/* ================= ROUTER ================= */
function route(keepScroll){
  const [pg,sub]=(location.hash.slice(1)||'home').split('/');
  const page=PAGES.some(p=>p[0]===pg)?pg:'home';
  buildNav(page);
  const m=$('main'),top=m.scrollTop;
  m.innerHTML=({home:pgHome,guides:()=>pgGuides(sub),regions:()=>pgRegions(sub),dungeons:pgDungeons,thralls:pgThralls,wheel:pgWheel,attributes:pgAttributes,religions:pgReligions,progress:pgProgress,roster:pgRoster,notes:pgNotes})[page]();
  m.scrollTop=keepScroll===true?top:0;
  m.querySelectorAll('input[type=checkbox][data-k]').forEach(cb=>{cb.checked=!!S.checks[cb.dataset.k];cb.onchange=()=>{S.checks[cb.dataset.k]=cb.checked;save();};});
  m.querySelectorAll('input[type=checkbox][data-p]').forEach(cb=>{cb.onchange=()=>{S.prog[cb.dataset.p]=cb.checked;save();const d=PROG.filter((_,i)=>S.prog[i]).length;$('pdone').textContent=d+' of '+PROG.length+' done';$('pbar').style.width=d/PROG.length*100+'%';};});
  if(page==='wheel')wheelWire();
  if(page==='attributes')attrWire();
  if(page==='roster')rosterWire();
  if(page==='notes')$('nt').oninput=e=>{S.notes=e.target.value;save();};
}
window.addEventListener('hashchange',()=>route());
route();
</script>
</body>
</html>
