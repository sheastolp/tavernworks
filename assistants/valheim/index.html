<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valheim Assistant · Tavernworks</title>
<meta name="description" content="Valheim Assistant: every biome from the Meadows to the Deep North, all eight bosses with summons and prep checklists, a bestiary, a food planner with live food timers, meads, gear and pickaxe tiers, a materials finder, a smelting calculator, a comfort and rested calculator, raids, skills, a portal network log, progression and notes. Runs in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪓</text></svg>">
<style>
:root{--bg:#0d1114;--panel:#151b20;--panel2:#1d252c;--line:#2c3842;--tx:#e9eef0;--dim:#93a3ad;--acc:#e3b04b;--acc-ink:#231800;--acc2:#8fc3d6;--ok:#8fcf7a;--warn:#f2c14e;--err:#ff7a6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
#app{display:flex;height:100vh}
#nav{width:210px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
#nav h1{font-size:15px;margin:4px 8px 12px;color:var(--acc);letter-spacing:.5px}
#nav a{display:block;padding:7px 10px;margin:2px 0;border-radius:6px;color:var(--tx);text-decoration:none;cursor:pointer}
#nav a:hover{background:var(--panel2)}
#nav a.home{color:var(--dim);font-size:13px}
#nav a.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
#nav .grp{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:12px 10px 2px}
#main{flex:1;overflow:auto;padding:20px 24px}
h2{margin:0 0 4px;font-size:22px}
h3{margin:18px 0 6px;color:var(--acc2);font-size:16px}
p.sub{color:var(--dim);margin:0 0 16px}
a{color:var(--acc2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.tile:hover{border-color:var(--acc)}
.tile b{color:var(--acc)}
@media(max-width:760px){#app{flex-direction:column;height:auto;min-height:100vh}#nav{width:auto;display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}#nav h1{width:100%}#nav .grp{display:none}#main{padding:16px}}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
input,select,textarea{background:#080b0d;border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
input[type=text],input[type=number],input[type=search]{width:130px}
input[type=checkbox]{width:auto}
table{border-collapse:collapse;width:100%}
td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--panel2);color:var(--dim);margin-left:6px}
.tag.w{background:#2c1f14;color:#f0b783}.tag.r{background:#14232c;color:#9cc9dc}.tag.i{background:#2b1418;color:#ff9b9b}
.note{border-left:3px solid var(--warn);background:#24210f;padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;color:#eadca6}
.tip{border-left:3px solid var(--acc);background:var(--panel2);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.ok{color:var(--ok)}.bad{color:var(--err)}.dim{color:var(--dim)}
label.chk{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.conf{color:var(--ok)}.unv{color:var(--warn)}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--acc)}
a.mob{font-weight:600;color:var(--acc);text-decoration:none;cursor:pointer}
a.mob:hover{text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat small{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stat .big{font:600 20px/1.2 Consolas,"Cascadia Mono",monospace}
.mech li{margin:4px 0}
.stars{color:var(--acc);letter-spacing:1px}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.slot select{width:100%}
.slot .t{font:600 18px/1.2 Consolas,"Cascadia Mono",monospace}
.fbar{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:6px 0;background:var(--panel2);border:1px solid var(--line)}
.fbar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.timer{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.timer .t{font:600 22px/1.1 Consolas,"Cascadia Mono",monospace}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{border-radius:999px;padding:3px 11px;font-size:13px}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.cf{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.cf label{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.cf label.best{border-color:var(--acc)}
.cf label small{margin-left:auto;color:var(--dim)}
</style>

<script>
/* ================= DATA =================
   conf: true  = from the Valheim wiki, Iron Gate's patch notes or several agreeing guides.
   conf: false = player reports, a single source, or numbers that moved in a rebalance; check in-game.
   Written against Valheim 1.0 (September 2026), which added the Deep North. Everything
   from the Meadows to the Ashlands has been stable for a long time; the Deep North is
   only weeks old and its numbers are still settling, so most of it is marked ○. */

/* Biomes in the order you'll take them on. box places the zone on the schematic map. */
const BIOMES=[
{id:'meadows',n:'Meadows',stars:1,conf:true,col:'#7fae4f',boss:'eikthyr',

 foes:['Greyling','Boar','Neck','Deer'],

 tips:['Build your first base here. Nothing that spawns in the Meadows can break a wooden wall quickly.','Kill deer for hides and two Deer trophies, then summon Eikthyr.','Tame boars with mushrooms, berries or carrots for a steady meat supply.','Pick up every flint you see on the shore. You need it for the first tools and arrows.']},
{id:'blackforest',n:'Black Forest',stars:2,conf:true,col:'#335a3e',boss:'elder',

 tips:['Carry the Antler pickaxe from Eikthyr: it mines copper and tin.','Burial chambers hold surtling cores, which you need for the smelter and kiln.','Trolls are slow. Kite them with a bow or fight them between trees they can\'t swing through.','Destroy Greydwarf nests: they keep spawning Greydwarves until they\'re gone.']},
{id:'swamp',n:'Swamp',stars:3,conf:true,col:'#5c5a3a',boss:'bonemass',

 res:['Scrap iron from muddy scrap piles in Sunken Crypts','Ancient bark from the giant trees','Guck from sacks high on swamp trees','Entrails, bloodbags, chain and ooze','Turnip seeds','Withered bone for Bonemass'],

{id:'mountain',n:'Mountain',stars:4,conf:true,col:'#b9c7cf',fg:'#122028',boss:'moder',

{id:'plains',n:'Plains',stars:5,conf:true,col:'#c7b45a',fg:'#2a2306',boss:'yagluth',
 d:'Wide, bright golden fields. Looks peaceful; is the most dangerous place you\'ve been yet. Fuling villages hold black metal.',
 foes:['Fuling','Fuling Berserker','Fuling Shaman','Deathsquito','Lox','Growth','Vile'],
 res:['Black metal scrap from Fulings and village chests','Barley and flax (plant the seeds you find in Fuling villages)','Cloudberries','Needles from Deathsquitos','Lox meat and pelt','Tar from tar pits','Fine wood from birch'],
 tips:['Deathsquitos one-shot weak players. Block them with a shield or shoot them.','Lox are tameable with barley, flax or cloudberries and can be ridden.','Grow barley and flax here (you can only plant them in the Plains) for bread and linen.','Raid Fuling villages from range first. Shamans shield other Fulings.']},
{id:'ocean',n:'Ocean',stars:4,conf:true,col:'#2c5876',boss:null,
 d:'Everything between the islands. Calm by the shore; serpents and storms out deep.',
 foes:['Serpent','Leviathan','Bonemaw Serpent (near the Ashlands)'],
 res:['Fish (any fishing rod and bait)','Serpent meat, scales and trophy','Chitin from Leviathans','Leviathans: giant whale-like islands you mine for chitin'],

{id:'mistlands',n:'Mistlands',stars:5,conf:true,col:'#55485e',boss:'queen',

const GUIDES=[
{id:'firstday',title:'Your first day',blurb:'From the Sacrificial stones to a warm bed.',body:`
<p>A raven called Hugin greets you at the Sacrificial stones. He pops up with tips as you go; read them.</p>
<label class="chk"><input type="checkbox" data-k="f1"> Pick up branches, stones and flint (shores and rivers). Punch or pick berries and mushrooms.</label>
<label class="chk"><input type="checkbox" data-k="f2"> Craft a Stone axe and a Club, then a Hammer.</label>
<label class="chk"><input type="checkbox" data-k="f3"> Build a Workbench. Everything you craft needs it in range, and building does too.</label>
<label class="chk"><input type="checkbox" data-k="f4"> Chop trees and kill boars and deer. Craft a Flint axe and a Crude bow.</label>
<label class="chk"><input type="checkbox" data-k="f5"> Build a small hut: walls, a roof, a Campfire inside (leave a gap or a hole for smoke) and a Bed.</label>
<label class="chk"><input type="checkbox" data-k="f6"> Sleep in the bed at night. Your bed is now your spawn point.</label>
<label class="chk"><input type="checkbox" data-k="f7"> Always eat three different foods. Your health and stamina come from food.</label>
<label class="chk"><input type="checkbox" data-k="f8"> Look at the stones around the spawn: the Eikthyr runestone marks his altar on the map.</label>
<div class="tip">When you die you drop everything in a tombstone. Go back for it quickly and carry spare gear in a chest at home.</div>`},
{id:'combat',title:'How combat works',blurb:'Parry, stagger, backstab, damage types.',body:`
<ul class="mech"><li><b>Block</b> soaks damage up to your block power. <b>Parry</b>: block just as the hit lands, and the attacker is staggered. Bucklers and round shields parry far better than tower shields.</li>
<li><b>Stagger</b>: hit an enemy enough and it reels; staggered enemies take double damage.</li>
<li><b>Sneak attacks</b>: hit an unaware enemy from behind for big bonus damage (huge with knives).</li>
<li>Every weapon does one or more <b>damage types</b>: blunt, slash, pierce, fire, frost, lightning, poison, spirit. Creatures are weak, resistant or immune to different types. See the <a href="#creatures">Bestiary</a>.</li>
<li>Dodge rolls give you a short window of invulnerability. They cost stamina and get worse in heavy armour.</li>
<li>The secondary attack (middle mouse) is different per weapon: a sword stab, an axe spin, a mace slam, an atgeir sweep.</li>
<li>Your stamina is your real health bar in a fight. Don't empty it.</li></ul>
<div class="tip">Fight next to your home. A death far away is a long naked walk back.</div>`},
{id:'rested',title:'Rested, comfort and food',blurb:'Why your stamina is always short.',body:`
<ul class="mech"><li>You can eat <b>three different foods</b> at a time. Each adds health, stamina and sometimes eitr, and fades over its duration.</li>
<li>Base health is ${BASE_HP} and base stamina is ${BASE_ST}. Everything else comes from food. Use the <a href="#food">Food planner</a>.</li>
<li>Health foods (meat) and stamina foods (berries, soups, bread) are different. Most players eat two health and one stamina, or the reverse for building and exploring.</li>
<li><b>Rested</b> speeds up stamina regeneration a lot and raises skill gain. You get it by sitting or sleeping near a fire, under a roof.</li>
<li>The length of Rested depends on your <b>comfort</b>: each kind of furniture near you adds to it, but only the best piece of each kind counts. Try the <a href="#comfort">Comfort calculator</a>.</li></ul>`},
{id:'building',title:'Building',blurb:'Structure, smoke and the weather.',body:`
<ul class="mech"><li>Pieces show their stability as a colour when you aim at them: <b style="color:#6db3ff">blue</b> on the ground, <b style="color:#79d36b">green</b> strong, <b style="color:#e6d34a">yellow</b>, <b style="color:#f19a3e">orange</b>, <b style="color:#e8574b">red</b> about to fail.</li>
<li>Wood supports less than core wood beams, which support less than stone and iron. Big halls need pillars to the ground.</li>
<li>Fires make smoke. Without a gap in the roof (or a Hearth with a chimney) the room fills and you choke.</li>
<li>Rain wears down wooden pieces that aren\'t under a roof. Roofs are worth it.</li>
<li>Build on raised ground near water. Greydwarves and trolls walk the forest edges.</li>
<li>Your workbench and fire scare away spawns nearby, but raids still come for you.</li></ul>
<div class="tip">Put a <b>Ward</b> down on multiplayer servers to keep other players from opening your doors and chests.</div>`},
{id:'skills',title:'Skills and death',blurb:'How skills grow and what you lose.',body:`
<ul class="mech"><li>Skills go from 0 to 100 by doing the thing: swinging swords raises Swords, running raises Run.</li>
<li>Rested raises skill gain. Some meads and the Bog Witch's food buffs raise it further.</li>
<li>Dying costs you a share of every skill (5% on default settings). After you respawn, a <b>No Skill Drain</b> buff stops you losing more for a while.</li>
<li>World modifiers can change the death penalty, from none at all to losing everything.</li></ul>
<div class="note">The exact penalty changed in a few updates. Check your world's settings in the world-modifier screen.</div>`},
{id:'sailing',title:'Sailing and portals',blurb:'Boats, wind and what won\'t teleport.',body:`
<ul class="mech"><li>Boats: <b>Raft</b> (slow, Meadows), <b>Karve</b> (fast, small hold), <b>Longship</b> (big hold, ancient bark), <b>Drakkar</b> (the Ashlands longship).</li>
<li>Sail with the wind behind or to the side. Half sail is safer; full sail is faster. Moder\'s power gives you a constant tailwind.</li>
<li>Serpents come in storms. Stay near land, or shoot them from the boat.</li>
<li><b>Portals</b> link in pairs by name. Name both the same and they connect.</li>
<li>You <b>can\'t</b> portal metals or ores. Ship them home or build a forge and smelter where you mine. See the <a href="#portals">Portal log</a>.</li>
<li>World modifiers can allow all items through portals.</li></ul>`},
{id:'taming',title:'Taming and breeding',blurb:'Wolves, boars, lox, Asksvin and more.',body:`
<ul class="mech"><li>Drop the creature\'s food near it and stay close but hidden. Hearts appear when it eats, and a tame bar fills.</li>
<li>Tameable: <b>Boar</b>, <b>Wolf</b>, <b>Lox</b>, <b>Hen</b> (from eggs), <b>Asksvin</b>, <b>Moose</b> (Deep North). See the <a href="#creatures">Bestiary</a> for what each eats.</li>
<li>Fed tame animals breed. Keep them in a pen: more than a few in one place and they stop.</li>
<li>Lox, Asksvin and Moose can be ridden with a saddle.</li>
<li>Tame wolves follow you if you tell them to, and fight for you. A wolf pack at home is a great guard.</li></ul>`},
{id:'farming',title:'Farming',blurb:'Cultivator, seeds and the right biome.',body:`
<ul class="mech"><li>Craft a <b>Cultivator</b> (bronze) to till soil and plant.</li>
<li>Carrots, turnips and onions come from seeds you find. Plant seeds to grow the vegetable; let one go to seed to get more seeds.</li>
<li>Barley and flax only grow in the <b>Plains</b>. Deep North crops need the Deep North.</li>
<li>Plants need space around them and open sky. A red or blue warning on a sapling means it is too close or covered.</li>
<li>Saplings: plant pine cones, birch and beech seeds for a renewable wood farm.</li></ul>`},
{id:'dungeons',title:'Dungeons and Vegvisirs',blurb:'Burial Chambers to Mörkhalla.',body:`
<ul class="mech"><li><b>Burial Chambers</b> (Black Forest): skeletons, surtling cores, bone fragments.</li>
<li><b>Troll caves</b> (Black Forest): one or two trolls and good chests.</li>
<li><b>Sunken Crypts</b> (Swamp): need the Swamp key. Scrap iron, withered bone.</li>
<li><b>Frost Caves</b> (Mountain): cultists, Ulv, Fenring gear.</li>
<li><b>Infested Mines</b> (Mistlands): black cores, soft tissue, Sealbreaker fragments.</li>
<li><b>Charred Fortresses</b> (Ashlands): sieges with a ballista, Bell fragments, Fader\'s Vegvisir.</li>
<li><b>Mörkhalla</b> (Deep North): ends in Malice Ice and a Jotun invasion.</li>
<li><b>Vegvisirs</b> are glowing runestones. Read one to mark a boss altar on your map.</li></ul>`},
{id:'magic',title:'Eitr and magic',blurb:'Staves, eitr food and the Galdr table.',body:`
<ul class="mech"><li>Mages need <b>eitr</b>: you only have it if you\'ve eaten an eitr food (Yggdrasil porridge and friends).</li>
<li>Staves come from the Galdr table: the <b>Staff of Embers</b> (fire balls), <b>Staff of Frost</b>, <b>Staff of Protection</b> (bubble shield for your group) and <b>Dead raiser</b> (summons skeletons).</li>
<li>Elemental magic covers the attack staves, Blood magic the support staves, which also cost health.</li>
<li>Eitr-weave robes, the Embla set (Ashlands) and the Caller set (Deep North) add eitr regeneration.</li></ul>
<div class="tip">Mix: one eitr food, one health food, one stamina food is a common mage plate.</div>`},
{id:'ashlands',title:'Surviving the Ashlands',blurb:'Fire, sieges and a long sail.',body:`
<ul class="mech"><li>It is far south. Bring a Longship or Drakkar and a portal kit.</li>
<li>Land quickly: Bonemaw serpents ram boats near the shore.</li>
<li>Drink Fire resistance barley wine. Stay off the lava and the hot rocks.</li>
<li>Build a <b>Shield generator</b> before anything else. Charred armies attack Ashlands bases regularly.</li>
<li>Charred fortresses are built to be sieged: build a ballista or a battering ram.</li></ul>`},
{id:'deepnorth',title:'Surviving the Deep North',blurb:'Frostbite, Gammeltrolls and Mörkhalla.',body:`
<ul class="mech"><li>Take frost resistance <b>and</b> new Deep North cold gear: frostbite stacks on top of the old Freezing.</li>
<li>Most creatures here resist frost and take extra fire damage.</li>
<li>Gammeltrolls resist nearly every weapon. Kill them with <b>Ember Charges</b>, then blast the statue for petrified tissue.</li>
<li>Smelt and harden the new armour with the <b>Frost Foundry</b> and <b>Frigid Kiln</b>. Moulds come from dungeons and Hexen.</li>
<li>Break the Malice Ice at the end of a Mörkhalla to start a Jotun invasion. Each one won gives one Malicious Blood; three summon Kall.</li></ul>
<div class="note">The Deep North arrived with 1.0 in September 2026. Details here come from early guides and are still settling.</div>`}
];

const MAPBLOBS={meadows:[[300,215,52,40]],blackforest:[[220,170,40,30],[380,250,42,30],[300,290,34,22]],swamp:[[230,265,30,22],[385,165,30,22]],mountain:[[300,135,36,26],[195,225,26,30],[420,215,24,26]],plains:[[140,170,34,26],[455,280,36,26],[250,345,30,20]],mistlands:[[110,270,32,28],[462,160,28,24],[370,355,30,20]],ocean:[],ashlands:[],deepnorth:[]};
function worldMap(){
  const blob=(b,[x,y,rx,ry])=>`<ellipse class="hit" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${b.col}" stroke="#0d1114" stroke-width="2"/>`;
  const lab=(b,x,y)=>`<text class="lbl" x="${x}" y="${y}" text-anchor="middle" font-size="12" font-weight="700" fill="${b.fg||'#fff'}" style="stroke:${b.fg?'#ffffffaa':'#0d1114'}">${esc(b.n)}</text>`;
  const g=id=>BIOMES.find(b=>b.id===id);
  let z='';
  for(const b of BIOMES){const bl=MAPBLOBS[b.id];if(!bl||!bl.length)continue;
    z+=`<a href="#biomes/${b.id}" aria-label="${esc(b.n)}"><title>${esc(b.n)}</title>${bl.map(p=>blob(b,p)).join('')}${lab(b,bl[0][0],bl[0][1]+4)}</a>`;}
  const dn=g('deepnorth'),as=g('ashlands'),oc=g('ocean');
  return `<svg class="tw-map" viewBox="0 0 600 440" style="max-width:640px" role="img" aria-label="Schematic of a Valheim world">
<rect width="600" height="440" fill="#0a1218"/>
<a href="#biomes/ocean" aria-label="Ocean"><title>Ocean</title><circle class="hit" cx="300" cy="220" r="205" fill="${oc.col}" stroke="#0d1114" stroke-width="2"/></a>
<circle cx="300" cy="220" r="175" fill="none" stroke="#ffffff22" stroke-dasharray="4 5"/><circle cx="300" cy="220" r="115" fill="none" stroke="#ffffff22" stroke-dasharray="4 5"/>
<a href="#biomes/deepnorth" aria-label="Deep North"><title>Deep North</title><path class="hit" d="M150 82 A205 205 0 0 1 450 82 L420 108 A170 170 0 0 0 180 108 Z" fill="${dn.col}" stroke="#0d1114" stroke-width="2"/>${lab(dn,300,80)}</a>
<a href="#biomes/ashlands" aria-label="Ashlands"><title>Ashlands</title><path class="hit" d="M150 358 A205 205 0 0 0 450 358 L420 332 A170 170 0 0 1 180 332 Z" fill="${as.col}" stroke="#0d1114" stroke-width="2"/>${lab(as,300,372)}</a>
${z}
<text x="20" y="420" font-size="11" fill="#9fb3bf">Inner ring: Meadows, Black Forest</text>
<text x="20" y="20" font-size="11" fill="#9fb3bf">Outer rings: Plains, Mistlands</text>
<text x="580" y="30" font-size="14" fill="#e6d8c4" text-anchor="middle">N</text><path d="M580 34 L580 56" stroke="#e6d8c4" stroke-width="2" marker-start="url(#ar)"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#e6d8c4"/></marker></defs></svg>`;
}

  if(b){const i=BOSSES.indexOf(b),prep=S.bossPrep[b.id]||{},bm=BIOMES.find(x=>x.n===b.biome);
    return `<p><a href="#bosses">&larr; All bosses</a></p>
<h2>${mark(b.conf)} ${esc(b.n)} <span class="tag">Boss ${i+1} of ${BOSSES.length}</span> <span class="tag">${esc(b.biome)}</span></h2>

<div class="stats"><div class="stat"><small>Health</small><span class="big">${hp}</span></div><div class="stat"><small>Stamina</small><span class="big">${st}</span></div><div class="stat"><small>Eitr</small><span class="big">${ei}</span></div><div class="stat"><small>Healing / tick</small><span class="big">${tot('heal')}</span></div></div>

const PLATES=[
['Meadows starter',['Cooked deer meat','Cooked meat','Raspberries']],
['Black Forest fighting',['Deer stew','Minced meat sauce','Queen\'s jam']],
['Swamp',['Sausages','Black soup','Turnip stew']],
['Mountain',['Wolf skewer','Wolf jerky','Onion soup']],
['Plains fighter',['Lox meat pie','Fish wraps','Bread']],
['Plains builder / explorer',['Blood pudding','Bread','Lox meat pie']],
['Mistlands warrior',['Misthare supreme','Meat platter','Salad']],
['Mistlands mage',['Yggdrasil porridge','Misthare supreme','Salad']],
['Ashlands',['Piquant pie','Fiery svinstew','Scorching medley']],
['Deep North',['Smoked moose meat','Oatmeal','Piquant pie']]];
function foodLeft(i){const f=foodBy(S.plate[i]);if(!f||!S.ate[i])return 'Not eaten';const left=S.ate[i]+f.dur*6e4-Date.now();return left>0?dur(left):'Hungry';}
let foodTimer=0;
function foodWire(){
  document.querySelectorAll('[data-slot]').forEach(s=>s.onchange=()=>{const i=+s.dataset.slot;S.plate[i]=s.value;S.ate[i]=0;save();route(true);});
  document.querySelectorAll('[data-eat]').forEach(b=>b.onclick=()=>{S.ate[+b.dataset.eat]=Date.now();save();route(true);});
  document.querySelectorAll('[data-plate]').forEach(t=>t.onclick=()=>{S.plate=PLATES[+t.dataset.plate][1].slice();S.ate=[0,0,0];save();route(true);});
  const draw=()=>{const rows=FOOD.filter(f=>!foodBiome||f.b===foodBiome).slice().sort((a,b)=>{const k=foodSort.k;const x=a[k],y=b[k];return (typeof x==='string'?x.localeCompare(y):x-y)*foodSort.d;});
    const th=(k,n,cls)=>`<th class="${cls||''}" data-sort="${k}" style="cursor:pointer">${n}${foodSort.k===k?(foodSort.d<0?' ▾':' ▴'):''}</th>`;
    $('ftab').innerHTML=`<tr>${th('n','Food')}${th('b','Biome')}${th('hp','Health','n')}${th('st','Stamina','n')}${th('ei','Eitr','n')}${th('heal','Heal','n')}${th('dur','Min','n')}<th>How</th></tr>`+rows.map(f=>`<tr><td>${mark(f.conf)} <b>${esc(f.n)}</b></td><td>${esc(f.b)}</td><td class="n">${f.hp}</td><td class="n">${f.st}</td><td class="n">${f.ei||''}</td><td class="n">${f.heal}</td><td class="n">${f.dur}</td><td class="dim">${esc(f.how)}</td></tr>`).join('');
    document.querySelectorAll('[data-sort]').forEach(h=>h.onclick=()=>{const k=h.dataset.sort;foodSort=foodSort.k===k?{k,d:-foodSort.d}:{k,d:typeof FOOD[0][k]==='string'?1:-1};draw();});};

}

${Object.keys(COMF_GROUP).map(g=>`<h3>${COMF_GROUP[g]}</h3><div class="cf">${COMFORT.map(([gg,n,v],i)=>gg!==g?'':`<label class="${best[g]&&best[g].i===i?'best':''}"><input type="checkbox" data-cf="${i}"${S.comfort[i]?' checked':''}> ${esc(n)}<small>+${v}</small></label>`).join('')}</div>`).join('')}

<div class="tip"><ul class="mech" style="margin:0"><li>To get Rested you need to be <b>sheltered</b> and near a <b>fire</b>. Then sit or sleep.</li><li>Rested speeds up stamina regeneration and raises how fast you learn skills.</li><li>Rested time counts from when the buff starts; sitting longer doesn't add more.</li></ul></div>

function pgSmelting(){const sm=S.smelt;

<div class="tip"><ul class="mech" style="margin:0"><li>Smelter and Blast furnace take 2 coal per ore and hold ${SMELT_CAP} ore at a time; about ${SMELT_SECS} seconds per bar.</li><li>The Charcoal kiln turns 1 wood into 1 coal, about 15 seconds each ○. Any wood works; use the plain stuff.</li><li>Ore can't go through portals, so a smelter at a mining outpost saves trips (bars can't either).</li><li>Bronze is 2 copper + 1 tin at the Forge.</li></ul></div>
<div class="note">Flametal numbers are marked ○: check the station in-game.</div>`;}
function smeltWire(){
  const calc=()=>{let coal=0,smOre=0,bfOre=0;const bars=[];
    ORES.forEach(o=>{const n=Math.max(0,+S.smelt[o.k]||0);if(!n)return;coal+=n*o.coal;if(o.st==='Smelter')smOre+=n;else bfOre+=n;bars.push(`${n} ${o.bar}`);});
    const have=Math.max(0,+S.smelt.coal||0),need=Math.max(0,coal-have),ns=Math.max(1,+S.smelt.n||1),nb=Math.max(1,+S.smelt.nb||1);
    const t=Math.max(Math.ceil(smOre/ns),Math.ceil(bfOre/nb))*SMELT_SECS*1e3;
    $('smout').innerHTML=bars.length?`<div class="stats"><div class="stat"><small>Coal needed</small><span class="big">${coal}</span></div><div class="stat"><small>Still to make</small><span class="big ${need?'':'ok'}">${need}</span></div><div class="stat"><small>Wood for that coal</small><span class="big">${need}</span></div><div class="stat"><small>Time</small><span class="big">${dur(t)}</span></div><div class="stat"><small>Kiln time</small><span class="big">${dur(need*15e3)}</span></div></div><div class="dim">You'll get ${bars.join(', ')}. Load ${SMELT_CAP} ore and ${SMELT_CAP*2} coal at a time.</div>`:'<div class="dim">Enter some ore above.</div>';
    const bz=Math.max(0,+S.smelt.bz||0);$('bzout').innerHTML=bz?`Smelt <b>${bz*2} copper</b> and <b>${bz} tin</b> (${bz*6} coal).`:'';};
  document.querySelectorAll('[data-ore]').forEach(i=>i.oninput=()=>{S.smelt[i.dataset.ore]=+i.value||0;save();calc();});
  [['coalhave','coal'],['nsm','n'],['nbf','nb'],['bz','bz']].forEach(([id,k])=>$(id).oninput=e=>{S.smelt[k]=+e.target.value||0;save();calc();});
  calc();
}

function pgProgress(){const done=PROG.filter((_,i)=>S.prog[i]).length,groups=[...new Set(PROG.map(p=>p[0]))];
  return `<h2>Progression</h2><p class="sub">The road from the Meadows to the Deep North. Tick things off as you go.</p>
<div class="dim" id="pdone">${done} of ${PROG.length} done</div><div class="bar"><i id="pbar" style="width:${done/PROG.length*100}%"></i></div>
${groups.map(g=>`<h3>${g}</h3><div class="card">${PROG.map((p,i)=>p[0]===g?`<label class="chk"><input type="checkbox" data-p="${i}"${S.prog[i]?' checked':''}> ${esc(p[1])}</label>`:'').join('')}</div>`).join('')}
<button onclick="if(confirm('Clear all progression ticks?')){S.prog={};save();route()}">Reset</button>`;}

function pgPortals(){return `<h2>Portal log</h2><p class="sub">Portals connect in pairs by name. Keep track of every tag, where each end is, and what it's for, so you never build a third with the same name.</p>
<div class="card"><form class="row" id="pf"><input id="pn" type="text" style="width:150px" placeholder="Tag (e.g. swamp1)"><input id="pa" type="text" style="width:170px" placeholder="End A (e.g. Home)"><input id="pb" type="text" style="width:170px" placeholder="End B (e.g. Swamp crypts)"><input id="pnote" type="text" style="width:200px" placeholder="Note"><button class="pri">Add</button></form></div>
<div class="card tbl"><table><tr><th>Tag</th><th>End A</th><th>End B</th><th>Note</th><th></th></tr>${S.portals.map((p,i)=>{const dup=S.portals.filter(q=>q.t.toLowerCase()===p.t.toLowerCase()).length>1;return `<tr><td><b>${esc(p.t)}</b>${dup?' <span class="tag i">duplicate tag</span>':''}</td><td><input type="text" data-pe="${i}:a" value="${esc(p.a)}" style="width:150px"></td><td><input type="text" data-pe="${i}:b" value="${esc(p.b)}" style="width:150px"></td><td><input type="text" data-pe="${i}:n" value="${esc(p.n||'')}" style="width:180px"></td><td><button data-pdel="${i}" title="Delete">✕</button></td></tr>`;}).join('')||'<tr><td colspan="5" class="dim">No portals yet.</td></tr>'}</table></div>
<h3>Can't go through a portal</h3><div class="card"><ul class="mech">${NOPORT.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="dim">On default world settings. The "Portals" world modifier can allow everything, or block more.</div></div>
<div class="tip">A portal costs fine wood, surtling cores and Greydwarf eyes. Build one by every dungeon cluster and one home hub with a portal per destination. A Stone portal (Ashlands) can carry metals.</div>`;}
function portalWire(){
  $('pf').onsubmit=e=>{e.preventDefault();const t=$('pn').value.trim();if(!t)return;S.portals.push({t,a:$('pa').value.trim(),b:$('pb').value.trim(),n:$('pnote').value.trim()});save();route();};
  document.querySelectorAll('[data-pe]').forEach(i=>i.oninput=()=>{const [ix,k]=i.dataset.pe.split(':');S.portals[+ix][k]=i.value;save();});
  document.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{if(confirm('Remove portal '+S.portals[+b.dataset.pdel].t+'?')){S.portals.splice(+b.dataset.pdel,1);save();route();}});
}

/* ================= TIMERS ================= */
function pgTimers(){const now=Date.now();
  return `<h2>Timers</h2><p class="sub">Real-time timers for things that take a while in-game. They keep running when you close the page. A full day in Valheim is about 30 minutes.</p>
<div class="card"><form id="tf"><div class="row"><label>What <input id="tn" type="text" style="width:200px" placeholder="e.g. Fermenter by the hall"></label><label>Minutes <input id="tm" type="number" min="0.1" step="0.1" value="40" style="width:80px"></label><button class="pri">Start</button></div>
<div class="chips">${TPRESETS.map(([n,m,c],i)=>`<button type="button" data-tp="${i}" title="${c?'Wiki value':'Approximate; varies'}">${esc(n)} · ${m} min</button>`).join('')}</div></form></div>
<div id="tl">${S.timers.length?S.timers.map((t,i)=>{const left=t.end-now;return `<div class="card timer"><div><b>${esc(t.n||'Timer')}</b><div class="dim">Started ${new Date(t.start).toLocaleTimeString([],{timeStyle:'short'})} · done at ${new Date(t.end).toLocaleTimeString([],{timeStyle:'short'})}</div><div class="bar" style="width:220px"><i data-tb="${i}" style="width:${Math.min(100,(now-t.start)/(t.end-t.start)*100)}%"></i></div></div>
<div class="row"><span class="t ${left<=0?'ok':''}" data-tt="${i}">${left<=0?'Done':dur(left)}</span><button data-tr="${i}" title="Restart">↻</button><button data-tdel="${i}" title="Remove">✕</button></div></div>`;}).join(''):'<div class="dim">No timers. Start one above.</div>'}</div>
<div class="note">Preset times are approximate (○) unless marked otherwise: crop growth is random within a range, and game time pauses when everyone on a server is asleep or the game is paused. Edit the minutes to match your world.</div>`;}
let tickTimer=0;
function timerWire(){
  document.querySelectorAll('[data-tp]').forEach(b=>b.onclick=()=>{const p=TPRESETS[+b.dataset.tp];$('tn').value=p[0];$('tm').value=p[1];});
  $('tf').onsubmit=e=>{e.preventDefault();const m=Math.max(0.1,+$('tm').value||1),now=Date.now();S.timers.push({n:$('tn').value.trim(),start:now,end:now+m*6e4});save();route();};
  document.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=()=>{S.timers.splice(+b.dataset.tdel,1);save();route();});
  document.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{const t=S.timers[+b.dataset.tr],len=t.end-t.start,now=Date.now();t.start=now;t.end=now+len;save();route();});
  clearInterval(tickTimer);tickTimer=setInterval(()=>{
    if(!$('tl')){clearInterval(tickTimer);return;}
    const now=Date.now();let redraw=false;
    S.timers.forEach((t,i)=>{const el=document.querySelector(`[data-tt="${i}"]`),bar=document.querySelector(`[data-tb="${i}"]`);if(!el)return;
      if(t.end<=now&&el.textContent!=='Done'){redraw=true;return;}
      if(t.end>now)el.textContent=dur(t.end-now);if(bar)bar.style.width=Math.min(100,(now-t.start)/(t.end-t.start)*100)+'%';});
    if(redraw)route(true);},1000);
}

function pgNotes(){return `<h2>My Notes</h2><p class="sub">Saved automatically on this device.</p><textarea id="nt" style="width:100%;height:60vh" placeholder="World seed, base coordinates, where you saw that Fuling village, the Vegvisir you haven't read yet...">${esc(S.notes)}</textarea>`;}

/* ================= ROUTER ================= */
function route(keepScroll){
  const [pg,sub]=(location.hash.slice(1)||'home').split('/');
  const page=REAL.some(p=>p[0]===pg)?pg:'home';
  buildNav(page);
  const m=$('main'),top=m.scrollTop;
  m.innerHTML=({home:pgHome,guides:()=>pgGuides(sub),biomes:()=>pgBiomes(sub),bosses:()=>pgBosses(sub),creatures:pgCreatures,raids:pgRaids,food:pgFood,meads:pgMeads,comfort:pgComfort,skills:pgSkills,gear:pgGear,materials:pgMaterials,smelting:pgSmelting,progress:pgProgress,portals:pgPortals,timers:pgTimers,notes:pgNotes})[page]();
  m.scrollTop=keepScroll===true?top:0;
  m.querySelectorAll('input[type=checkbox][data-k]').forEach(cb=>{cb.checked=!!S.checks[cb.dataset.k];cb.onchange=()=>{S.checks[cb.dataset.k]=cb.checked;save();};});
  m.querySelectorAll('input[type=checkbox][data-p]').forEach(cb=>{cb.onchange=()=>{S.prog[cb.dataset.p]=cb.checked;save();const d=PROG.filter((_,i)=>S.prog[i]).length;$('pdone').textContent=d+' of '+PROG.length+' done';$('pbar').style.width=d/PROG.length*100+'%';};});
  if(page==='bosses'&&sub)bossWire(sub);
  if(page==='creatures')creatureWire();
  if(page==='food')foodWire();
  if(page==='comfort')comfortWire();
  if(page==='skills')skillWire();
  if(page==='materials')matWire();
  if(page==='smelting')smeltWire();
  if(page==='portals')portalWire();
  if(page==='timers')timerWire();
  if(page==='notes')$('nt').oninput=e=>{S.notes=e.target.value;save();};
}
window.addEventListener('hashchange',()=>route());
route();
</script>
</body>
</html>
