<title>Hollow Knight Assistant · Tavernworks</title>
<meta name="description" content="Hollow Knight Assistant: every area of Hallownest on a map, all the bosses with prep checklists, a charm builder that checks notches and overcharming, abilities in order, nail, spells and nail arts, masks and vessels, grubs, relics and Pale Ore, Dream Nail essence, stag stations, Godhome pantheons, endings, a completion checklist and notes. Runs in your browser.">

<style>
:root{--bg:#0b0e14;--panel:#121722;--panel2:#1a2130;--line:#2a3346;--tx:#e8ecf4;--dim:#8e98ab;--acc:#cfd8ea;--acc-ink:#0b0e14;--acc2:#7fb2e5;--ok:#8fcf9a;--warn:#f2c14e;--err:#ff7a7a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
#app{display:flex;height:100vh}
#nav{width:215px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
#nav h1{font-size:15px;margin:4px 8px 12px;color:var(--acc);letter-spacing:.5px}
#nav a{display:block;padding:7px 10px;margin:2px 0;border-radius:6px;color:var(--tx);text-decoration:none;cursor:pointer}
#nav a:hover{background:var(--panel2)}
#nav a.home{color:var(--dim);font-size:13px}
#nav a.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
#nav .grp{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:12px 10px 2px}
#main{flex:1;overflow:auto;padding:20px 24px}
h2{margin:0 0 4px;font-size:22px}
h3{margin:18px 0 6px;color:var(--acc2);font-size:16px}
p.sub{color:var(--dim);margin:0 0 16px}
a{color:var(--acc2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.tile:hover{border-color:var(--acc)}
.tile b{color:var(--acc)}
@media(max-width:760px){#app{flex-direction:column;height:auto;min-height:100vh}#nav{width:auto;display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}#nav h1{width:100%}#nav .grp{display:none}#main{padding:16px}}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
input,select,textarea{background:#070910;border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
input[type=text],input[type=number],input[type=search]{width:130px}
input[type=checkbox]{width:auto}
table{border-collapse:collapse;width:100%}
td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--panel2);color:var(--dim);margin-left:6px}
.tag.w{background:#2c2414;color:#f0cf83}.tag.r{background:#14232c;color:#9cc9dc}.tag.i{background:#2b1418;color:#ff9b9b}.tag.g{background:#18281a;color:#a6dc94}
.note{border-left:3px solid var(--warn);background:#1f1d10;padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;color:#eadca6}
.tip{border-left:3px solid var(--acc2);background:var(--panel2);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.ok{color:var(--ok)}.bad{color:var(--err)}.dim{color:var(--dim)}
label.chk{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.conf{color:var(--ok)}.unv{color:var(--warn)}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--acc2)}
a.mob{font-weight:600;color:var(--acc);text-decoration:none;cursor:pointer}
a.mob:hover{text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat small{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stat .big{font:600 20px/1.2 Consolas,"Cascadia Mono",monospace}
.mech li{margin:4px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{border-radius:999px;padding:3px 11px;font-size:13px}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.big2{font:600 26px/1.2 Consolas,"Cascadia Mono",monospace;color:var(--acc)}
.pips{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.pip{width:18px;height:18px;border-radius:50%;border:2px solid var(--acc);background:transparent}
.pip.f{background:var(--acc)}.pip.o{border-color:var(--err);background:var(--err)}
.charms{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.charm{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;text-align:left}
.charm.on{border-color:var(--acc);background:#273248}
.charm .c{float:right;font:700 12px/18px Consolas,monospace;color:var(--acc)}
.charm small{display:block;color:var(--dim);font-size:12px}
.cnt{display:inline-flex;align-items:center;gap:6px}
.cnt b{min-width:44px;text-align:center;font:600 18px Consolas,monospace}
</style>

<script>

   and Godmaster all included). Hollow Knight is long settled, so most facts are solid. */

/* Areas of Hallownest. x,y place them on the map. need = what you need to get in properly. */

 tips:["Buy Iselda's Quill and the Crossroads map first: you can't see your own position on the map without the quill and Wayward Compass.","Jiji (in Dirtmouth, needs a Simple Key) will summon your Shade if you bring a Rancid Egg."]},
{id:'cliffs',n:'Howling Cliffs',x:205,y:52,col:'#55617a',conf:true,need:'Mantis Claw or Monarch Wings for most of it',

 npcs:['Nailmaster Mato (Cyclone Slash)'],

{id:'crossroads',n:'Forgotten Crossroads',x:360,y:130,col:'#7a8aa5',conf:true,need:'Nothing',

{id:'edge',n:'Kingdom\'s Edge',x:655,y:265,col:'#b0a08a',conf:true,need:'Crystal Heart or Monarch Wings; King\'s Brand for the Cast-Off Shell',

 boss:['hornet2','markoth','colosseum'],
 items:['King\'s Brand (Cast-Off Shell, after Hornet)','Quick Slash','The Hive entrance','Colosseum trials','Grubs: four'],

{id:'hive',n:'The Hive',x:655,y:360,col:'#d6a63a',conf:true,need:'Break in from the Kingdom\'s Edge',

 boss:['hiveknight'],

{id:'basin',n:'Ancient Basin',x:455,y:372,col:'#4a4f5c',conf:true,need:'Desolate Dive via the Royal Waterways or the City lift',
 d:"The deep floor of Hallownest. The Broken Vessel, the Monarch Wings, the Palace Grounds and the way to the Abyss.",

 items:['Monarch Wings (Broken Vessel)','Pale Ore (Ancient Basin)','A Vessel Fragment','Palace Grounds (White Palace entrance)','Grubs: two'],

{id:'abyss',n:'The Abyss',x:455,y:465,col:'#1a1d24',fg:'#cfd8ea',conf:true,need:'King\'s Brand',

{id:'gruz',n:'Gruz Mother',area:'crossroads',req:false,conf:true,rew:'Geo and baby Gruzzers',how:'A sleeping fly in the Crossroads, near the Greenpath exit.',attacks:['Bouncing charge','Straight ram'],tip:"Hit her when she bounces off a wall. Kill the babies she releases before you heal.",prep:[]},

  let s='';for(const [a,b] of L){const A=areaOf(a),B=areaOf(b);s+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#7fb2e566" stroke-width="2" stroke-dasharray="5 5"/>`;}
  for(const a of AREAS){s+=`<a href="#areas/${a.id}" aria-label="${esc(a.n)}"><title>${esc(a.n)}</title><circle class="hit" cx="${a.x}" cy="${a.y}" r="26" fill="${a.col}" stroke="#0b0e14" stroke-width="2"/><text class="lbl" x="${a.x}" y="${a.y+40}" text-anchor="middle" font-size="11" font-weight="600" fill="#e8ecf4">${esc(a.n.replace(' and King\'s Pass','').replace('Forgotten ','').replace('Royal ',''))}</text></a>`;}
  return `<svg class="tw-map" viewBox="40 0 680 520" role="img" aria-label="Map of Hallownest">${s}</svg><p class="tw-cap">Roughly where each area sits, not to scale. Tap one.</p>`;
}

/* Charm builder. You may overcharm if at least one notch is free before the last charm. */
function buildCheck(){
  const cs=S.build.map(charmOf).filter(Boolean),cost=c=>c.id===VH_ID&&S.vh?0:c.c,used=cs.reduce((a,c)=>a+cost(c),0),maxc=cs.reduce((a,c)=>Math.max(a,cost(c)),0);
  const state=used<=S.notches?'ok':(used-maxc<S.notches?'over':'bad');
  return {cs,used,state,cost};
}
function pgCharms(){const {cs,used,state,cost}=buildCheck(),owned=CHARMS.filter(c=>S.have['ch:'+c.id]).length,ids=new Set(S.build);

  return `<h2>Charm builder</h2><p class="sub">Tap charms to equip them. Tick the ones you own. ${owned} of ${CHARMS.length} owned.</p>
<div class="card"><div class="row"><label>Notches <select id="nn">${[3,4,5,6,7,8,9,10,11].map(n=>`<option${n===S.notches?' selected':''}>${n}</option>`).join('')}</select></label><label class="chk" style="margin:0"><input type="checkbox" id="vh"${S.vh?' checked':''}> I have Void Heart (0 notches)</label><button id="bclear">Clear</button></div>
<div class="pips">${Array.from({length:Math.max(S.notches,used)},(_,i)=>`<span class="pip ${i<used?(i>=S.notches?'o':'f'):''}"></span>`).join('')}</div>
<div><b>${used} of ${S.notches} notches</b> · ${state==='ok'?'<span class="ok">Fits</span>':state==='over'?'<span class="unv">Overcharmed: you take double damage</span>':'<span class="bad">Too much: you can\'t equip this, even overcharmed</span>'}</div>
${cs.length?`<p style="margin:8px 0 0">${cs.map(c=>`<span class="tag" style="margin:0 4px 4px 0">${esc(c.id===VH_ID&&S.vh?'Void Heart':c.n)} · ${cost(c)}</span>`).join('')}</p>`:''}

function charmWire(){
  $('nn').onchange=e=>{S.notches=+e.target.value;save();route(true);};

  document.querySelectorAll('[data-mine]').forEach(b=>b.onclick=()=>{const x=S.builds[+b.dataset.mine];S.build=x.ids.slice();S.notches=x.notches||S.notches;save();route(true);});

<div class="stats"><div class="stat"><small>Your essence</small><input type="number" id="ess" min="0" value="${S.essence}" style="width:100px"></div><div class="stat"><small>Next</small>${next?`${esc(next[1])} <span class="dim">at ${next[0]} (${next[0]-S.essence} to go)</span>`:'<span class="ok">The Seer has ascended</span>'}</div></div>
<div class="bar"><i style="width:${Math.min(100,S.essence/2400*100)}%"></i></div>
<div class="card tbl"><table><tr><th class="n">Essence</th><th>Reward</th><th></th></tr>${SEER.map(([n,r])=>`<tr><td class="n">${n}</td><td>${esc(r)}</td><td>${S.essence>=n?'<span class="ok">✔</span>':''}</td></tr>`).join('')}</table></div>
<div class="tip">Warrior dreams (Gorb, Elder Hu, Marmu, No Eyes, Galien, Xero, Markoth) each give a good chunk of essence. Dream bosses (Failed Champion, Soul Tyrant, Lost Kin, White Defender, Grey Prince Zote) give essence too.</div>`;}

function pgStags(){const n=STAGS.filter((_,i)=>S.stags[i]).length;
  return `<h2>Stag stations</h2><p class="sub">Ring the bell to call the Last Stag. Most stations need a toll the first time. ${n} of ${STAGS.length} open.</p><div class="bar"><i style="width:${n/STAGS.length*100}%"></i></div>
<div class="card">${STAGS.map((s,i)=>`<label class="chk"><input type="checkbox" data-stag="${i}"${S.stags[i]?' checked':''}> ${esc(s)}</label>`).join('')}</div>
<div class="tip">Open every station and ride to the Stag Nest at the end for a short story.</div>`;}

function pgGodhome(){return `<h2>Godhome</h2><p class="sub">Enter through the Junk Pit in the Royal Waterways (Simple Key). Tick each pantheon and the bindings you beat it with.</p>
${PANTH.map((p,i)=>{const s=S.panth[i]||{};return `<div class="card"><h3 style="margin-top:0">${mark(p.conf)} ${esc(p.n)} ${s.done?'<span class="ok">✔</span>':''}</h3><p style="margin:0 0 6px">Opens: ${esc(p.open)} · last boss: <b>${esc(p.end)}</b></p><p class="dim" style="margin:0 0 6px">${esc(p.bosses)}</p>
<div class="row"><label class="chk" style="margin:0"><input type="checkbox" data-pd="${i}"${s.done?' checked':''}> Done</label>${BINDS.map(b=>`<label class="chk" style="margin:0"><input type="checkbox" data-pb="${i}:${b}"${(s.b||{})[b]?' checked':''}> ${b} binding</label>`).join('')}</div></div>`;}).join('')}
<div class="note">Boss orders in pantheons 2 to 4 are from memory and community lists; check the in-game list when you start one.</div>`;}
function godWire(){
  document.querySelectorAll('[data-pd]').forEach(c=>c.onchange=()=>{const i=c.dataset.pd;(S.panth[i]=S.panth[i]||{}).done=c.checked;save();route(true);});
  document.querySelectorAll('[data-pb]').forEach(c=>c.onchange=()=>{const [i,b]=c.dataset.pb.split(':');const p=S.panth[i]=S.panth[i]||{};(p.b=p.b||{})[b]=c.checked;save();});
}

function pgProgress(){const done=PROG.filter((_,i)=>S.prog[i]).length,groups=[...new Set(PROG.map(p=>p[0]))];
  return `<h2>Progression</h2><p class="sub">From King's Pass to the Radiance. Tick things off as you go.</p>
<div class="dim" id="pdone">${done} of ${PROG.length} done</div><div class="bar"><i id="pbar" style="width:${done/PROG.length*100}%"></i></div>
${groups.map(g=>`<h3>${g}</h3><div class="card">${PROG.map((p,i)=>p[0]===g?`<label class="chk"><input type="checkbox" data-p="${i}"${S.prog[i]?' checked':''}> ${esc(p[1])}</label>`:'').join('')}</div>`).join('')}
<button onclick="if(confirm('Clear all progression ticks?')){S.prog={};save();route()}">Reset</button>`;}

function pgNotes(){return `<h2>My Notes</h2><p class="sub">Saved automatically on this device.</p><textarea id="nt" style="width:100%;height:60vh" placeholder="Where your Shade is, which grub you heard but couldn't reach, which charm build beat which boss...">${esc(S.notes)}</textarea>`;}

/* ================= ROUTER ================= */
function route(keepScroll){
  const [pg,sub]=(location.hash.slice(1)||'home').split('/');
  const page=REAL.some(p=>p[0]===pg)?pg:'home';
  buildNav(page);
  const m=$('main'),top=m.scrollTop;
  m.innerHTML=({home:pgHome,guides:()=>pgGuides(sub),areas:()=>pgAreas(sub),bosses:()=>pgBosses(sub),endings:pgEndings,abilities:pgAbilities,charms:pgCharms,nail:pgNail,masks:pgMasks,completion:pgCompletion,grubs:pgGrubs,relics:pgRelics,essence:pgEssence,stags:pgStags,godhome:pgGodhome,progress:pgProgress,notes:pgNotes})[page]();
  m.scrollTop=keepScroll===true?top:0;
  m.querySelectorAll('input[type=checkbox][data-p]').forEach(cb=>{cb.onchange=()=>{S.prog[cb.dataset.p]=cb.checked;save();const d=PROG.filter((_,i)=>S.prog[i]).length;$('pdone').textContent=d+' of '+PROG.length+' done';$('pbar').style.width=d/PROG.length*100+'%';};});
  m.querySelectorAll('input[type=checkbox][data-hv]').forEach(cb=>{cb.onchange=()=>{S.have[cb.dataset.hv]=cb.checked;save();if(page==='abilities')route(true);};});
  m.querySelectorAll('input[type=checkbox][data-stag]').forEach(cb=>{cb.onchange=()=>{S.stags[cb.dataset.stag]=cb.checked;save();route(true);};});
  cntWire();
  if(page==='bosses')bossWire(sub);
  if(page==='charms')charmWire();
  if(page==='nail')nailWire();
  if(page==='relics')relicWire();
  if(page==='essence')$('ess').onchange=e=>{S.essence=Math.max(0,+e.target.value||0);save();route(true);};
  if(page==='godhome')godWire();
  if(page==='notes')$('nt').oninput=e=>{S.notes=e.target.value;save();};
}
window.addEventListener('hashchange',()=>route());
route();
</script>
</body>
</html>
